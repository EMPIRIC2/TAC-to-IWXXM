# Root Python workspace: exact-pin third-party deps to uv.lock (==).
# Tooling SSOT for the monorepo — [tool.ruff], [tool.pytest.ini_options],
# [tool.coverage.*], [tool.basedpyright]. Member packages should `extend`
# this file (or omit duplicate tables) so CI inherits one policy.
# [Corpus: tech-spec] TR-E04
[project]
name = "metar-iwxxm-workspace"
version = "0.0.0"
description = "uv workspace root for the TAC to IWXXM monorepo"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# Python floor: requires-python >=3.12 (ADR-005); basedpyright pythonVersion and ruff
# target-version stay at 3.12 so type-check and lint match the oldest supported runtime.
# CI/dev interpreters may be newer; do not raise these without superseding ADR-005.
# S008 F6 members: tac2iwxxm, iwxxm-validate, tac-validate.

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "ruff==0.15.17",
  "basedpyright==1.39.8",
  "pytest==9.1.0",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "httpx2==2.4.0",
  "respx==0.23.1",
  "maturin==1.14.1",
  "xsdata[cli]==26.2",
  "xsdata-pydantic==24.5",
  "metar-shared",
  "metar-backend",
  "metar-worker",
  "tac2iwxxm",
  "tac-decoding",
  "reference-lookup",
  "iwxxm-validate",
  "tac-validate",
  "iwxxm-dissemination",
  "workflows",
  "auth",
  "testcontainers[mysql,postgres]==4.14.2",
  "schemathesis==4.24.3",
  "pytest-gremlins==1.9.0",
  "import-linter==2.16",
  "deptry==0.25.1",
]

[tool.uv.sources]
metar-shared = { workspace = true }
metar-worker = { workspace = true }
metar-backend = { workspace = true }
auth = { workspace = true }
tac2iwxxm = { workspace = true }
tac-decoding = { workspace = true }
reference-lookup = { workspace = true }
iwxxm-validate = { workspace = true }
tac-validate = { workspace = true }
iwxxm-dissemination = { workspace = true }
workflows = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/shared",
  "packages/auth",
  "packages/tac2iwxxm",
  "packages/tac-decoding",
  "packages/reference-lookup",
  "packages/iwxxm-validate",
  "packages/tac-validate",
  "packages/dissemination",
  "packages/workflows",
  "apps/backend",
  "apps/worker",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "apps",
  "packages",
  "tests",
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "vendor",
  "apps/frontend/dist",
  "frontend/dist",
  # ADR-027 generated xsdata trees (T3.7)
  "packages/shared/src/metar_shared/iwxxm_xsd/v*",
  # tac2iwxxm split parts/shared/loaders exec'd into package ns (EV-tac2iwxxm-models-split)
  # Public types come from sibling __init__.pyi stubs.
  "packages/tac2iwxxm/src/tac2iwxxm/**/_part*.py",
  "packages/tac2iwxxm/src/tac2iwxxm/**/_shared.py",
  "packages/tac2iwxxm/src/tac2iwxxm/bulletin/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/conversion_templates/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/convert/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/emit_map/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/exchange_output/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/library_yaml/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_emit/sigmet/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/profiles/ca_eccc/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/slot_builders/metar_speci/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/slot_builders/sigmet_airmet/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/slot_builders/taf/__init__.py",
  "packages/tac2iwxxm/src/tac2iwxxm/slot_builders/vaa_tca/__init__.py",
]
reportMissingTypeStubs = false
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-v",
  "--strict-config",
  "--strict-markers",
  "--tb=short",
]
# Unexpected passes (XPASS) fail the run. The only intentional soft suite is the EV-023
# informative Amd79 convert test, which opts out per test with
# @pytest.mark.xfail(strict=False) (E23-T4=2); no other xfail may be non-strict.
xfail_strict = true
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "live: live staging connectivity (H4–H5)",
  "live_api: live deployed API smoke tests (H3)",
  "smoke: deploy smoke tests",
  "migration: monorepo migration gate tests (TC-M001–M005)",
  "slow: longer local/CI smokes (clean-venv wheel installs)",
  "iwxxm_translation_informative: Amd79-80-2023 TAC→2025-2 informative suite (EV-023; soft/xfail in CI)",
  "quality_matrix: F29 full pilot matrix slots (optional / make test-quality-matrices-full)",
  "ev032_smoke: EV-032 path-filtered pre-commit canary (A6-2 / VONA equality + enum; E32-T7)",
  "edge_case: conversion/validation edge-case corpus (filter with -m edge_case)",
  "schemathesis: OpenAPI property tests (make test-schemathesis)",
]
# ADR-048 / TC-EVDOC-007: warnings are errors. Narrow third-party-only ignore for
# passlib's crypt deprecation (stdlib path; not a product suppression).
# The pytest-gremlins "Coverage collection returned no data" warning is NOT ignored here;
# it is passed only via -W in scripts/ci/run_mutation_python.sh (mutation chunks).
filterwarnings = [
  "error",
  "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = [
  "**/tests/**",
  # ADR-027 generated xsdata trees (T3.7)
  "*/iwxxm_xsd/v*/**",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

# F34 / EV-059 / #874 — pytest-gremlins (TC-F34-003). Nightly/manual only; not every-PR.
# Per-target paths are passed via --gremlin-targets from scripts/ci/run_mutation_python.sh.
[tool.pytest-gremlins]
exclude = [
  "**/tests/**",
  "**/test_*.py",
  "**/conftest.py",
  "**/__pycache__/**",
  "**/migrations/**",
  "**/iwxxm_xsd/v*/**",
  "**/rust/**",
  "**/*.egg-info/**",
]
operators = ["comparison", "boundary", "boolean", "arithmetic", "return"]
report = ["console", "json"]
workers = 2
cache = true

# Ruff configuration — root workspace (ADR-005, ADR-053).
# ADR-048: pydocstyle (D) fail-closed with NumPy convention.
[tool.ruff]
target-version = "py312"
line-length = 88
# Import roots for isort first-party detection. Obsolete legacy roots (backend/, auth/,
# GIFTs/) were removed in the monorepo cutover. Per-member roots
# (apps/backend, apps/backend/src, apps/worker/src, packages/*/src) are the real import
# roots, but listing them reclassifies ~549 imports across ~518 files (I001), so that
# switch needs a dedicated `ruff check --select I --fix` PR. Until then keep the
# repo-level roots below.
src = [
  "apps",
  "packages",
  "tests",
]
extend-exclude = [
  # ADR-027 generated xsdata output (only exclusion) — regenerate via make codegen-iwxxm-xsd
  "packages/shared/src/metar_shared/iwxxm_xsd",
  "packages/shared/src/metar_shared/iwxxm_xsd/v*",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific
  "PERF",  # perflint
  "ASYNC", # flake8-async
  "PT",    # flake8-pytest-style
  "ANN",   # flake8-annotations (src only; tests ignored below)
  "D",     # pydocstyle — ADR-048 / TC-EVDOC-008
]
ignore = [
  "E501", # line length handled by formatter
  # NumPy / ADR-048 backfill style: summary on second line; D203 conflicts with D211
  "D203",
  "D212",
  # Descriptive summaries (not imperative verbs) are intentional in this corpus
  "D401",
  "D404",
  # One-line vs multi-line & blank-after-summary fight Examples sections
  "D200",
  "D205",
  "D400",
  "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ADR-056: max-complexity documented here; CI enforces via
# config/ruff-complexity.toml + make file-complexity.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "D"]
"**/test_*.py" = ["ANN", "D"]
"**/conftest.py" = ["ANN", "D"]
# lxml / PyO3 boundaries — third-party handles without complete stubs (typing-policy)
"packages/iwxxm-validate/src/iwxxm_validate/{canonical_xml,c14n,native,schematron,xsd}.py" = ["ANN401"]
# tac2iwxxm exec-namespace splits: _shared imports feed _part bodies via package globals
"packages/tac2iwxxm/src/tac2iwxxm/**/_shared.py" = ["F401", "F403", "I001", "E402"]
"packages/tac2iwxxm/src/tac2iwxxm/**/_part*.py" = ["F401", "F403", "F405", "F821", "E402", "I001", "D"]
"packages/tac2iwxxm/src/tac2iwxxm/**/__init__.py" = ["F401", "F403", "F405", "F821", "E402", "I001", "S102"]

[tool.ruff.lint.isort]
known-first-party = ["gifts", "auth", "shared", "metar_shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
