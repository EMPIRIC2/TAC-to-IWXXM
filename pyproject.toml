[project]
name = "metar-iwxxm-workspace"
version = "0.0.0"
description = "METAR to IWXXM monorepo — uv workspace root (ADR-005)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# Python 3.12 pinned per ADR-005; S008 F6 members: tac2iwxxm, iwxxm-validate, tac-validate.

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "ruff>=0.9",
  "basedpyright>=1.29",
  "pytest>=8.4",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "httpx2>=2.0",
  "respx>=0.21",
  "maturin>=1.7",
  "xsdata[cli]>=24.5",
  "xsdata-pydantic>=24.5",
  "metar-shared",
  "metar-backend",
  "metar-worker",
  "tac2iwxxm",
  "tac-decoding",
  "reference-lookup",
  "iwxxm-validate",
  "tac-validate",
  "dissemination",
  "workflows",
  "metar-auth",
  "testcontainers[mysql,postgres]>=4.8",
  "schemathesis==4.24.3",
  "pytest-gremlins==1.9.0",
]

[tool.uv.sources]
metar-shared = { workspace = true }
metar-worker = { workspace = true }
metar-backend = { workspace = true }
metar-auth = { workspace = true }
tac2iwxxm = { workspace = true }
tac-decoding = { workspace = true }
reference-lookup = { workspace = true }
iwxxm-validate = { workspace = true }
tac-validate = { workspace = true }
dissemination = { workspace = true }
workflows = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/shared",
  "packages/auth",
  "packages/tac2iwxxm",
  "packages/tac-decoding",
  "packages/reference-lookup",
  "packages/iwxxm-validate",
  "packages/tac-validate",
  "packages/dissemination",
  "packages/workflows",
  "apps/backend",
  "apps/worker",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "apps",
  "packages",
  "tests",
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "vendor",
  "apps/frontend/dist",
  "frontend/dist",
  # ADR-027 generated xsdata trees (T3.7)
  "packages/shared/src/metar_shared/iwxxm_xsd/v*",
]
reportMissingTypeStubs = false
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
]
# E23-T4=2: keep informative iwxxm_translation suite soft (xfail strict=False in tests).
xfail_strict = false
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "live: live staging connectivity (H4–H5)",
  "live_api: live deployed API smoke tests (H3)",
  "smoke: deploy smoke tests",
  "migration: monorepo migration gate tests (TC-M001–M005)",
  "slow: longer local/CI smokes (clean-venv wheel installs)",
  "iwxxm_translation_informative: Amd79-80-2023 TAC→2025-2 informative suite (EV-023; soft/xfail in CI)",
  "quality_matrix: F29 full pilot matrix slots (optional / make test-quality-matrices-full)",
  "ev032_smoke: EV-032 path-filtered pre-commit canary (A6-2 / VONA equality + enum; E32-T7)",
]
# ADR-048 / TC-EVDOC-007: warnings are errors. Narrow third-party-only ignore for
# passlib's crypt deprecation (stdlib path; not a product suppression).
# pytest-gremlins (F34 / mutation.yml): empty coverage pre-scan is advisory
# (https://github.com/mikelane/pytest-gremlins/issues/113). Also passed via -W in
# scripts/ci/run_mutation_python.sh so local/CI chunks do not abort.
filterwarnings = [
  "error",
  "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
  "ignore:Coverage collection returned no data:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = [
  "**/tests/**",
  # ADR-027 generated xsdata trees (T3.7)
  "*/iwxxm_xsd/v*/**",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

# F34 / EV-059 / #874 — pytest-gremlins (TC-F34-003). Nightly/manual only; not every-PR.
# Per-target paths are passed via --gremlin-targets from scripts/ci/run_mutation_python.sh.
[tool.pytest-gremlins]
exclude = [
  "**/tests/**",
  "**/test_*.py",
  "**/conftest.py",
  "**/__pycache__/**",
  "**/migrations/**",
  "**/iwxxm_xsd/v*/**",
  "**/rust/**",
  "**/*.egg-info/**",
]
operators = ["comparison", "boundary", "boolean", "arithmetic", "return"]
report = ["console", "json"]
workers = 2
cache = true

# Ruff configuration — root workspace (ADR-005, ADR-053).
# ADR-048: pydocstyle (D) fail-closed with NumPy convention.
[tool.ruff]
target-version = "py312"
line-length = 88
src = [
  "apps",
  "packages",
  "tests",
  "backend",
  "auth",
  "GIFTs",
]
extend-exclude = [
  # ADR-027 xsdata output — regenerate via make codegen-iwxxm-xsd
  "packages/shared/src/metar_shared/iwxxm_xsd",
  "packages/shared/src/metar_shared/iwxxm_xsd/v*",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific
  "PERF",  # perflint
  "ASYNC", # flake8-async
  "PT",    # flake8-pytest-style
  "ANN",   # flake8-annotations (src only; tests ignored below)
  "D",     # pydocstyle — ADR-048 / TC-EVDOC-008
]
ignore = [
  "E501", # line length handled by formatter
  # NumPy / ADR-048 backfill style: summary on second line; D203 conflicts with D211
  "D203",
  "D212",
  # Descriptive summaries (not imperative verbs) are intentional in this corpus
  "D401",
  "D404",
  # One-line vs multi-line & blank-after-summary fight Examples sections
  "D200",
  "D205",
  "D400",
  "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "D"]
"**/test_*.py" = ["ANN", "D"]
"**/conftest.py" = ["ANN", "D"]
# lxml / PyO3 boundaries — third-party handles without complete stubs (typing-policy)
"packages/iwxxm-validate/src/iwxxm_validate/{c14n,native,schematron,xsd}.py" = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["gifts", "auth", "shared", "metar_shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
