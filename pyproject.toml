[project]
name = "metar-iwxxm-workspace"
version = "0.0.0"
description = "METAR to IWXXM monorepo — uv workspace root (ADR-005)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# Python 3.12 pinned per ADR-005; S008 F6 members: tac2iwxxm, iwxxm-validate, tac-validate.

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "ruff>=0.9",
  "basedpyright>=1.29",
  "pytest>=8.4",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "httpx2>=2.0",
  "respx>=0.21",
  "maturin>=1.7",
  "xsdata[cli]>=24.5",
  "xsdata-pydantic>=24.5",
  "metar-shared",
  "metar-auth",
  "metar-backend",
  "metar-worker",
  "tac2iwxxm",
  "iwxxm-validate",
  "tac-validate",
]

[tool.uv.sources]
metar-shared = { workspace = true }
metar-auth = { workspace = true }
metar-backend = { workspace = true }
metar-worker = { workspace = true }
tac2iwxxm = { workspace = true }
iwxxm-validate = { workspace = true }
tac-validate = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/shared",
  "packages/auth",
  "packages/tac2iwxxm",
  "packages/iwxxm-validate",
  "packages/tac-validate",
  "apps/backend",
  "apps/worker",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "apps",
  "packages",
  "tests",
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "vendor",
  "apps/frontend/dist",
  "frontend/dist",
]
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "live: live staging connectivity (H4–H5)",
  "live_api: live deployed API smoke tests (H3)",
  "smoke: deploy smoke tests",
  "migration: monorepo migration gate tests (TC-M001–M005)",
  "slow: longer local/CI smokes (clean-venv wheel installs)",
]
filterwarnings = [
  "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = [
  "**/__init__.py",
  "**/tests/**",
]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = false
