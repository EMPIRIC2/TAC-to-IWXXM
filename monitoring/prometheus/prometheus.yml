global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: metar-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - metar-to-iwxxm-api:10000

  - job_name: locust
    metrics_path: /metrics
    static_configs:
      - targets:
          - locust-runner:9646
