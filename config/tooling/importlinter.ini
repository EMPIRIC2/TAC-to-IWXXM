# Import Linter contracts for the monorepo layering rules.
# [Corpus: system-spec] docs/architecture.md (package boundaries, "Decode must not
# import tac2iwxxm"); [Corpus: tech-spec] docs/technical-requirements.md (quality gates).
#
# Run: scripts/ci/run_import_linter.sh   (or: lint-imports --config config/tooling/importlinter.ini)
#
# The linter imports every root package, so all workspace members must be installed
# in the active environment (uv sync). Keep contracts minimal and true — add a contract
# only when the rule is stated in the architecture spec.
#
# Supabase is reached over HTTP (httpx) — no `supabase` SDK is installed, so Import
# Linter cannot graph it; deptry (missing/unused deps) guards against adding it.
#
# "apps" below means the deployable import roots (no top-level `apps` Python package
# exists): the worker (`metar_worker`) and the backend flat roots (`routers`, `clients`,
# `utilities`, `validation`; `apps/backend/src` is on sys.path, not a `src.*` package).

[importlinter]
root_packages =
    tac2iwxxm
    tac_decoding
    auth
    reference_lookup
    tac_validate
    iwxxm_validate
    dissemination
    workflows
    metar_shared
    metar_worker
    routers
    clients
    utilities
    validation
    fastapi
    starlette
include_external_packages = True

# --- tac2iwxxm: IWXXM serialization only (template-conformance separation of concerns)
[importlinter:contract:tac2iwxxm-no-web-or-apps]
name = tac2iwxxm must not import FastAPI, Supabase, or app code
type = forbidden
source_modules =
    tac2iwxxm
forbidden_modules =
    fastapi
    starlette
    metar_worker
    routers
    clients
    utilities
    validation
    auth

# --- tac-decoding: decode IR is upstream of tac2iwxxm (architecture: "Decode must not import tac2iwxxm")
[importlinter:contract:tac-decoding-no-tac2iwxxm]
name = tac-decoding must not import tac2iwxxm (or web/app code)
type = forbidden
source_modules =
    tac_decoding
forbidden_modules =
    tac2iwxxm
    fastapi
    starlette
    metar_worker
    routers
    clients
    utilities
    validation

# --- auth: JWT/Supabase middleware only; no conversion logic
[importlinter:contract:auth-no-conversion]
name = auth must not import conversion, decode, or validation packages
type = forbidden
source_modules =
    auth
forbidden_modules =
    tac2iwxxm
    tac_decoding
    tac_validate
    iwxxm_validate
    dissemination
    workflows

# --- libraries stay free of deployable app code (apps depend on packages, never reverse)
[importlinter:contract:packages-no-apps]
name = Library packages must not import app code
type = forbidden
source_modules =
    dissemination
    workflows
    reference_lookup
    tac_validate
    iwxxm_validate
    metar_shared
forbidden_modules =
    metar_worker
    routers
    clients
    utilities
    validation
