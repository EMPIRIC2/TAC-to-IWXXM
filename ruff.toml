# Ruff configuration — root workspace (ADR-005, execution plan §Tech Stack)
# Extended during Phase 1 scaffold (T1.8); includes legacy paths during migration.

target-version = "py312"
line-length = 88
src = [
  "apps",
  "packages",
  "tests",
  "backend",
  "auth",
  "GIFTs",
]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length handled by formatter
]

[lint.isort]
known-first-party = ["gifts", "auth", "shared", "metar_shared"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
