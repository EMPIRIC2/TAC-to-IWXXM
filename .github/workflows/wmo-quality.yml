# F26/F27 / EV-021 — combined WMO quality pack (extends E20-F3 / S02.L1)
# SIGMET (F23 keep-green) + AIRMET + METAR/SPECI/TAF + VAA + TCA.
# Complements ci-cd.yml; does not replace it.
name: WMO quality

on:
  push:
    branches: [main, stage, evolve/EV-020-airmet-quality, evolve/EV-021-vaa-quality]
    paths:
      - "packages/tac-validate/**"
      - "packages/tac2iwxxm/**"
      - "packages/iwxxm-validate/**"
      - "docs/domain/rules/**"
      - "docs/sessions/S027-vaa-quality/**"
      - "docs/sessions/S026-airmet-quality-wmo-examples/**"
      - "docs/sessions/S025-sigmet-quality/**"
      - "scripts/ci/run_wmo_quality.sh"
      - "scripts/ci/run_sigmet_quality.sh"
      - ".github/workflows/wmo-quality.yml"
  pull_request:
    paths:
      - "packages/tac-validate/**"
      - "packages/tac2iwxxm/**"
      - "packages/iwxxm-validate/**"
      - "docs/domain/rules/**"
      - "docs/sessions/S027-vaa-quality/**"
      - "docs/sessions/S026-airmet-quality-wmo-examples/**"
      - "docs/sessions/S025-sigmet-quality/**"
      - "scripts/ci/run_wmo_quality.sh"
      - "scripts/ci/run_sigmet_quality.sh"
      - ".github/workflows/wmo-quality.yml"
  workflow_dispatch:

jobs:
  wmo-quality:
    runs-on: ubuntu-latest
    name: WMO quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run WMO quality pack
        run: make test-wmo-quality
