# F34 / EV-059 / #874 — Mutation testing (pytest-gremlins + Stryker).
# Nightly / workflow_dispatch only — NOT required on every PR (D-S069-ci / TC-F34-005).
# Matrix covers Python packages/services + TS surfaces; excludes e2e + Rust.
name: Mutation

on:
  schedule:
    # Daily 05:00 UTC — after load-tests window
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Matrix target (all = full chunked matrix)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - poc-shared-env
          - backend
          - worker
          - auth
          - shared
          - tac-validate
          - tac2iwxxm
          - iwxxm-validate
          - dissemination
          - frontend
          - shared-js

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    name: Select mutation matrix
    outputs:
      python: ${{ steps.select.outputs.python }}
      js: ${{ steps.select.outputs.js }}
    steps:
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -euo pipefail
          all_py='["poc-shared-env","backend","worker","auth","shared","tac-validate","tac2iwxxm","iwxxm-validate","dissemination"]'
          all_js='["frontend","shared"]'
          if [[ "${EVENT_NAME}" == "schedule" || "${TARGET}" == "all" ]]; then
            echo "python=${all_py}" >> "$GITHUB_OUTPUT"
            echo "js=${all_js}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${TARGET}" in
            frontend)
              echo "python=[]" >> "$GITHUB_OUTPUT"
              echo 'js=["frontend"]' >> "$GITHUB_OUTPUT"
              ;;
            shared-js)
              echo "python=[]" >> "$GITHUB_OUTPUT"
              echo 'js=["shared"]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "python=[\"${TARGET}\"]" >> "$GITHUB_OUTPUT"
              echo "js=[]" >> "$GITHUB_OUTPUT"
              ;;
          esac

  python-mutation:
    name: gremlins (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: select-matrix
    if: needs.select-matrix.outputs.python != '[]'
    # Hard ceiling per chunk (TC-F34-005); soft timeout inside script is MUTATION_TIMEOUT_SEC.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-matrix.outputs.python) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run pytest-gremlins
        env:
          MUTATION_TIMEOUT_SEC: "1200"
        run: bash scripts/ci/run_mutation_python.sh "${{ matrix.target }}"

      - name: Upload gremlins reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-${{ matrix.target }}
          path: coverage/gremlins/
          if-no-files-found: ignore
          retention-days: 14

  js-mutation:
    name: stryker (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: select-matrix
    if: needs.select-matrix.outputs.js != '[]'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-matrix.outputs.js) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        env:
          MUTATION_TIMEOUT_SEC: "1200"
        run: bash scripts/ci/run_mutation_js.sh "${{ matrix.target }}"

      - name: Upload Stryker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-${{ matrix.target }}
          path: coverage/stryker/
          if-no-files-found: ignore
          retention-days: 14
