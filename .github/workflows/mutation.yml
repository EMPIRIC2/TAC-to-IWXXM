# F34 / EV-059 / #874 — Mutation testing (pytest-gremlins + Stryker).
# Nightly / workflow_dispatch only — NOT required on every PR (D-S069-ci / TC-F34-005).
# EV-ci-runtime-failures: Mon–Sat schedule = rotated subset; Sunday schedule +
# workflow_dispatch target=all = full Python+TS matrix (D-S069-e4 preserved).
# Matrix covers Python packages/services + TS surfaces; excludes e2e + Rust.
name: Mutation

on:
  schedule:
    # Daily 05:00 UTC — after load-tests window (subset Mon–Sat; full on Sunday)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Matrix target (all = full chunked matrix)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - poc-shared-env
          - backend
          - worker
          - auth
          - shared
          - tac-validate
          - tac2iwxxm
          - iwxxm-validate
          - dissemination
          - frontend
          - shared-js

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    name: Select mutation matrix
    outputs:
      python: ${{ steps.select.outputs.python }}
      js: ${{ steps.select.outputs.js }}
    steps:
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -euo pipefail
          all_py='["poc-shared-env","backend","worker","auth","shared","tac-validate","tac2iwxxm","iwxxm-validate","dissemination"]'
          all_js='["frontend","shared"]'
          # ISO weekday: 1=Mon … 7=Sun (UTC)
          dow="$(date -u +%u)"

          write_full() {
            echo "python=${all_py}" >> "$GITHUB_OUTPUT"
            echo "js=${all_js}" >> "$GITHUB_OUTPUT"
          }

          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${TARGET}" != "all" ]]; then
            case "${TARGET}" in
              frontend)
                echo "python=[]" >> "$GITHUB_OUTPUT"
                echo 'js=["frontend"]' >> "$GITHUB_OUTPUT"
                ;;
              shared-js)
                echo "python=[]" >> "$GITHUB_OUTPUT"
                echo 'js=["shared"]' >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "python=[\"${TARGET}\"]" >> "$GITHUB_OUTPUT"
                echo "js=[]" >> "$GITHUB_OUTPUT"
                ;;
            esac
            exit 0
          fi

          # Full matrix: workflow_dispatch all, or Sunday schedule
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]] || [[ "${dow}" == "7" ]]; then
            write_full
            exit 0
          fi

          # Daily Mon–Sat: rotate 3 Python targets + 1 JS surface (TC-F34-005)
          py_targets=(poc-shared-env backend worker auth shared tac-validate tac2iwxxm iwxxm-validate dissemination)
          js_targets=(frontend shared)
          n_py=${#py_targets[@]}
          start=$(( (dow - 1) % n_py ))
          picked=()
          for i in 0 1 2; do
            idx=$(( (start + i) % n_py ))
            picked+=("\"${py_targets[$idx]}\"")
          done
          js_idx=$(( (dow - 1) % ${#js_targets[@]} ))
          py_json="[${picked[0]},${picked[1]},${picked[2]}]"
          js_json="[\"${js_targets[$js_idx]}\"]"
          echo "Daily subset dow=${dow} python=${py_json} js=${js_json}"
          echo "python=${py_json}" >> "$GITHUB_OUTPUT"
          echo "js=${js_json}" >> "$GITHUB_OUTPUT"

  python-mutation:
    name: gremlins (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: select-matrix
    if: needs.select-matrix.outputs.python != '[]'
    # Hard ceiling per chunk (TC-F34-005); soft timeout inside script is MUTATION_TIMEOUT_SEC.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-matrix.outputs.python) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run pytest-gremlins
        env:
          MUTATION_TIMEOUT_SEC: "1200"
        run: bash scripts/ci/run_mutation_python.sh "${{ matrix.target }}"

      - name: Upload gremlins reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-${{ matrix.target }}
          path: coverage/gremlins/
          if-no-files-found: ignore
          retention-days: 14

  js-mutation:
    name: stryker (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: select-matrix
    if: needs.select-matrix.outputs.js != '[]'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-matrix.outputs.js) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        env:
          MUTATION_TIMEOUT_SEC: "1200"
        run: bash scripts/ci/run_mutation_js.sh "${{ matrix.target }}"

      - name: Upload Stryker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-${{ matrix.target }}
          path: coverage/stryker/
          if-no-files-found: ignore
          retention-days: 14
