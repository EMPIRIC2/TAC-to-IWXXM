# OpenAPI contract tooling: oasdiff (breaking changes) + Schemathesis report,
# summarised in one sticky PR comment. [Corpus: api] [Corpus: tests]
#
# - oasdiff is a hard gate on PRs (breaking change vs the base branch, or the
#   frontend OpenAPI copy drifting from docs/api/openapi.json).
# - The Schemathesis run here is report-only (continue-on-error). The required
#   Schemathesis gate stays in schemathesis.yml.
# Comment marker: <!-- tooling-contracts-pr-comment -->
name: Quality contracts

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Contracts path filter
    outputs:
      oasdiff: ${{ steps.filter.outputs.oasdiff }}
      schemathesis: ${{ steps.filter.outputs.schemathesis }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            oasdiff:
              - 'docs/api/openapi.json'
              - 'apps/frontend/openapi/**'
              - 'apps/backend/src/**'
              - 'scripts/ci/run_oasdiff.sh'
              - '.github/workflows/quality-contracts.yml'
            schemathesis:
              - 'apps/backend/**'
              - 'packages/auth/**'
              - 'packages/shared/**'
              - 'docs/api-contract.md'
              - 'uv.lock'
              - 'scripts/ci/format_contracts_pr_comment.py'
              - '.github/workflows/quality-contracts.yml'

  oasdiff:
    runs-on: ubuntu-latest
    name: oasdiff (OpenAPI breaking changes)
    needs: changes
    if: needs.changes.outputs.oasdiff == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          # Full history so origin/<base> resolves for `git show <base>:docs/api/openapi.json`.
          fetch-depth: 0

      - name: Run oasdiff
        env:
          OASDIFF_FAIL_ON: ERR
          OASDIFF_REQUIRE_BASE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/run_oasdiff.sh

      - name: Upload oasdiff reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-report-oasdiff
          path: .quality-reports/oasdiff*
          include-hidden-files: true
          if-no-files-found: ignore

  schemathesis-report:
    runs-on: ubuntu-latest
    name: Schemathesis report (non-blocking)
    needs: changes
    if: needs.changes.outputs.schemathesis == 'true' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    # Same hard ceiling as schemathesis.yml; do not raise without a decision.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run Schemathesis suite
        env:
          SCHEMATHESIS_MAX_EXAMPLES: "25"
        run: make test-schemathesis

      - name: Upload Schemathesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-report-schemathesis
          path: .quality-reports/schemathesis.*
          include-hidden-files: true
          if-no-files-found: ignore

  contracts-pr-comment:
    runs-on: ubuntu-latest
    name: Contracts PR comment
    needs: [changes, oasdiff, schemathesis-report]
    if: >-
      always() && github.event_name == 'pull_request' &&
      (needs.changes.outputs.oasdiff == 'true' || needs.changes.outputs.schemathesis == 'true')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Download contract reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: contracts-report-*
          path: .quality-reports
          merge-multiple: true

      - name: Format contracts markdown
        run: python3 scripts/ci/format_contracts_pr_comment.py .quality-reports > contracts-pr-comment.md

      - name: Post or update sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tooling-contracts-pr-comment -->';
            const body = fs.readFileSync('contracts-pr-comment.md', 'utf8');
            if (!body.includes(marker)) {
              core.setFailed('contracts comment missing sticky marker');
              return;
            }
            // Soft-fail transient GitHub API outages and fork PRs (read-only token) so a
            // sticky comment never fails the suite.
            const soft = new Set([403, 429, 500, 502, 503]);
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              const status = err.status ?? err.response?.status;
              if (soft.has(status)) {
                core.warning(`Contracts sticky comment skipped (GitHub API ${status}): ${err.message}`);
                return;
              }
              throw err;
            }

  contracts-gate:
    runs-on: ubuntu-latest
    name: Contracts gate
    needs: [changes, oasdiff]
    if: always()
    steps:
      - name: Require oasdiff when paths matched
        run: |
          run="${{ needs.changes.outputs.oasdiff }}"
          result="${{ needs.oasdiff.result }}"
          echo "path_filter_run=${run} oasdiff_result=${result}"
          if [ "${run}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Paths outside oasdiff filter - gate pass"
            exit 0
          fi
          test "${result}" = "success"
