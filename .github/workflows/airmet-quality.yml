# EV-029 / E29-T4=2 — AIRMET quality pack (M8 / TC-EV029-007 + F24 deepen).
# Separate per-family workflow (WA / iwxxm:AIRMET); complements root ci.yml
# and SIGMET-family packs.
name: AIRMET quality

on:
  push:
    branches: [main, evolve/EV-029-eight-family-ahl-rules]
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/sigmet_airmet.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_007_airmet_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/test_tc_f24_*.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_003_ahl_api.py"
      - "packages/tac2iwxxm/tests/fixtures/airmet/**"
      - "packages/tac2iwxxm/tests/fixtures/ahl/wa_airmet.txt"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/airmet*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/airmet*"
      - "packages/tac-validate/tests/test_tc_f24_*.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_airmet_quality.sh"
      - ".github/workflows/airmet-quality.yml"
  pull_request:
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/sigmet_airmet.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_007_airmet_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/test_tc_f24_*.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_003_ahl_api.py"
      - "packages/tac2iwxxm/tests/fixtures/airmet/**"
      - "packages/tac2iwxxm/tests/fixtures/ahl/wa_airmet.txt"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/airmet*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/airmet*"
      - "packages/tac-validate/tests/test_tc_f24_*.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_airmet_quality.sh"
      - ".github/workflows/airmet-quality.yml"
  workflow_dispatch:

jobs:
  airmet-quality:
    runs-on: ubuntu-latest
    name: AIRMET quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run AIRMET quality pack
        run: make test-airmet-quality
