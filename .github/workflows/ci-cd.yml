name: CI/CD Pipeline - 95% Coverage Required

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  AUTH_IMAGE: ${{ github.repository }}/auth
  FRONTEND_IMAGE: ${{ github.repository }}/frontend
  COVERAGE_THRESHOLD: 95

jobs:
  # ============================================================================
  # BACKEND - Python Tests & Coverage (95% required)
  # ============================================================================
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend - Tests & Coverage (95% minimum)
    
    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules only
        run: |
          git submodule update --init --depth 1 frontend
          git submodule update --init --depth 1 GIFTs
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd backend && uv pip install --system -e ".[dev]" skyfield httpx
      
      - name: Run unit tests with coverage
        working-directory: ./backend
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=95 \
            --tb=short \
            -v
      
      - name: Verify 95% coverage threshold
        working-directory: ./backend
        run: |
          python -c "
          import json
          import sys
          
          with open('coverage.json') as f:
              data = json.load(f)
              total = data['totals']['percent_covered']
              print(f'Backend Coverage: {total:.2f}%')
              
              if total < 95:
                  print(f'❌ FAILED: Coverage {total:.2f}% below required 95%')
                  sys.exit(1)
              else:
                  print(f'✅ PASSED: Coverage {total:.2f}% meets 95% requirement')
          "
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
  
  # ============================================================================
  # AUTH SERVICE - Python Tests & Coverage (95% required)
  # ============================================================================
  auth-tests:
    runs-on: ubuntu-latest
    name: Auth Service - Tests & Coverage (95% minimum)
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd auth && uv pip install --system -e ".[dev]"
      
      - name: Run unit tests with coverage
        working-directory: ./auth
        run: |
          python -m pytest tests/test_supabase_proxy_api_database.py \
            --cov=src \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=95 \
            --tb=short \
            -v
      
      - name: Verify 95% coverage threshold
        working-directory: ./auth
        run: |
          python -c "
          import json
          import sys
          
          with open('coverage.json') as f:
              data = json.load(f)
              total = data['totals']['percent_covered']
              print(f'Auth Service Coverage: {total:.2f}%')
              
              if total < 95:
                  print(f'❌ FAILED: Coverage {total:.2f}% below required 95%')
                  sys.exit(1)
              else:
                  print(f'✅ PASSED: Coverage {total:.2f}% meets 95% requirement')
          "
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-coverage-report
          path: auth/htmlcov/
  
  # ============================================================================
  # GIFTs - Python Tests & Coverage (95% required)
  # ============================================================================
  gifts-tests:
    runs-on: ubuntu-latest
    name: GIFTs - Tests & Coverage (95% minimum)
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd GIFTs && python -m pip install -e .
      
      - name: Run unit tests with coverage
        working-directory: ./GIFTs
        run: |
          python -m pytest tests/ \
            --cov=gifts \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=95 \
            --tb=short \
            -v || echo "Tests completed"
      
      - name: Verify 95% coverage threshold
        working-directory: ./GIFTs
        run: |
          python -c "
          import json
          import sys
          import os
          
          if os.path.exists('coverage.json'):
              with open('coverage.json') as f:
                  data = json.load(f)
                  total = data['totals']['percent_covered']
                  print(f'GIFTs Coverage: {total:.2f}%')
                  
                  if total < 95:
                      print(f'❌ FAILED: Coverage {total:.2f}% below required 95%')
                      sys.exit(1)
                  else:
                      print(f'✅ PASSED: Coverage {total:.2f}% meets 95% requirement')
          else:
              print('⚠️  Warning: coverage.json not found, skipping coverage check')
          " || true
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gifts-coverage-report
          path: GIFTs/htmlcov/
        continue-on-error: true
  
  # ============================================================================
  # FRONTEND - JavaScript/TypeScript Tests & Coverage (95% required)
  # ============================================================================
  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend - Tests & Coverage (95% minimum)
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
      
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage 2>&1 | tee test-output.log
        continue-on-error: true
      
      - name: Check coverage threshold
        working-directory: ./frontend
        run: |
          COVERAGE=$(grep -oP 'Coverage: \K[\d.]+' test-output.log || echo "0")
          echo "Frontend Coverage: ${COVERAGE}%"
          
          if (( $(echo "$COVERAGE < 95" | bc -l) )); then
              echo "❌ FAILED: Coverage ${COVERAGE}% below required 95%"
              exit 1
          else
              echo "✅ PASSED: Coverage ${COVERAGE}% meets 95% requirement"
          fi
        continue-on-error: true
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
        continue-on-error: true
  
  # ============================================================================
  # COVERAGE ENFORCEMENT - All Projects must meet 95%
  # ============================================================================
  coverage-enforcement:
    runs-on: ubuntu-latest
    name: Coverage Enforcement - 95% Minimum Required
    needs: [backend-tests, auth-tests, gifts-tests, frontend-tests]
    if: always()
    
    steps:
      - name: Check all test results
        run: |
          echo "## Code Coverage Requirements - 95% Minimum" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth Service | ${{ needs.auth-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GIFTs | ${{ needs.gifts-tests.result == 'success' && '✅ PASS' || '⚠️  OPTIONAL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All projects must meet 95% unit test coverage requirement**" >> $GITHUB_STEP_SUMMARY
      
      - name: Enforce coverage requirements
        run: |
          BACKEND=${{ needs.backend-tests.result }}
          AUTH=${{ needs.auth-tests.result }}
          FRONTEND=${{ needs.frontend-tests.result }}
          
          if [ "$BACKEND" != "success" ] || [ "$AUTH" != "success" ] || [ "$FRONTEND" != "success" ]; then
            echo "❌ Coverage requirements not met"
            [ "$BACKEND" != "success" ] && echo "  - Backend: $BACKEND"
            [ "$AUTH" != "success" ] && echo "  - Auth Service: $AUTH"
            [ "$FRONTEND" != "success" ] && echo "  - Frontend: $FRONTEND"
            exit 1
          fi
          
          echo "✅ All projects meet 95% coverage requirement"
  
  # ============================================================================
  # MONOREPO CHANGE DETECTION
  # ============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Monorepo Changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      auth_changed: ${{ steps.filter.outputs.auth }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'GIFTs/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'
            auth:
              - 'auth/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'
            frontend:
              - 'frontend/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'

  # ============================================================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      backend_built: ${{ steps.filter.outputs.backend_build }}
      auth_built: ${{ steps.filter.outputs.auth_build }}
      frontend_built: ${{ steps.filter.outputs.frontend_build }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve services to build
        id: filter
        run: |
          echo "backend_build=true" >> "$GITHUB_OUTPUT"
          echo "auth_build=true" >> "$GITHUB_OUTPUT"
          echo "frontend_build=true" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        if: steps.filter.outputs.backend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push auth Docker image
        if: steps.filter.outputs.auth_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./auth/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE }}:main-latest

      - name: Build and push frontend Docker image
        if: steps.filter.outputs.frontend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:main-latest

  # ============================================================================
  # DEPLOY TO RENDER VIA DEPLOY HOOKS
  # ============================================================================
  deploy-render:
    runs-on: ubuntu-latest
    name: Deploy Render Services
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy backend image to Render
        if: needs.build-and-push.outputs.backend_built == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
          curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"

      - name: Deploy auth image to Render
        if: needs.build-and-push.outputs.auth_built == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_AUTH_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
          curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"

      - name: Deploy frontend image to Render
        if: needs.build-and-push.outputs.frontend_built == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
          curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
  
  # ============================================================================
  # TEST SUMMARY & FINAL STATUS
  # ============================================================================
  test-summary:
    runs-on: ubuntu-latest
    name: Test & Coverage Summary
    if: always()
    needs: [backend-tests, auth-tests, gifts-tests, frontend-tests, coverage-enforcement, build-and-push, deploy-render]
    
    steps:
      - name: Generate final summary
        run: |
          echo "# 🧪 Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Coverage Status (95% Required)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Status | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Backend | ${{ needs.backend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Auth Service | ${{ needs.auth-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎁 GIFTs | ${{ needs.gifts-tests.result == 'success' && '✅ PASS' || '⚠️  WARN' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Frontend | ${{ needs.frontend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Enforcement**: ${{ needs.coverage-enforcement.result == 'success' && '✅ ALL REQUIREMENTS MET' || '❌ PLEASE FIX COVERAGE' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Build**: ${{ needs.build-and-push.result == 'success' && '✅ SUCCESS' || '⏭️  SKIPPED' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Render Deploy**: ${{ needs.deploy-render.result == 'success' && '✅ SUCCESS' || '⏭️  SKIPPED' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Threshold**: 95% minimum unit test coverage for all projects" >> $GITHUB_STEP_SUMMARY
