---
name: CI/CD Pipeline

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

env:
  REGISTRY: ghcr.io
  # GHCR owner/name are lowercase; repo lives under EMPIRIC2/TAC-to-IWXXM.
  BACKEND_IMAGE: empiric2/tac-to-iwxxm/backend
  FRONTEND_IMAGE: empiric2/tac-to-iwxxm/frontend
  WORKER_IMAGE: empiric2/tac-to-iwxxm/worker
  RENDER_DEPLOY_MODE: image
  # Canonical Supabase secrets (preferred). Deprecated FRONTEND_VITE_* kept for one-release shim.
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  FRONTEND_VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
  FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  # Default bake URLs are prod; Deploy jobs override per environment (EV-043).
  FRONTEND_VITE_APP_URL: https://app.tac-to-iwxxm.com
  FRONTEND_VITE_API_BASE_URL: https://api.tac-to-iwxxm.com

jobs:
  # EV-043 / TC-F30-012 — PRs to main must promote from stage after Staging smoke.
  staging-gate:
    runs-on: ubuntu-latest
    name: Staging gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Enforce promote-from-stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_API_URL: https://api.staging.tac-to-iwxxm.com
          # EV-044 staging cluster LB (Host-header fallback until Porkbun HTTPS).
          STAGING_LB_IP: "143.244.202.13"
          DOKS_LB_IP: "143.244.202.13"
          # pull_request GITHUB_SHA is a merge commit — gate the PR head tip on stage.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/staging_gate.sh

  # EV-036: remote validate job removed — lint/format/config on local pre-commit.
  # Unit matrix + coverage remain; Compose integration is local pre-push only.
  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            shared,
            auth,
            backend,
            frontend,
            tac2iwxxm,
            iwxxm-validate,
            tac-validate,
            dissemination,
            bugs,
          ]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        run: pnpm install --frozen-lockfile

      - name: Create frontend test environment file
        if: matrix.package == 'frontend'
        working-directory: ./apps/frontend
        run: |
          printf 'VITE_API_BASE_URL=http://localhost:18001\nVITE_APP_URL=http://localhost:18000\n' > .env

      - name: Run shared package tests
        if: matrix.package == 'shared'
        run: |
          uv run pytest packages/shared/tests --cov=metar_shared \
            --cov-config=packages/shared/pyproject.toml --cov-branch \
            --cov-report=xml:packages/shared/coverage.xml \
            --cov-report=term-missing --cov-fail-under=98 -v
          pnpm --filter @metar/shared run test:coverage

      - name: Run backend unit tests with coverage
        if: matrix.package == 'backend'
        run: |
          cd apps/backend && uv run pytest tests/unit \
            --cov=src --cov-config=pyproject.toml --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v

      # F31 / EV-031 T1.3 — JWKS Auth unit tests (tests/unit/auth). Coverage report only;
      # fail_under deferred until proxy/router surface is fully exercised.
      - name: Run auth unit tests with coverage
        if: matrix.package == 'auth'
        run: |
          uv run pytest tests/unit/auth --cov=metar_auth \
            --cov-config=packages/auth/pyproject.toml --cov-branch \
            --cov-report=xml:packages/auth/coverage.xml --cov-report=term-missing -v

      # EV-023 / E23-T4=2: TC-EV023-005 Amd79 informative cases use xfail(strict=False);
      # xfail_strict=false in packages/tac2iwxxm/pyproject.toml — soft failures must not hard-fail.
      - name: Run tac2iwxxm unit tests with coverage
        if: matrix.package == 'tac2iwxxm'
        run: |
          uv run pytest packages/tac2iwxxm/tests --cov=tac2iwxxm \
            --cov-config=packages/tac2iwxxm/pyproject.toml --cov-branch \
            --cov-report=xml:packages/tac2iwxxm/coverage.xml \
            --cov-report=term-missing --cov-fail-under=95 -v

      - name: Install Rust toolchain (iwxxm-validate native)
        if: matrix.package == 'iwxxm-validate'
        uses: dtolnay/rust-toolchain@stable

      - name: Build iwxxm-validate._rust extension
        if: matrix.package == 'iwxxm-validate'
        working-directory: packages/iwxxm-validate
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          uv pip install maturin
          # CLI + validate_iwxxm hot path need xmloxide; lxml alone hits SCHEMA_PARSE_ERROR
          # on GML/ISO imports for WMO examples (F13 / T3.9).
          uv run maturin develop --manifest-path rust/Cargo.toml --uv

      - name: Run iwxxm-validate unit tests with coverage
        if: matrix.package == 'iwxxm-validate'
        run: |
          uv run pytest packages/iwxxm-validate/tests --cov=iwxxm_validate \
            --cov-config=packages/iwxxm-validate/pyproject.toml --cov-branch \
            --cov-report=xml:packages/iwxxm-validate/coverage.xml \
            --cov-report=term-missing --cov-fail-under=95 -v

      - name: Run tac-validate unit tests with coverage
        if: matrix.package == 'tac-validate'
        run: |
          uv run pytest packages/tac-validate/tests --cov=tac_validate \
            --cov-config=packages/tac-validate/pyproject.toml --cov-branch \
            --cov-report=xml:packages/tac-validate/coverage.xml \
            --cov-report=term-missing --cov-fail-under=95 -v

      # F16–F19 / T0.1 — skips until packages/dissemination is scaffolded (T1.1/T1.2).
      - name: Run dissemination unit tests with coverage
        if: matrix.package == 'dissemination'
        run: bash scripts/ci/run_dissemination_coverage.sh

      # F16 / T2.5 — TC-F16-003 PG+MySQL Testcontainers + SQLite (skip PG/MySQL if no Docker).
      - name: Run dissemination multi-DB integration tests
        if: matrix.package == 'dissemination'
        run: make test-integration-dissemination

      - name: Run frontend tests with coverage
        if: matrix.package == 'frontend'
        run: pnpm --filter @metar/frontend run test:coverage

      - name: Run bug regression tests (tests/bugs)
        if: matrix.package == 'bugs'
        run: uv run pytest tests/bugs -m "not live and not live_api" --no-cov -v

      - name: Upload package coverage XML artifact
        if: always() && contains(fromJSON('["shared","auth","backend","tac2iwxxm","iwxxm-validate","tac-validate"]'), matrix.package)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.package }}
          path: |
            apps/backend/coverage.xml
            packages/shared/coverage.xml
            packages/auth/coverage.xml
            packages/tac2iwxxm/coverage.xml
            packages/iwxxm-validate/coverage.xml
            packages/tac-validate/coverage.xml
          if-no-files-found: ignore

      - name: Upload frontend coverage artifact
        if: always() && matrix.package == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: apps/frontend/coverage/
          if-no-files-found: ignore

  # EV-036 — sticky PR comment with coverage summary (no Codecov; local artifacts only).
  coverage-pr-comment:
    runs-on: ubuntu-latest
    name: Coverage PR comment
    needs: [test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-xml-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Download frontend coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: coverage-artifacts/frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format coverage markdown
        id: cov
        run: |
          python3 scripts/ci/format_coverage_pr_comment.py coverage-artifacts \
            > coverage-pr-comment.md
          {
            echo "body<<EOF"
            cat coverage-pr-comment.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- EV-036-coverage-comment -->';
            const body = fs.readFileSync('coverage-pr-comment.md', 'utf8');
            if (!body.includes(marker)) {
              core.setFailed('coverage comment missing sticky marker');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # F30 / EV-031 T2.3 — Postgres service + idempotent alembic upgrade head (TC-EV031-002).
  test-alembic:
    runs-on: ubuntu-latest
    name: Test (alembic / TC-EV031-002)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tac_alembic_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tac_alembic_test
      ALEMBIC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tac_alembic_test
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Alembic upgrade head (twice — must be idempotent)
        run: |
          make db-migrate
          make db-migrate

      - name: TC-EV031-002 layout + live upgrade tests
        run: make test-alembic

  # ============================================================================
  # NATIVE — tac2iwxxm PyO3 / maturin scaffold (ADR-017 / T4.3)
  # ============================================================================
  tac2iwxxm-native:
    runs-on: ubuntu-latest
    name: tac2iwxxm PyO3 (maturin)
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv + workspace
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: uv pip install maturin

      - name: Build tac2iwxxm._rust extension
        working-directory: packages/tac2iwxxm
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          uv run maturin develop --manifest-path rust/Cargo.toml --uv

      - name: Smoke-test required native extension
        env:
          TAC2IWXXM_REQUIRE_RUST: '1'
        run: |
          uv run pytest packages/tac2iwxxm/tests/test_native_scaffold.py \
            packages/tac2iwxxm/tests/test_pyo3_hotspots.py -v --no-cov

  # ============================================================================
  # E2E SMOKE — Playwright browser smoke (auth bootstrap + TAC conversion)
  # Free on public repos (ubuntu-latest). Self-contained: config/local.json sets
  # disableAuth=true, so no Supabase secrets are required (mock session path).
  # ============================================================================
  e2e-smoke:
    runs-on: ubuntu-latest
    name: E2E Smoke (Playwright)
    env:
      METAR_CONFIG_ENV: local

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @metar/e2e exec playwright install --with-deps chromium

      - name: Run Playwright smoke specs
        run: make test-e2e-playwright-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  # ============================================================================
  # DEPLOY — build/push GHCR images, then roll DOKS (F30 / EV-034 / EV-043 / EV-044).
  # stage → staging cluster (env staging); main → prod cluster (env production).
  # Promote to main only via PR stage→main after Staging smoke + staging-gate (ADR-034).
  # Render hooks optional (main only).
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy (${{ github.ref_name }})
    needs: [test, test-alembic, tac2iwxxm-native]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
      RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Resolve deploy target
        id: target
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "namespace=metar-iwxxm" >> "$GITHUB_OUTPUT"
            echo "latest_tag=main-latest" >> "$GITHUB_OUTPUT"
            echo "app_url=https://app.tac-to-iwxxm.com" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.tac-to-iwxxm.com" >> "$GITHUB_OUTPUT"
            echo "env_role=prod" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=metar-iwxxm-staging" >> "$GITHUB_OUTPUT"
            echo "latest_tag=stage-latest" >> "$GITHUB_OUTPUT"
            echo "app_url=https://app.staging.tac-to-iwxxm.com" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.staging.tac-to-iwxxm.com" >> "$GITHUB_OUTPUT"
            echo "env_role=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard CD credentials (skip if GHCR unavailable)
        id: guard
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "::notice::GITHUB_TOKEN unavailable for GHCR — skipping Deploy"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin; then
            echo "::notice::GHCR login failed — skipping Deploy"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true

          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (with retry)
        if: steps.guard.outputs.skip != 'true'
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5"

            if timeout 90 sh -c "printf '%s' \"\$REGISTRY_PASSWORD\" | docker login \"\$REGISTRY\" -u \"\$REGISTRY_USERNAME\" --password-stdin"; then
              echo "Registry login succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 10))
              echo "Login attempt ${attempt} failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Registry login failed after 5 attempts"
          exit 1

      - name: Generate image tags
        if: steps.guard.outputs.skip != 'true'
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.target.outputs.latest_tag }}

      - name: Build and push frontend Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.FRONTEND_VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_APP_URL=${{ steps.target.outputs.app_url }}
            VITE_API_BASE_URL=${{ steps.target.outputs.api_url }}
            VITE_FRONTEND_DEPLOY_MARK=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.target.outputs.latest_tag }}

      - name: Build and push worker Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.target.outputs.latest_tag }}

      - name: Optional Render hooks (non-blocking, main/prod only)
        if: steps.guard.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
          RENDER_SKIP_IF_SUSPENDED: "1"
        run: |
          set +e
          echo "Live traffic is DOKS. Render hooks optional (skip-if-suspended)."
          if [ -n "${RENDER_BACKEND_DEPLOY_HOOK:-}" ]; then
            if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
              python3 scripts/deploy/trigger_render_image_deploy.py \
                --deploy-hook "${RENDER_BACKEND_DEPLOY_HOOK}" \
                --image-url "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${IMAGE_TAG}" \
                --service-name metar-to-iwxxm-api \
                --skip-if-suspended || echo "::warning::Render backend hook failed (ignored)"
            else
              curl -fsSL "${RENDER_BACKEND_DEPLOY_HOOK}" || echo "::warning::Render backend hook failed (ignored)"
            fi
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK unset — skipping"
          fi
          if [ -n "${RENDER_FRONTEND_DEPLOY_HOOK:-}" ]; then
            if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
              python3 scripts/deploy/trigger_render_image_deploy.py \
                --deploy-hook "${RENDER_FRONTEND_DEPLOY_HOOK}" \
                --image-url "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${IMAGE_TAG}" \
                --service-name metar-to-iwxxm-frontend-v4-web \
                --skip-if-suspended || echo "::warning::Render frontend hook failed (ignored)"
            else
              curl -fsSL "${RENDER_FRONTEND_DEPLOY_HOOK}" || echo "::warning::Render frontend hook failed (ignored)"
            fi
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK unset — skipping"
          fi

      - name: Set up kubectl
        if: steps.guard.outputs.skip != 'true'
        uses: azure/setup-kubectl@v4

      - name: Roll out DOKS images
        if: steps.guard.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
          DOKS_NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "::error::Missing required secret KUBE_CONFIG (base64 kubeconfig for DOKS)"
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          if ! printf '%s' "${KUBE_CONFIG}" | base64 --decode > "${HOME}/.kube/config" 2>/dev/null; then
            echo "::error::KUBE_CONFIG is not valid base64"
            exit 1
          fi
          chmod 600 "${HOME}/.kube/config"
          if grep -qE 'command:[[:space:]]*doctl' "${HOME}/.kube/config"; then
            echo "::error::KUBE_CONFIG uses doctl exec auth; use a ServiceAccount token kubeconfig (docs/deploy.md)"
            exit 1
          fi
          echo "Rolling DOKS env_role=${{ steps.target.outputs.env_role }} ns=${DOKS_NAMESPACE} tag=${IMAGE_TAG}"
          bash scripts/deploy/doks_rollout_images.sh "${IMAGE_TAG}"

      - name: CD skipped (credentials)
        if: steps.guard.outputs.skip == 'true'
        run: echo "Deploy skipped — GHCR package write unavailable for EMPIRIC2."

  staging-smoke:
    runs-on: ubuntu-latest
    name: Staging smoke
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage' && needs.deploy.result == 'success'
    permissions:
      contents: read
    env:
