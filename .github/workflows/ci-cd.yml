---
name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/backend
  AUTH_IMAGE: joseph-c-mcguire/metar-to-iwxxm/auth
  FRONTEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/frontend
  FRONTEND_SOURCE_REPO: https://github.com/joseph-c-mcguire/Metartoiwxxmfrontend.git
  RENDER_DEPLOY_MODE: image
  FRONTEND_VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
  FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  FRONTEND_VITE_APP_URL: https://metar-to-iwxxm-frontend-v4-web.onrender.com
  FRONTEND_VITE_BACKEND_URL: https://metar-to-iwxxm-api.onrender.com
  FRONTEND_VITE_AUTH_SERVICE_URL: https://metar-to-iwxxm-auth-v2.onrender.com

jobs:
  # ============================================================================
  # CONFIG GUARD — fail fast if placeholder Supabase credentials are committed
  # ============================================================================
  config-guard:
    runs-on: ubuntu-latest
    name: Config Placeholder Guard
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest --quiet

      - name: Run placeholder regression tests
        run: pytest tests/test_config_placeholders.py -v

  # ============================================================================
  # BACKEND - Python Tests & Coverage
  # ============================================================================
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend - Tests & Coverage

    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize required submodules only
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1 frontend
          git submodule update --init GIFTs || {
            echo "Initial GIFTs fetch failed; retrying with explicit remote fetch"
            git -C GIFTs fetch --tags --force origin
            git submodule update --init GIFTs
          }
          git -C GIFTs rev-parse --short HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd backend && uv pip install --system -e "." "pytest>=8.4.2" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.0" skyfield httpx

      - name: Run linting
        run: make lint-backend

      - name: Run unit tests with coverage
        run: make test-unit-backend

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: |
            backend/htmlcov/
            backend/coverage.xml

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true

  # ============================================================================
  # AUTH SERVICE - Python Tests & Coverage
  # ============================================================================
  auth-tests:
    runs-on: ubuntu-latest
    name: Auth Service - Tests & Coverage

    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize required submodules only
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1 frontend
          git submodule update --init GIFTs || {
            echo "Initial GIFTs fetch failed; retrying with explicit remote fetch"
            git -C GIFTs fetch --tags --force origin
            git submodule update --init GIFTs
          }
          git -C GIFTs rev-parse --short HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd auth && uv pip install --system -e ".[dev]"
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run linting
        run: make lint-auth

      - name: Run unit tests with coverage
        run: make test-unit-auth

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-coverage-report
          path: |
            auth/htmlcov/
            auth/coverage.xml

      - name: Upload auth coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./auth/coverage.xml
          flags: auth
          name: auth-coverage
          fail_ci_if_error: true

  # ============================================================================
  # GIFTs - Python Tests & Coverage
  # ============================================================================
  gifts-tests:
    runs-on: ubuntu-latest
    name: GIFTs - Tests & Coverage

    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize GIFTs submodule
        run: |
          git submodule sync --recursive
          git submodule update --init GIFTs || {
            echo "Initial GIFTs fetch failed; retrying with explicit remote fetch"
            git -C GIFTs fetch --tags --force origin
            git submodule update --init GIFTs
          }
          git -C GIFTs rev-parse --short HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd GIFTs && uv pip install --system -e ".[test]"

      - name: Run linting
        run: make lint-gifts

      - name: Run unit tests with coverage
        run: make test-unit-gifts

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gifts-coverage-report
          path: |
            GIFTs/htmlcov/
            GIFTs/coverage.xml
        continue-on-error: true

      - name: Upload GIFTs coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./GIFTs/coverage.xml
          flags: gifts
          name: gifts-coverage
          fail_ci_if_error: true

  # ============================================================================
  # FRONTEND - JavaScript/TypeScript Tests & Coverage
  # ============================================================================
  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend - Tests & Coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Avoid recursive checkout failure from schemas/iwxxm-backup missing URL
          submodules: false

      - name: Initialize frontend submodule only
        run: |
          git submodule sync -- frontend
          git submodule update --init --depth 1 frontend

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Create test environment file
        working-directory: ./frontend
        run: |
          printf 'VITE_AUTH_SERVICE_URL=http://localhost:8003\nVITE_APP_URL=http://localhost:8000\nVITE_BACKEND_URL=http://localhost:8001\n' > .env

      - name: Run linting
        run: make lint-frontend

      - name: Run tests with coverage
        run: make test-unit-frontend

      - name: Report coverage summary
        working-directory: ./frontend
        run: |
          COVERAGE=$(grep -oP 'All files\s*\|\s*\K[\d.]+' coverage/lcov-report/index.html || echo "0")
          echo "Frontend Coverage: ${COVERAGE}%"
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true

  # ============================================================================
  # INTEGRATION MATRIX - Cross-service integration checks
  # ============================================================================
  integration-matrix:
    runs-on: ubuntu-latest
    name: Integration Matrix
    needs: [backend-tests, auth-tests, gifts-tests, frontend-tests]
    continue-on-error: true  # non-blocking: services aren't built yet during test phase

    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize required submodules only
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1 frontend
          git submodule update --init GIFTs || {
            echo "Initial GIFTs fetch failed; retrying with explicit remote fetch"
            git -C GIFTs fetch --tags --force origin
            git submodule update --init GIFTs
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd backend
          uv pip install --system -e "." "pytest>=8.4.2" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.0"
          cd ../auth
          python -m pip install "passlib[bcrypt]>=1.7" "email-validator>=2.0.0.post2" "supabase>=2.7.0,<3.0" "python-dotenv>=1.0.0" "psycopg2-binary>=2.9.9"

      - name: Set integration stack environment
        run: |
          {
            echo "SUPABASE_URL=${FRONTEND_VITE_SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}"
            echo "VITE_SUPABASE_URL=${FRONTEND_VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}"
          } >> "$GITHUB_ENV"

      - name: Start service stack
        run: |
          docker compose up -d auth backend frontend
          sleep 30

      - name: Run cross-service integration tests
        run: |
          python -m pytest tests/test_backend_auth_integration.py tests/test_backend_frontend_integration.py tests/test_auth_frontend_integration.py tests/test_gifts_backend_integration.py tests/test_integration.py -v

      - name: Run backend integration smoke checks
        working-directory: ./backend
        run: |
          python -m pytest tests/infrastructure/test_smoke.py -k "cor or conversion or workflow" -q

      - name: Stop service stack
        if: always()
        run: docker compose down

  # ============================================================================
  # TEST RESULT AGGREGATION
  # ============================================================================
  coverage-enforcement:
    runs-on: ubuntu-latest
    name: Test Result Aggregation
    needs: [config-guard, backend-tests, auth-tests, gifts-tests, frontend-tests]
    if: always()

    steps:
      - name: Check all test results
        run: |
          {
            echo "## Test Status Summary"
            echo ""
            echo "| Project | Status |"
            echo "|---------|--------|"
            echo "| Config Guard | ${{ needs.config-guard.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Backend | ${{ needs.backend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Auth Service | ${{ needs.auth-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| GIFTs | ${{ needs.gifts-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Frontend | ${{ needs.frontend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo ""
            echo "**Coverage gate**: Codecov enforces **per-service** coverage at **95%** (backend, auth, frontend, GIFTs)."
            echo "Note: Coverage gate enforced via Codecov per-service reports."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required test jobs
        run: |
          CONFIG=${{ needs.config-guard.result }}
          BACKEND=${{ needs.backend-tests.result }}
          AUTH=${{ needs.auth-tests.result }}
          FRONTEND=${{ needs.frontend-tests.result }}
          GIFTS=${{ needs.gifts-tests.result }}

          if [ "$CONFIG" != "success" ] || [ "$BACKEND" != "success" ] || [ "$AUTH" != "success" ] || [ "$FRONTEND" != "success" ] || [ "$GIFTS" != "success" ]; then
            echo "❌ Required test jobs failed"
            [ "$CONFIG" != "success" ] && echo "  - Config Guard: $CONFIG"
            [ "$BACKEND" != "success" ] && echo "  - Backend: $BACKEND"
            [ "$AUTH" != "success" ] && echo "  - Auth Service: $AUTH"
            [ "$FRONTEND" != "success" ] && echo "  - Frontend: $FRONTEND"
            [ "$GIFTS" != "success" ] && echo "  - GIFTs: $GIFTS"
            exit 1
          fi

          echo "✅ Required test jobs passed"

  # ============================================================================
  # MONOREPO CHANGE DETECTION
  # ============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Monorepo Changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      auth_changed: ${{ steps.filter.outputs.auth }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'GIFTs/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'
            auth:
              - 'auth/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'
            frontend:
              - 'frontend/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'

  # ============================================================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Images
    needs: [coverage-enforcement]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.coverage-enforcement.result == 'success'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      backend_built: ${{ steps.filter.outputs.backend_build }}
      frontend_built: ${{ steps.filter.outputs.frontend_build }}

    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init GIFTs || {
            echo "Initial GIFTs fetch failed; retrying with explicit remote fetch"
            git -C GIFTs fetch --tags --force origin
            git submodule update --init GIFTs
          }
          git -C GIFTs rev-parse --short HEAD

      - name: Clone frontend source repository
        run: |
          git clone --depth 1 "${{ env.FRONTEND_SOURCE_REPO }}" _frontend_src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (with retry)
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5"

            if timeout 90 sh -c "printf '%s' \"\$REGISTRY_PASSWORD\" | docker login \"\$REGISTRY\" -u \"\$REGISTRY_USERNAME\" --password-stdin"; then
              echo "Registry login succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 10))
              echo "Login attempt ${attempt} failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Registry login failed after 5 attempts"
          exit 1

      - name: Generate image tags
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve services to build
        id: filter
        run: |
          {
            echo "backend_build=true"
            echo "frontend_build=true"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        if: steps.filter.outputs.backend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push frontend Docker image
        if: steps.filter.outputs.frontend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./_frontend_src
          file: ./_frontend_src/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.FRONTEND_VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_APP_URL=${{ env.FRONTEND_VITE_APP_URL }}
            VITE_BACKEND_URL=${{ env.FRONTEND_VITE_BACKEND_URL }}
            VITE_AUTH_SERVICE_URL=${{ env.FRONTEND_VITE_AUTH_SERVICE_URL }}
            VITE_FRONTEND_DEPLOY_MARK=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:main-latest

  # ============================================================================
  # DEPLOY TO RENDER VIA DEPLOY HOOKS
  # ============================================================================
  deploy-render:
    runs-on: ubuntu-latest
    name: Deploy Render Services
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_AUTH_DEPLOY_HOOK: ${{ secrets.RENDER_AUTH_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}

    steps:
      - name: Report deploy hook configuration
        run: |
          [ -n "${RENDER_BACKEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_BACKEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_BACKEND_DEPLOY_HOOK is missing"
          [ -n "${RENDER_AUTH_DEPLOY_HOOK}" ] && echo "✅ RENDER_AUTH_DEPLOY_HOOK is set" || echo "⚠️  RENDER_AUTH_DEPLOY_HOOK is missing"
          [ -n "${RENDER_FRONTEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_FRONTEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_FRONTEND_DEPLOY_HOOK is missing"

      - name: Enforce backend deploy hook presence
        run: |
          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK}" ]; then
            echo "❌ Missing required secret: RENDER_BACKEND_DEPLOY_HOOK"
            exit 1
          fi

      - name: Deploy backend image to Render
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_BACKEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: Deploy auth image to Render
        if: env.RENDER_AUTH_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_AUTH_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: Deploy frontend image to Render
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

  # ============================================================================
  # TEST SUMMARY & FINAL STATUS
  # ============================================================================
  test-summary:
    runs-on: ubuntu-latest
    name: Test & Coverage Summary
    if: always()
    needs: [backend-tests, auth-tests, gifts-tests, frontend-tests, integration-matrix, coverage-enforcement, build-and-push, deploy-render]

    steps:
      - name: Generate final summary
        run: |
          {
            echo "# 🧪 Test & Coverage Summary"
            echo ""
            echo "## Coverage Status"
            echo ""
            echo "| Project | Status | Coverage |"
            echo "|---------|--------|----------|"
            echo "| 🔧 Backend | ${{ needs.backend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |"
            echo "| 🔐 Auth Service | ${{ needs.auth-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |"
            echo "| 🎁 GIFTs | ${{ needs.gifts-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |"
            echo "| 🎨 Frontend | ${{ needs.frontend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |"
            echo "| 🔗 Integration Matrix | ${{ needs.integration-matrix.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Service interoperability |"
            echo ""
            echo "## Overall Status"
            echo ""
            echo "**Required Test Jobs**: ${{ needs.coverage-enforcement.result == 'success' && '✅ PASSING' || '❌ FAILING' }}"
            echo "**Docker Build**: ${{ needs.build-and-push.result == 'success' && '✅ SUCCESS' || '⏭️  SKIPPED' }}"
            echo "**Render Deploy**: ${{ needs.deploy-render.result == 'success' && '✅ SUCCESS' || '⏭️  SKIPPED' }}"
            echo ""
            echo "> **Policy**: Per-service coverage is hard-gated by Codecov at **95%**."
          } >> "$GITHUB_STEP_SUMMARY"
