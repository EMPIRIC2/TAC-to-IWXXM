---
name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  # GHCR owner/name are lowercase; repo lives under EMPIRIC2/TAC-to-IWXXM.
  BACKEND_IMAGE: empiric2/tac-to-iwxxm/backend
  FRONTEND_IMAGE: empiric2/tac-to-iwxxm/frontend
  WORKER_IMAGE: empiric2/tac-to-iwxxm/worker
  # Canonical Supabase secrets (preferred). Deprecated FRONTEND_VITE_* kept for one-release shim.
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  FRONTEND_VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
  FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  # T6.5 / D-S038-t65-waive — Render retired; provisional DOKS placeholders (D-S038-t63-waive).
  FRONTEND_VITE_APP_URL: http://app.doks.placeholder.metar-iwxxm.local
  FRONTEND_VITE_API_BASE_URL: http://api.doks.placeholder.metar-iwxxm.local

jobs:
  # ============================================================================
  # VALIDATE — format, lint, typecheck, secrets, yaml, config-guard, npm audit
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    name: Validate

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate gates
        run: make validate-ci

  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.package }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            shared,
            auth,
            backend,
            frontend,
            tac2iwxxm,
            iwxxm-validate,
            tac-validate,
            dissemination,
            integration,
            bugs,
          ]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        run: pnpm install --frozen-lockfile

      - name: Create frontend test environment file
        if: matrix.package == 'frontend'
        working-directory: ./apps/frontend
        run: |
          printf 'VITE_API_BASE_URL=http://localhost:18001\nVITE_APP_URL=http://localhost:18000\n' > .env

      - name: Run shared package tests
        if: matrix.package == 'shared'
        run: |
          uv run pytest packages/shared/tests --cov=metar_shared \
            --cov-config=packages/shared/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=98 -v
          pnpm --filter @metar/shared run test:coverage

      - name: Run backend unit tests with coverage
        if: matrix.package == 'backend'
        run: |
          cd apps/backend && uv run pytest tests/unit \
            --cov=src --cov-config=pyproject.toml --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v

      # F31 / EV-031 T1.3 — JWKS Auth unit tests (tests/unit/auth). Coverage report only;
      # fail_under deferred until proxy/router surface is fully exercised.
      - name: Run auth unit tests with coverage
        if: matrix.package == 'auth'
        run: |
          uv run pytest tests/unit/auth --cov=metar_auth \
            --cov-config=packages/auth/pyproject.toml --cov-branch \
            --cov-report=xml:packages/auth/coverage.xml --cov-report=term-missing -v

      # EV-023 / E23-T4=2: TC-EV023-005 Amd79 informative cases use xfail(strict=False);
      # xfail_strict=false in packages/tac2iwxxm/pyproject.toml — soft failures must not hard-fail.
      - name: Run tac2iwxxm unit tests with coverage
        if: matrix.package == 'tac2iwxxm'
        run: |
          uv run pytest packages/tac2iwxxm/tests --cov=tac2iwxxm \
            --cov-config=packages/tac2iwxxm/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=95 -v

      - name: Install Rust toolchain (iwxxm-validate native)
        if: matrix.package == 'iwxxm-validate'
        uses: dtolnay/rust-toolchain@stable

      - name: Build iwxxm-validate._rust extension
        if: matrix.package == 'iwxxm-validate'
        working-directory: packages/iwxxm-validate
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          uv pip install maturin
          # CLI + validate_iwxxm hot path need xmloxide; lxml alone hits SCHEMA_PARSE_ERROR
          # on GML/ISO imports for WMO examples (F13 / T3.9).
          uv run maturin develop --manifest-path rust/Cargo.toml --uv

      - name: Run iwxxm-validate unit tests with coverage
        if: matrix.package == 'iwxxm-validate'
        run: |
          uv run pytest packages/iwxxm-validate/tests --cov=iwxxm_validate \
            --cov-config=packages/iwxxm-validate/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=95 -v

      - name: Run tac-validate unit tests with coverage
        if: matrix.package == 'tac-validate'
        run: |
          uv run pytest packages/tac-validate/tests --cov=tac_validate \
            --cov-config=packages/tac-validate/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=95 -v

      # F16–F19 / T0.1 — skips until packages/dissemination is scaffolded (T1.1/T1.2).
      - name: Run dissemination unit tests with coverage
        if: matrix.package == 'dissemination'
        run: bash scripts/ci/run_dissemination_coverage.sh

      # F16 / T2.5 — TC-F16-003 PG+MySQL Testcontainers + SQLite (skip PG/MySQL if no Docker).
      - name: Run dissemination multi-DB integration tests
        if: matrix.package == 'dissemination'
        run: make test-integration-dissemination

      - name: Run frontend tests with coverage
        if: matrix.package == 'frontend'
        run: pnpm --filter @metar/frontend run test:coverage

      - name: Run bug regression tests (tests/bugs)
        if: matrix.package == 'bugs'
        run: uv run pytest tests/bugs -m "not live and not live_api" --no-cov -v

      - name: Set integration stack environment
        if: matrix.package == 'integration'
        run: |
          PUBLISHABLE="${SUPABASE_PUBLISHABLE_KEY:-${FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY:-}}"
          {
            echo "METAR_CONFIG_ENV=local"
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}"
            echo "DATABASE_URL=${DATABASE_URL:-}"
          } >> "$GITHUB_ENV"
          bash scripts/frontend/prepare-config.sh

      - name: Run integration tests
        if: matrix.package == 'integration'
        run: |
          docker compose up -d backend frontend
          sleep 30
          uv run pytest tests/test_backend_frontend_integration.py tests/test_integration.py -v
          cd apps/backend && uv run pytest tests/integration/test_h0i_connectivity.py tests/unit/test_tc_f21_auth_gone_unit.py -v --no-cov
          cd apps/backend && uv run pytest tests/infrastructure/test_smoke.py -k "cor or conversion or workflow" -q --no-cov
          docker compose down

      # F17 / E14-04 / T3.3 — wis2box Compose harness (MQTT + HTTP dataset smoke).
      - name: Run wis2box Compose harness hook
        if: matrix.package == 'integration'
        run: bash scripts/ci/run_wis2box_harness.sh

      - name: Upload backend coverage artifact
        if: always() && matrix.package == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            apps/backend/htmlcov/
            apps/backend/coverage.xml

      - name: Upload frontend coverage artifact
        if: always() && matrix.package == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: apps/frontend/coverage/

      - name: Stop service stack after integration tests
        if: always() && matrix.package == 'integration'
        run: docker compose down

  # F30 / EV-031 T2.3 — Postgres service + idempotent alembic upgrade head (TC-EV031-002).
  test-alembic:
    runs-on: ubuntu-latest
    name: Test (alembic / TC-EV031-002)
    needs: [validate]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tac_alembic_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tac_alembic_test
      ALEMBIC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tac_alembic_test
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Alembic upgrade head (twice — must be idempotent)
        run: |
          make db-migrate
          make db-migrate

      - name: TC-EV031-002 layout + live upgrade tests
        run: make test-alembic

  # ============================================================================
  # NATIVE — tac2iwxxm PyO3 / maturin scaffold (ADR-017 / T4.3)
  # ============================================================================
  tac2iwxxm-native:
    runs-on: ubuntu-latest
    name: tac2iwxxm PyO3 (maturin)
    needs: [validate]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv + workspace
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: uv pip install maturin

      - name: Build tac2iwxxm._rust extension
        working-directory: packages/tac2iwxxm
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          uv run maturin develop --manifest-path rust/Cargo.toml --uv

      - name: Smoke-test required native extension
        env:
          TAC2IWXXM_REQUIRE_RUST: '1'
        run: |
          uv run pytest packages/tac2iwxxm/tests/test_native_scaffold.py \
            packages/tac2iwxxm/tests/test_pyo3_hotspots.py -v --no-cov

  # ============================================================================
  # E2E SMOKE — Playwright browser smoke (auth bootstrap + TAC conversion)
  # Free on public repos (ubuntu-latest). Self-contained: config/local.json sets
  # disableAuth=true, so no Supabase secrets are required (mock session path).
  # ============================================================================
  e2e-smoke:
    runs-on: ubuntu-latest
    name: E2E Smoke (Playwright)
    needs: [validate]
    env:
      METAR_CONFIG_ENV: local

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @metar/e2e exec playwright install --with-deps chromium

      - name: Run Playwright smoke specs
        run: make test-e2e-playwright-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  # ============================================================================
  # DEPLOY — build/push GHCR images (main push only). Render triggers retired (T6.5 /
  # D-S038-t65-waive). DOKS pulls from GHCR; skip cleanly when GHCR login fails.
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [test, test-alembic, tac2iwxxm-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Guard CD credentials (skip if GHCR unavailable)
        id: guard
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "::notice::GITHUB_TOKEN unavailable for GHCR — skipping Deploy"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Probe GHCR write access under the current org (EMPIRIC2).
          if ! printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin; then
            echo "::notice::GHCR login failed — skipping Deploy"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true

          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (with retry)
        if: steps.guard.outputs.skip != 'true'
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5"

            if timeout 90 sh -c "printf '%s' \"\$REGISTRY_PASSWORD\" | docker login \"\$REGISTRY\" -u \"\$REGISTRY_USERNAME\" --password-stdin"; then
              echo "Registry login succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 10))
              echo "Login attempt ${attempt} failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Registry login failed after 5 attempts"
          exit 1

      - name: Generate image tags
        if: steps.guard.outputs.skip != 'true'
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push frontend Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.FRONTEND_VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_APP_URL=${{ env.FRONTEND_VITE_APP_URL }}
            VITE_API_BASE_URL=${{ env.FRONTEND_VITE_API_BASE_URL }}
            VITE_FRONTEND_DEPLOY_MARK=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:main-latest

      - name: Build and push worker Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:main-latest

      - name: Note Render decommission (T6.5)
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "GHCR images pushed. Render deploy hooks retired (D-S038-t65-waive)."
          echo "DOKS is primary — rollout via kubectl / image tag, not Render hooks."

      - name: CD skipped (credentials)
        if: steps.guard.outputs.skip == 'true'
        run: echo "Deploy skipped — GHCR package write unavailable for EMPIRIC2."
