name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/backend
  AUTH_IMAGE: joseph-c-mcguire/metar-to-iwxxm/auth
  FRONTEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/frontend
  FRONTEND_SOURCE_REPO: https://github.com/joseph-c-mcguire/Metartoiwxxmfrontend.git
  RENDER_DEPLOY_MODE: source
  FRONTEND_VITE_SUPABASE_URL: https://ktvxijislbtgqapllmuk.supabase.co
  FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: sb_publishable_eqkNmJv86m9u7Gmym9Wf8Q_NC1fUZ8x
  FRONTEND_VITE_APP_URL: https://metar-to-iwxxm-frontend-v4-web.onrender.com
  FRONTEND_VITE_BACKEND_URL: https://metar-to-iwxxm-api.onrender.com
  FRONTEND_VITE_AUTH_SERVICE_URL: https://metar-to-iwxxm-auth-v2.onrender.com

jobs:
  # ============================================================================
  # BACKEND - Python Tests & Coverage
  # ============================================================================
  backend-tests:
    runs-on: ubuntu-latest
    name: Backend - Tests & Coverage
    
    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize required submodules only
        run: |
          git submodule update --init --depth 1 frontend
          git submodule update --init --depth 1 GIFTs
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd backend && uv pip install --system -e ".[dev]" skyfield httpx
          python -m pip install pytest pytest-cov pytest-asyncio
      
      - name: Run unit tests with coverage
        working-directory: ./backend
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=html \
            --tb=short \
            -v
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
  
  # ============================================================================
  # AUTH SERVICE - Python Tests & Coverage
  # ============================================================================
  auth-tests:
    runs-on: ubuntu-latest
    name: Auth Service - Tests & Coverage
    
    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize required submodules only
        run: |
          git submodule update --init --depth 1 frontend
          git submodule update --init --depth 1 GIFTs
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd auth && uv pip install --system -e ".[dev]"
          python -m pip install pytest pytest-cov pytest-asyncio
      
      - name: Run unit tests with coverage
        working-directory: ./auth
        run: |
          python -m pytest tests/test_supabase_proxy_api_database.py \
            --cov=src \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=html \
            --tb=short \
            -v
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-coverage-report
          path: auth/htmlcov/
  
  # ============================================================================
  # GIFTs - Python Tests & Coverage
  # ============================================================================
  gifts-tests:
    runs-on: ubuntu-latest
    name: GIFTs - Tests & Coverage
    
    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize GIFTs submodule
        run: |
          git submodule update --init --depth 1 GIFTs
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd GIFTs && python -m pip install -e .
      
      - name: Run unit tests with coverage
        working-directory: ./GIFTs
        run: |
          python -m pytest tests/ \
            --cov=gifts \
            --cov-report=json \
            --cov-report=term-missing \
            --cov-report=html \
            --tb=short \
            -v || echo "Tests completed"
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gifts-coverage-report
          path: GIFTs/htmlcov/
        continue-on-error: true
  
  # ============================================================================
  # FRONTEND - JavaScript/TypeScript Tests & Coverage
  # ============================================================================
  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend - Tests & Coverage
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
      
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage 2>&1 | tee test-output.log
        continue-on-error: true
      
      - name: Report coverage summary
        working-directory: ./frontend
        run: |
          COVERAGE=$(grep -oP 'Coverage: \K[\d.]+' test-output.log || echo "0")
          echo "Frontend Coverage: ${COVERAGE}%"
        continue-on-error: true
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
        continue-on-error: true
  
  # ============================================================================
  # TEST RESULT AGGREGATION
  # ============================================================================
  coverage-enforcement:
    runs-on: ubuntu-latest
    name: Test Result Aggregation
    needs: [backend-tests, auth-tests, gifts-tests, frontend-tests]
    if: always()
    
    steps:
      - name: Check all test results
        run: |
          echo "## Test Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth Service | ${{ needs.auth-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GIFTs | ${{ needs.gifts-tests.result == 'success' && '✅ PASS' || '⚠️  OPTIONAL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage reports are informative-only; no minimum threshold is enforced.**" >> $GITHUB_STEP_SUMMARY
      
      - name: Enforce required test jobs
        run: |
          BACKEND=${{ needs.backend-tests.result }}
          AUTH=${{ needs.auth-tests.result }}
          FRONTEND=${{ needs.frontend-tests.result }}
          
          if [ "$BACKEND" != "success" ] || [ "$AUTH" != "success" ] || [ "$FRONTEND" != "success" ]; then
            echo "❌ Required test jobs failed"
            [ "$BACKEND" != "success" ] && echo "  - Backend: $BACKEND"
            [ "$AUTH" != "success" ] && echo "  - Auth Service: $AUTH"
            [ "$FRONTEND" != "success" ] && echo "  - Frontend: $FRONTEND"
            exit 1
          fi

          echo "✅ Required test jobs passed"
  
  # ============================================================================
  # MONOREPO CHANGE DETECTION
  # ============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Monorepo Changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      auth_changed: ${{ steps.filter.outputs.auth }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'GIFTs/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'
            auth:
              - 'auth/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'
            frontend:
              - 'frontend/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'render.yaml'

  # ============================================================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      backend_built: ${{ steps.filter.outputs.backend_build }}
      auth_built: ${{ steps.filter.outputs.auth_build }}
      frontend_built: ${{ steps.filter.outputs.frontend_build }}
    
    steps:
      - name: Manual checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Initialize required submodules
        run: |
          git submodule update --init --depth 1 GIFTs

      - name: Clone frontend source repository
        run: |
          git clone --depth 1 "${{ env.FRONTEND_SOURCE_REPO }}" _frontend_src
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve services to build
        id: filter
        run: |
          echo "backend_build=true" >> "$GITHUB_OUTPUT"
          echo "auth_build=true" >> "$GITHUB_OUTPUT"
          echo "frontend_build=true" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        if: steps.filter.outputs.backend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push auth Docker image
        if: steps.filter.outputs.auth_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./auth/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE }}:main-latest

      - name: Build and push frontend Docker image
        if: steps.filter.outputs.frontend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./_frontend_src
          file: ./_frontend_src/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.FRONTEND_VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_APP_URL=${{ env.FRONTEND_VITE_APP_URL }}
            VITE_BACKEND_URL=${{ env.FRONTEND_VITE_BACKEND_URL }}
            VITE_AUTH_SERVICE_URL=${{ env.FRONTEND_VITE_AUTH_SERVICE_URL }}
            VITE_FRONTEND_DEPLOY_MARK=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:main-latest

  # ============================================================================
  # DEPLOY TO RENDER VIA DEPLOY HOOKS
  # ============================================================================
  deploy-render:
    runs-on: ubuntu-latest
    name: Deploy Render Services
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_AUTH_DEPLOY_HOOK: ${{ secrets.RENDER_AUTH_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}

    steps:
      - name: Report deploy hook configuration
        run: |
          [ -n "${RENDER_BACKEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_BACKEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_BACKEND_DEPLOY_HOOK is missing"
          [ -n "${RENDER_AUTH_DEPLOY_HOOK}" ] && echo "✅ RENDER_AUTH_DEPLOY_HOOK is set" || echo "⚠️  RENDER_AUTH_DEPLOY_HOOK is missing"
          [ -n "${RENDER_FRONTEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_FRONTEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_FRONTEND_DEPLOY_HOOK is missing"

      - name: Deploy backend image to Render
        if: needs.build-and-push.outputs.backend_built == 'true' && env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_BACKEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: Deploy auth image to Render
        if: needs.build-and-push.outputs.auth_built == 'true' && env.RENDER_AUTH_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_AUTH_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.AUTH_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: Deploy frontend image to Render
        if: needs.build-and-push.outputs.frontend_built == 'true' && env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi
  
  # ============================================================================
  # TEST SUMMARY & FINAL STATUS
  # ============================================================================
  test-summary:
    runs-on: ubuntu-latest
    name: Test & Coverage Summary
    if: always()
    needs: [backend-tests, auth-tests, gifts-tests, frontend-tests, coverage-enforcement, build-and-push, deploy-render]
    
    steps:
      - name: Generate final summary
        run: |
          echo "# 🧪 Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Coverage Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Status | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Backend | ${{ needs.backend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Auth Service | ${{ needs.auth-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎁 GIFTs | ${{ needs.gifts-tests.result == 'success' && '✅ PASS' || '⚠️  WARN' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Frontend | ${{ needs.frontend-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Required Test Jobs**: ${{ needs.coverage-enforcement.result == 'success' && '✅ PASSING' || '❌ FAILING' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Build**: ${{ needs.build-and-push.result == 'success' && '✅ SUCCESS' || '⏭️  SKIPPED' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Render Deploy**: ${{ needs.deploy-render.result == 'success' && '✅ SUCCESS' || '⏭️  SKIPPED' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Policy**: Coverage is reported but not hard-gated by a minimum percentage." >> $GITHUB_STEP_SUMMARY
