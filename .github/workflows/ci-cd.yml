---
name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/backend
  FRONTEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/frontend
  RENDER_DEPLOY_MODE: image
  # Canonical Supabase secrets (preferred). Deprecated FRONTEND_VITE_* kept for one-release shim.
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  FRONTEND_VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
  FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  FRONTEND_VITE_APP_URL: https://metar-to-iwxxm-frontend-v4-web.onrender.com
  FRONTEND_VITE_API_BASE_URL: https://metar-to-iwxxm-api.onrender.com

jobs:
  # ============================================================================
  # VALIDATE — format, lint, typecheck, secrets, yaml, config-guard, npm audit
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    name: Validate

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate gates
        run: make validate-ci

  # ============================================================================
  # TEST — unit + coverage matrix, integration, Codecov uploads
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.package }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        package: [shared, backend, auth, gifts, frontend, integration]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        run: pnpm install --frozen-lockfile

      - name: Prepare GIFTs demo databases
        if: matrix.package == 'gifts'
        run: |
          cd packages/gifts/gifts/database && python3 create_pickle_db.py
          cp aerodromes.db ../../demo/aerodromes.db
          cp aerodromes.db ../../demo/aerodromes.win.db

      - name: Create frontend test environment file
        if: matrix.package == 'frontend'
        working-directory: ./apps/frontend
        run: |
          printf 'VITE_API_BASE_URL=http://localhost:18001\nVITE_APP_URL=http://localhost:18000\n' > .env

      - name: Run shared package tests
        if: matrix.package == 'shared'
        run: |
          uv run pytest packages/shared/tests --cov=metar_shared \
            --cov-config=packages/shared/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=98 -v
          pnpm --filter @metar/shared run test:coverage

      - name: Run backend unit tests with coverage
        if: matrix.package == 'backend'
        run: |
          cd apps/backend && uv run pytest tests/unit \
            --cov=src --cov-config=pyproject.toml --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v

      - name: Run auth unit tests with coverage
        if: matrix.package == 'auth'
        run: |
          cd packages/auth && uv run pytest tests \
            --cov=src --cov-config=pyproject.toml --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v

      - name: Run GIFTs unit tests with coverage
        if: matrix.package == 'gifts'
        run: |
          cd packages/gifts && uv run pytest tests/ \
            --cov=gifts --cov=validation --cov-config=pyproject.toml --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v

      - name: Run frontend tests with coverage
        if: matrix.package == 'frontend'
        run: pnpm --filter @metar/frontend run test:coverage

      - name: Set integration stack environment
        if: matrix.package == 'integration'
        run: |
          PUBLISHABLE="${SUPABASE_PUBLISHABLE_KEY:-${FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY:-}}"
          {
            echo "METAR_CONFIG_ENV=local"
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}"
            echo "DATABASE_URL=${DATABASE_URL:-}"
          } >> "$GITHUB_ENV"
          bash scripts/frontend/prepare-config.sh

      - name: Run integration tests
        if: matrix.package == 'integration'
        run: |
          docker compose up -d backend frontend
          sleep 30
          uv run pytest tests/test_backend_auth_integration.py tests/test_backend_frontend_integration.py tests/test_auth_frontend_integration.py tests/test_gifts_backend_integration.py tests/test_integration.py -v
          cd apps/backend && uv run pytest tests/infrastructure/test_smoke.py -k "cor or conversion or workflow" -q --no-cov
          docker compose down

      - name: Upload backend coverage artifact
        if: always() && matrix.package == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            apps/backend/htmlcov/
            apps/backend/coverage.xml

      - name: Upload backend coverage to Codecov
        if: always() && matrix.package == 'backend'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./apps/backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true

      - name: Upload auth coverage artifact
        if: always() && matrix.package == 'auth'
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage-report
          path: |
            packages/auth/htmlcov/
            packages/auth/coverage.xml

      - name: Upload auth coverage to Codecov
        if: always() && matrix.package == 'auth'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./packages/auth/coverage.xml
          flags: auth
          name: auth-coverage
          fail_ci_if_error: true

      - name: Upload GIFTs coverage artifact
        if: always() && matrix.package == 'gifts'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: gifts-coverage-report
          path: |
            packages/gifts/htmlcov/
            packages/gifts/coverage.xml

      - name: Upload GIFTs coverage to Codecov
        if: always() && matrix.package == 'gifts'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./packages/gifts/coverage.xml
          flags: gifts
          name: gifts-coverage
          fail_ci_if_error: true

      - name: Upload frontend coverage artifact
        if: always() && matrix.package == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: apps/frontend/coverage/

      - name: Upload frontend coverage to Codecov
        if: always() && matrix.package == 'frontend'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true

      - name: Stop service stack after integration tests
        if: always() && matrix.package == 'integration'
        run: docker compose down

  # ============================================================================
  # DEPLOY — build/push images and trigger Render (main push only)
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (with retry)
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5"

            if timeout 90 sh -c "printf '%s' \"\$REGISTRY_PASSWORD\" | docker login \"\$REGISTRY\" -u \"\$REGISTRY_USERNAME\" --password-stdin"; then
              echo "Registry login succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 10))
              echo "Login attempt ${attempt} failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Registry login failed after 5 attempts"
          exit 1

      - name: Generate image tags
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.FRONTEND_VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_APP_URL=${{ env.FRONTEND_VITE_APP_URL }}
            VITE_API_BASE_URL=${{ env.FRONTEND_VITE_API_BASE_URL }}
            VITE_FRONTEND_DEPLOY_MARK=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:main-latest

      - name: Report deploy hook configuration
        run: |
          [ -n "${RENDER_BACKEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_BACKEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_BACKEND_DEPLOY_HOOK is missing"
          [ -n "${RENDER_FRONTEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_FRONTEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_FRONTEND_DEPLOY_HOOK is missing"

      - name: Enforce backend deploy hook presence
        run: |
          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK}" ]; then
            echo "❌ Missing required secret: RENDER_BACKEND_DEPLOY_HOOK"
            exit 1
          fi

      - name: Deploy backend image to Render
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_BACKEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: Deploy frontend image to Render
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi
