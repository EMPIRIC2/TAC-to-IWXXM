---
name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/backend
  FRONTEND_IMAGE: joseph-c-mcguire/metar-to-iwxxm/frontend
  WORKER_IMAGE: joseph-c-mcguire/metar-to-iwxxm/worker
  RENDER_DEPLOY_MODE: image
  # Canonical Supabase secrets (preferred). Deprecated FRONTEND_VITE_* kept for one-release shim.
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  FRONTEND_VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
  FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  FRONTEND_VITE_APP_URL: https://metar-to-iwxxm-frontend-v4-web.onrender.com
  FRONTEND_VITE_API_BASE_URL: https://metar-to-iwxxm-api.onrender.com

jobs:
  # ============================================================================
  # VALIDATE — format, lint, typecheck, secrets, yaml, config-guard, npm audit
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    name: Validate

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate gates
        run: make validate-ci

  # ============================================================================
  # TEST — unit + coverage matrix, integration, Codecov uploads
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.package }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            shared,
            backend,
            auth,
            frontend,
            tac2iwxxm,
            iwxxm-validate,
            tac-validate,
            dissemination,
            integration,
            bugs,
          ]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        if: matrix.package == 'shared' || matrix.package == 'frontend'
        run: pnpm install --frozen-lockfile

      - name: Create frontend test environment file
        if: matrix.package == 'frontend'
        working-directory: ./apps/frontend
        run: |
          printf 'VITE_API_BASE_URL=http://localhost:18001\nVITE_APP_URL=http://localhost:18000\n' > .env

      - name: Run shared package tests
        if: matrix.package == 'shared'
        run: |
          uv run pytest packages/shared/tests --cov=metar_shared \
            --cov-config=packages/shared/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=98 -v
          pnpm --filter @metar/shared run test:coverage

      - name: Run backend unit tests with coverage
        if: matrix.package == 'backend'
        run: |
          cd apps/backend && uv run pytest tests/unit \
            --cov=src --cov-config=pyproject.toml --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v

      - name: Run auth unit tests with coverage
        if: matrix.package == 'auth'
        run: |
          cd packages/auth && uv run pytest tests \
            --cov=src --cov-config=pyproject.toml --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=98 -v

      - name: Run tac2iwxxm unit tests with coverage
        if: matrix.package == 'tac2iwxxm'
        run: |
          uv run pytest packages/tac2iwxxm/tests --cov=tac2iwxxm \
            --cov-config=packages/tac2iwxxm/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=95 -v

      - name: Install Rust toolchain (iwxxm-validate native)
        if: matrix.package == 'iwxxm-validate'
        uses: dtolnay/rust-toolchain@stable

      - name: Build iwxxm-validate._rust extension
        if: matrix.package == 'iwxxm-validate'
        working-directory: packages/iwxxm-validate
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          uv pip install maturin
          # CLI + validate_iwxxm hot path need xmloxide; lxml alone hits SCHEMA_PARSE_ERROR
          # on GML/ISO imports for WMO examples (F13 / T3.9).
          uv run maturin develop --manifest-path rust/Cargo.toml --uv

      - name: Run iwxxm-validate unit tests with coverage
        if: matrix.package == 'iwxxm-validate'
        run: |
          uv run pytest packages/iwxxm-validate/tests --cov=iwxxm_validate \
            --cov-config=packages/iwxxm-validate/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=95 -v

      - name: Run tac-validate unit tests with coverage
        if: matrix.package == 'tac-validate'
        run: |
          uv run pytest packages/tac-validate/tests --cov=tac_validate \
            --cov-config=packages/tac-validate/pyproject.toml --cov-branch \
            --cov-report=term-missing --cov-fail-under=95 -v

      # F16–F19 / T0.1 — skips until packages/dissemination is scaffolded (T1.1/T1.2).
      - name: Run dissemination unit tests with coverage
        if: matrix.package == 'dissemination'
        run: bash scripts/ci/run_dissemination_coverage.sh

      - name: Run frontend tests with coverage
        if: matrix.package == 'frontend'
        run: pnpm --filter @metar/frontend run test:coverage

      - name: Run bug regression tests (tests/bugs)
        if: matrix.package == 'bugs'
        run: uv run pytest tests/bugs -m "not live and not live_api" --no-cov -v

      - name: Set integration stack environment
        if: matrix.package == 'integration'
        run: |
          PUBLISHABLE="${SUPABASE_PUBLISHABLE_KEY:-${FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY:-}}"
          {
            echo "METAR_CONFIG_ENV=local"
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE}"
            echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}"
            echo "DATABASE_URL=${DATABASE_URL:-}"
          } >> "$GITHUB_ENV"
          bash scripts/frontend/prepare-config.sh

      - name: Run integration tests
        if: matrix.package == 'integration'
        run: |
          docker compose up -d backend frontend
          sleep 30
          uv run pytest tests/test_backend_auth_integration.py tests/test_backend_frontend_integration.py tests/test_auth_frontend_integration.py tests/test_integration.py -v
          cd apps/backend && uv run pytest tests/integration/test_h0i_connectivity.py -v --no-cov
          cd apps/backend && uv run pytest tests/infrastructure/test_smoke.py -k "cor or conversion or workflow" -q --no-cov
          docker compose down

      # F17 / E14-04 — wis2box Compose harness hook (skips until T3.3 defines wis2box service).
      - name: Run wis2box Compose harness hook
        if: matrix.package == 'integration'
        run: bash scripts/ci/run_wis2box_harness.sh

      - name: Upload backend coverage artifact
        if: always() && matrix.package == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            apps/backend/htmlcov/
            apps/backend/coverage.xml

      - name: Upload backend coverage to Codecov
        if: always() && matrix.package == 'backend'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./apps/backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true

      - name: Upload auth coverage artifact
        if: always() && matrix.package == 'auth'
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage-report
          path: |
            packages/auth/htmlcov/
            packages/auth/coverage.xml

      - name: Upload auth coverage to Codecov
        if: always() && matrix.package == 'auth'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./packages/auth/coverage.xml
          flags: auth
          name: auth-coverage
          fail_ci_if_error: true

      - name: Upload frontend coverage artifact
        if: always() && matrix.package == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: apps/frontend/coverage/

      - name: Upload frontend coverage to Codecov
        if: always() && matrix.package == 'frontend'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: joseph-c-mcguire/metar-to-IWXXM
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true

      - name: Stop service stack after integration tests
        if: always() && matrix.package == 'integration'
        run: docker compose down

  # ============================================================================
  # NATIVE — tac2iwxxm PyO3 / maturin scaffold (ADR-017 / T4.3)
  # ============================================================================
  tac2iwxxm-native:
    runs-on: ubuntu-latest
    name: tac2iwxxm PyO3 (maturin)
    needs: [validate]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv + workspace
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: uv pip install maturin

      - name: Build tac2iwxxm._rust extension
        working-directory: packages/tac2iwxxm
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          uv run maturin develop --manifest-path rust/Cargo.toml --uv

      - name: Smoke-test required native extension
        env:
          TAC2IWXXM_REQUIRE_RUST: '1'
        run: |
          uv run pytest packages/tac2iwxxm/tests/test_native_scaffold.py \
            packages/tac2iwxxm/tests/test_pyo3_hotspots.py -v --no-cov

  # ============================================================================
  # E2E SMOKE — Playwright browser smoke (auth bootstrap + TAC conversion)
  # Free on public repos (ubuntu-latest). Self-contained: config/local.json sets
  # disableAuth=true, so no Supabase secrets are required (mock session path).
  # ============================================================================
  e2e-smoke:
    runs-on: ubuntu-latest
    name: E2E Smoke (Playwright)
    needs: [validate]
    env:
      METAR_CONFIG_ENV: local

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @metar/e2e exec playwright install --with-deps chromium

      - name: Run Playwright smoke specs
        run: make test-e2e-playwright-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  # ============================================================================
  # DEPLOY — build/push images and trigger Render (main push only)
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [test, tac2iwxxm-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (with retry)
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5"

            if timeout 90 sh -c "printf '%s' \"\$REGISTRY_PASSWORD\" | docker login \"\$REGISTRY\" -u \"\$REGISTRY_USERNAME\" --password-stdin"; then
              echo "Registry login succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 10))
              echo "Login attempt ${attempt} failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Registry login failed after 5 attempts"
          exit 1

      - name: Generate image tags
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.FRONTEND_VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_APP_URL=${{ env.FRONTEND_VITE_APP_URL }}
            VITE_API_BASE_URL=${{ env.FRONTEND_VITE_API_BASE_URL }}
            VITE_FRONTEND_DEPLOY_MARK=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:main-latest

      - name: Build and push worker Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:main-latest

      - name: Report deploy hook configuration
        run: |
          [ -n "${RENDER_BACKEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_BACKEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_BACKEND_DEPLOY_HOOK is missing"
          [ -n "${RENDER_FRONTEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_FRONTEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_FRONTEND_DEPLOY_HOOK is missing"
          [ -n "${RENDER_WORKER_DEPLOY_HOOK}" ] && echo "✅ RENDER_WORKER_DEPLOY_HOOK is set" || echo "⚠️  RENDER_WORKER_DEPLOY_HOOK is missing (docker-from-git worker OK)"

      - name: Enforce backend deploy hook presence
        run: |
          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK}" ]; then
            echo "❌ Missing required secret: RENDER_BACKEND_DEPLOY_HOOK"
            exit 1
          fi

      - name: Deploy backend image to Render
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_BACKEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: Deploy frontend image to Render
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi
