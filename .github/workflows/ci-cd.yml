---
name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  # GHCR owner/name are lowercase; repo lives under EMPIRIC2/TAC-to-IWXXM.
  BACKEND_IMAGE: empiric2/tac-to-iwxxm/backend
  FRONTEND_IMAGE: empiric2/tac-to-iwxxm/frontend
  WORKER_IMAGE: empiric2/tac-to-iwxxm/worker
  RENDER_DEPLOY_MODE: image
  # Canonical Supabase secrets (preferred). Deprecated FRONTEND_VITE_* kept for one-release shim.
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  FRONTEND_VITE_SUPABASE_URL: ${{ secrets.FRONTEND_VITE_SUPABASE_URL }}
  FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
  FRONTEND_VITE_APP_URL: https://metar-to-iwxxm-frontend-v4-web.onrender.com
  FRONTEND_VITE_API_BASE_URL: https://metar-to-iwxxm-api.onrender.com

jobs:
  # ============================================================================
  # VALIDATE — format, lint, typecheck, secrets, yaml, config-guard, npm audit
  # Long-running unit/matrix/e2e/native suites run locally via husky pre-push
  # (make validate-ci + make ci-prepush) — temporary until org CD credentials settle.
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    name: Validate

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate gates
        run: make validate-ci

  # ============================================================================
  # DEPLOY — build/push images and trigger Render (main push only)
  # TEMPORARY: skip cleanly when GHCR login or Render deploy hooks are missing
  # (e.g. post-org-transfer secret/package setup incomplete).
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
      RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Guard CD credentials (skip if unset)
        id: guard
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK:-}" ]; then
            echo "::notice::RENDER_BACKEND_DEPLOY_HOOK unset"
            missing=1
          fi
          if [ -z "${RENDER_FRONTEND_DEPLOY_HOOK:-}" ]; then
            echo "::notice::RENDER_FRONTEND_DEPLOY_HOOK unset"
            missing=1
          fi
          if [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "::notice::GITHUB_TOKEN unavailable for GHCR"
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "::notice::CD credentials incomplete — skipping Deploy (temporary)"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Probe GHCR write access under the current org (EMPIRIC2).
          if ! printf '%s' "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin; then
            echo "::notice::GHCR login failed — skipping Deploy (temporary)"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true

          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (with retry)
        if: steps.guard.outputs.skip != 'true'
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5"

            if timeout 90 sh -c "printf '%s' \"\$REGISTRY_PASSWORD\" | docker login \"\$REGISTRY\" -u \"\$REGISTRY_USERNAME\" --password-stdin"; then
              echo "Registry login succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 10))
              echo "Login attempt ${attempt} failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Registry login failed after 5 attempts"
          exit 1

      - name: Generate image tags
        if: steps.guard.outputs.skip != 'true'
        id: tags
        run: |
          TS="$(date -u +'%Y%m%d%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push frontend Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ env.FRONTEND_VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ env.FRONTEND_VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            VITE_APP_URL=${{ env.FRONTEND_VITE_APP_URL }}
            VITE_API_BASE_URL=${{ env.FRONTEND_VITE_API_BASE_URL }}
            VITE_FRONTEND_DEPLOY_MARK=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:main-latest

      - name: Build and push worker Docker image
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/worker/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.tags.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:main-latest

      - name: Report deploy hook configuration
        if: steps.guard.outputs.skip != 'true'
        run: |
          [ -n "${RENDER_BACKEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_BACKEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_BACKEND_DEPLOY_HOOK is missing"
          [ -n "${RENDER_FRONTEND_DEPLOY_HOOK}" ] && echo "✅ RENDER_FRONTEND_DEPLOY_HOOK is set" || echo "⚠️  RENDER_FRONTEND_DEPLOY_HOOK is missing"
          [ -n "${RENDER_WORKER_DEPLOY_HOOK}" ] && echo "✅ RENDER_WORKER_DEPLOY_HOOK is set" || echo "⚠️  RENDER_WORKER_DEPLOY_HOOK is missing (docker-from-git worker OK)"

      - name: Enforce backend deploy hook presence
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -z "${RENDER_BACKEND_DEPLOY_HOOK}" ]; then
            echo "❌ Missing required secret: RENDER_BACKEND_DEPLOY_HOOK"
            exit 1
          fi

      - name: Deploy backend image to Render
        if: steps.guard.outputs.skip != 'true' && env.RENDER_BACKEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_BACKEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: Deploy frontend image to Render
        if: steps.guard.outputs.skip != 'true' && env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        env:
          DEPLOY_HOOK: ${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}
          IMAGE_URL: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.image_tag }}
        run: |
          if [ "${RENDER_DEPLOY_MODE}" = "image" ]; then
            ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")
            curl -fsSL "${DEPLOY_HOOK}&imgURL=${ENCODED_URL}"
          else
            curl -fsSL "${DEPLOY_HOOK}"
          fi

      - name: CD skipped (credentials)
        if: steps.guard.outputs.skip == 'true'
        run: echo "Deploy skipped — configure RENDER_*_DEPLOY_HOOK secrets and GHCR package write for EMPIRIC2, then re-enable."
