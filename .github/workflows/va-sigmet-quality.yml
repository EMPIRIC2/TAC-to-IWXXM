# EV-029 / E29-T4=2 — VA SIGMET quality pack (M6 / TC-EV029-007 + F23 deepen).
# Separate per-family workflow (WV / VolcanicAshSIGMET); complements root ci.yml
# and gen SIGMET pack (sigmet-quality.yml).
name: VA SIGMET quality

on:
  push:
    branches: [main, evolve/EV-029-eight-family-ahl-rules]
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/sigmet_airmet.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_007_va_sigmet_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/test_tc_f23_003_va_sigmet_annex3_goldens.py"
      - "packages/tac2iwxxm/tests/fixtures/va_sigmet/**"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/sigmet_va*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/sigmet*"
      - "packages/tac-validate/tests/test_tc_f23_v1_va_sigmet.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_va_sigmet_quality.sh"
      - ".github/workflows/va-sigmet-quality.yml"
  pull_request:
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/sigmet_airmet.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_007_va_sigmet_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/test_tc_f23_003_va_sigmet_annex3_goldens.py"
      - "packages/tac2iwxxm/tests/fixtures/va_sigmet/**"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/sigmet_va*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/sigmet*"
      - "packages/tac-validate/tests/test_tc_f23_v1_va_sigmet.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_va_sigmet_quality.sh"
      - ".github/workflows/va-sigmet-quality.yml"
  workflow_dispatch:

jobs:
  va-sigmet-quality:
    runs-on: ubuntu-latest
    name: VA SIGMET quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run VA SIGMET quality pack
        run: make test-va-sigmet-quality
