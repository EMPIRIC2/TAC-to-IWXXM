# One-shot / reusable staging ops for EV-933 (Alembic + overlay HMAC secret).
# Uses environment "staging" → secrets.KUBE_CONFIG (ServiceAccount kubeconfig).
name: Ops DOKS staging EV-933

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-ev933-ops:
    name: Alembic + PROFILE_OVERLAY_HMAC_SECRET
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "::error::Missing staging secret KUBE_CONFIG"
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          if ! printf '%s' "${KUBE_CONFIG}" | base64 --decode > "${HOME}/.kube/config" 2>/dev/null; then
            echo "::error::KUBE_CONFIG is not valid base64"
            exit 1
          fi
          chmod 600 "${HOME}/.kube/config"
          if grep -qE 'command:[[:space:]]*doctl' "${HOME}/.kube/config"; then
            echo "::error::KUBE_CONFIG uses doctl exec auth; use a ServiceAccount token kubeconfig"
            exit 1
          fi
          kubectl version --client

      - name: Run EV-933 staging ops
        env:
          DOKS_NAMESPACE: metar-iwxxm-staging
        run: bash scripts/deploy/doks_staging_ev933_ops.sh
