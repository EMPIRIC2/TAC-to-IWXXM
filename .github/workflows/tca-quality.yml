# EV-029 / E29-T4=2 — TCA quality pack (M10 / TC-EV029-005 + F27 deepen / #820).
# Separate per-family workflow (FK / iwxxm:TropicalCycloneAdvisory); complements root ci.yml
# and TC SIGMET pack (tc-sigmet-quality.yml).
name: TCA quality

on:
  push:
    branches: [main, stage, evolve/EV-029-eight-family-ahl-rules]
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/decode.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/vaa_tca.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_005_tca_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/test_tc_f27_*.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_003_ahl_api.py"
      - "packages/tac2iwxxm/tests/fixtures/tca/**"
      - "packages/tac2iwxxm/tests/fixtures/ahl/fk_tca.txt"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/tca*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/tca*"
      - "packages/tac-validate/tests/test_tc_f27_*.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_tca_quality.sh"
      - ".github/workflows/tca-quality.yml"
  pull_request:
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/decode.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/vaa_tca.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_005_tca_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/test_tc_f27_*.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_003_ahl_api.py"
      - "packages/tac2iwxxm/tests/fixtures/tca/**"
      - "packages/tac2iwxxm/tests/fixtures/ahl/fk_tca.txt"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/tca*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/tca*"
      - "packages/tac-validate/tests/test_tc_f27_*.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_tca_quality.sh"
      - ".github/workflows/tca-quality.yml"
  workflow_dispatch:

jobs:
  tca-quality:
    runs-on: ubuntu-latest
    name: TCA quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run TCA quality pack
        run: make test-tca-quality
