# TC SIGMET quality pack (per-family; complements root CI).
# Separate per-family workflow (WC / TropicalCycloneSIGMET); complements root ci.yml
name: TC SIGMET quality

# Stage/main push: always run (no path filter). PR remains path-filtered for cost.
on:
  push:
    branches: [main, stage, evolve/EV-029-eight-family-ahl-rules, evolve/EV-032-iwxxm-corpus-quality]
  pull_request:
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/sigmet_airmet.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_007_tc_sigmet_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_003_ahl_api.py"
      - "packages/tac2iwxxm/tests/test_tc_ev030_005_sigmet_a6_2_tc_catalog.py"
      - "packages/tac2iwxxm/tests/test_tc_ev032_002_a6_2_tc_adr032_equality.py"
      - "packages/tac2iwxxm/tests/test_tc_ev032_003_a6_2_tc_catalog_wmo_pass.py"
      - "packages/tac2iwxxm/tests/fixtures/tc_sigmet/**"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/sigmet_a6_2_tc.tac"
      - "packages/tac2iwxxm/tests/fixtures/ahl/wc_tc_sigmet.txt"
      - "packages/tac-validate/src/tac_validate/**"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_tc_sigmet_quality.sh"
      - "scripts/ci/run_ev032_a6_2_tc_canary.sh"
      - ".github/workflows/tc-sigmet-quality.yml"
  workflow_dispatch:

jobs:
  tc-sigmet-quality:
    runs-on: ubuntu-latest
    name: TC SIGMET quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run TC SIGMET quality pack
        run: make test-tc-sigmet-quality
