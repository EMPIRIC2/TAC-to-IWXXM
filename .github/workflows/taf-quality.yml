# EV-029 / E29-T4=2 — TAF quality pack (M4 / TC-EV029-007 + F20 deepen).
# Separate per-family workflow; complements root ci.yml.
name: TAF quality

on:
  push:
    branches: [main, evolve/EV-029-eight-family-ahl-rules]
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/taf.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_007_taf_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/fixtures/taf/**"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/taf*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/taf*"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_taf_quality.sh"
      - ".github/workflows/taf-quality.yml"
  pull_request:
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/iwxxm_us.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/taf.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_007_taf_gap_fixtures.py"
      - "packages/tac2iwxxm/tests/fixtures/taf/**"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/taf*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/taf*"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f6_030_convert_bulletin_unit.py"
      - "scripts/ci/run_taf_quality.sh"
      - ".github/workflows/taf-quality.yml"
  workflow_dispatch:

jobs:
  taf-quality:
    runs-on: ubuntu-latest
    name: TAF quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run TAF quality pack
        run: make test-taf-quality
