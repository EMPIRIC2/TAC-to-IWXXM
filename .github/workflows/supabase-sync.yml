---
name: Supabase Sync

# Sync Supabase schema for the linked projects:
#   - primary (prod Auth / legacy): ktvxijislbtgqapllmuk
#   - staging preview branch staging-env: zvfhtcxjopwuesrozpvu (git_branch=stage)
#   - Database migrations in supabase/
#   - Edge functions in apps/frontend/supabase/functions/ (legacy upload path)
#   - Advisors (security + performance + health when available) via Management API
#
# Migrations/functions: push to main/stage and manual dispatch. On pull requests
# they run a read-only dry-run / diff only — they never write to the project.
# Edge deploy uses --use-api (no local Docker/ECR pull of edge-runtime).
# Advisors: read-only; run on stage pushes, PRs targeting stage, and manual
# dispatch only (not main).
#
# Branch → project binding:
#   stage / PR→stage → SUPABASE_PROJECT_REF_STAGING (default zvfhtcxjopwuesrozpvu)
#   main  / PR→main  → SUPABASE_PROJECT_REF (default ktvxijislbtgqapllmuk)
#
# Operator docs: docs/deploy.md §Supabase CI sync, docs/ops/env-sync-runbook.md §Step 5
# Advisors API: https://supabase.com/docs/reference/api/v1-get-security-advisors
#
# Required configuration (Settings → Secrets and variables → Actions):
#   secret  SUPABASE_ACCESS_TOKEN           sbp_... access token
#   secret  SUPABASE_DB_PASSWORD            primary project DB password
#   secret  SUPABASE_DB_PASSWORD_STAGING    staging-env preview DB password
#   var     SUPABASE_PROJECT_REF            optional; default ktvxijislbtgqapllmuk
#   var     SUPABASE_PROJECT_REF_STAGING   optional; default zvfhtcxjopwuesrozpvu

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Resolve target project (stage → staging-env preview; main → primary)
  # ==========================================================================
  resolve-target:
    runs-on: ubuntu-latest
    name: Resolve Supabase target
    outputs:
      project_ref: ${{ steps.pick.outputs.project_ref }}
      target_label: ${{ steps.pick.outputs.target_label }}
      use_staging_password: ${{ steps.pick.outputs.use_staging_password }}
    steps:
      - name: Pick project ref for branch
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          PRIMARY_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ktvxijislbtgqapllmuk' }}
          STAGING_REF: ${{ vars.SUPABASE_PROJECT_REF_STAGING || 'zvfhtcxjopwuesrozpvu' }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${BASE_REF}"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual runs on stage tip target staging; otherwise primary.
            if [ "${GITHUB_REF}" = "refs/heads/stage" ]; then
              base="stage"
            else
              base="main"
            fi
          else
            base="${REF_NAME}"
          fi
          if [ "${base}" = "stage" ]; then
            echo "project_ref=${STAGING_REF}" >> "${GITHUB_OUTPUT}"
            echo "target_label=staging-env" >> "${GITHUB_OUTPUT}"
            echo "use_staging_password=true" >> "${GITHUB_OUTPUT}"
            echo "Supabase target: staging-env ref=${STAGING_REF} (base=${base})"
          else
            echo "project_ref=${PRIMARY_REF}" >> "${GITHUB_OUTPUT}"
            echo "target_label=primary" >> "${GITHUB_OUTPUT}"
            echo "use_staging_password=false" >> "${GITHUB_OUTPUT}"
            echo "Supabase target: primary ref=${PRIMARY_REF} (base=${base})"
          fi

  # ==========================================================================
  # MIGRATIONS — supabase db push against the resolved project
  # ==========================================================================
  migrations:
    needs: resolve-target
    runs-on: ubuntu-latest
    name: Sync database migrations
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ needs.resolve-target.outputs.project_ref }}
      SUPABASE_DB_PASSWORD: ${{ needs.resolve-target.outputs.use_staging_password == 'true' && secrets.SUPABASE_DB_PASSWORD_STAGING || secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Guard required secrets
        id: guard
        run: |
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            missing=1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::Supabase secrets not configured; skipping migration dry-run on pull request"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
              echo "::error::Missing required secret SUPABASE_ACCESS_TOKEN (sbp_...)"
            fi
            if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
              if [ "${{ needs.resolve-target.outputs.use_staging_password }}" = "true" ]; then
                echo "::error::Missing required secret SUPABASE_DB_PASSWORD_STAGING (staging-env preview DB password)"
              else
                echo "::error::Missing required secret SUPABASE_DB_PASSWORD"
              fi
            fi
            exit 1
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "Target=${{ needs.resolve-target.outputs.target_label }} ref=${SUPABASE_PROJECT_REF}"

      # Pin 2.111.0 — CLI 2.112.0 breaks `link` on api-keys inserted_at (+00:00 vs Z).
      # Upstream: https://github.com/supabase/cli/issues/6115 (BUG-2026-08-07).
      - name: Install Supabase CLI
        if: steps.guard.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link project
        if: steps.guard.outputs.skip != 'true'
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Dry-run migration diff (pull request)
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request'
        run: |
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Apply migrations (push / manual)
        if: steps.guard.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: supabase db push --linked

  # ==========================================================================
  # FUNCTIONS — legacy upload edge functions (apps/frontend/supabase/functions/)
  # ==========================================================================
  functions:
    needs: resolve-target
    runs-on: ubuntu-latest
    name: Deploy edge functions
    defaults:
      run:
        working-directory: apps/frontend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ needs.resolve-target.outputs.project_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Guard required secrets
        id: guard
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::Supabase secrets not configured; skipping edge-function dry-run on pull request"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::Missing required secret SUPABASE_ACCESS_TOKEN (sbp_...)"
            exit 1
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Install Supabase CLI
        if: steps.guard.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Provision project root for functions
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ ! -f supabase/config.toml ]; then
            cp ../../supabase/config.toml supabase/config.toml
          fi

      - name: List functions (pull request dry-run)
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request'
        run: |
          echo "Edge functions that would be deployed to ${SUPABASE_PROJECT_REF}:"
          ls -1 supabase/functions

      - name: Deploy edge functions (main / stage / manual)
        if: steps.guard.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          attempt=1
          max=3
          while true; do
            if supabase functions deploy --use-api --project-ref "${SUPABASE_PROJECT_REF}"; then
              exit 0
            fi
            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::supabase functions deploy --use-api failed after ${max} attempts"
              exit 1
            fi
            sleep_s=$((attempt * 20))
            echo "::warning::deploy attempt ${attempt} failed; retrying in ${sleep_s}s"
            sleep "${sleep_s}"
            attempt=$((attempt + 1))
          done

  # ==========================================================================
  # ADVISORS — stage-only ERROR gate against the staging-env preview project
  # ==========================================================================
  advisors:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/stage') ||
      (github.event_name == 'pull_request' && github.base_ref == 'stage')
    needs: resolve-target
    runs-on: ubuntu-latest
    name: Supabase advisors
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ needs.resolve-target.outputs.project_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Guard required secrets
        id: guard
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::SUPABASE_ACCESS_TOKEN not configured; skipping advisors on pull request"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::Missing required secret SUPABASE_ACCESS_TOKEN (sbp_...). Create at Supabase Dashboard → Account → Access Tokens."
            exit 1
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "Advisors target=${{ needs.resolve-target.outputs.target_label }} ref=${SUPABASE_PROJECT_REF}"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Run all available advisors
        if: steps.guard.outputs.skip != 'true'
        env:
          SEC_SUPABASE_ADVISORS_FAIL_ON: error
        run: bash scripts/security/run-supabase-advisors.sh
