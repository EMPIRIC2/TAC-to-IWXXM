# EV-029 / E29-T4=2 — SWXA quality pack (M11 / TC-F28 + F28 deepen / #740/#823).
# Separate per-family workflow (FN / iwxxm:SpaceWeatherAdvisory); complements root ci.yml
# and AHL COM pack (ahl-com-quality.yml).
name: SWXA quality

on:
  push:
    branches: [main, evolve/EV-029-eight-family-ahl-rules]
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/decode.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/swxa.py"
      - "packages/tac2iwxxm/tests/test_tc_f28_*.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_003_ahl_api.py"
      - "packages/tac2iwxxm/tests/fixtures/swxa/**"
      - "packages/tac2iwxxm/tests/fixtures/ahl/fn_swxa.txt"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/swxa*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/swxa*"
      - "packages/tac-validate/tests/test_tc_f28_*.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f28_swxa_product_enum.py"
      - "scripts/ci/run_swxa_quality.sh"
      - ".github/workflows/swxa-quality.yml"
  pull_request:
    paths:
      - "packages/tac2iwxxm/src/tac2iwxxm/convert.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/bulletin.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/models.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/decode.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products.py"
      - "packages/tac2iwxxm/src/tac2iwxxm/products/swxa.py"
      - "packages/tac2iwxxm/tests/test_tc_f28_*.py"
      - "packages/tac2iwxxm/tests/test_tc_ev029_003_ahl_api.py"
      - "packages/tac2iwxxm/tests/fixtures/swxa/**"
      - "packages/tac2iwxxm/tests/fixtures/ahl/fn_swxa.txt"
      - "packages/tac2iwxxm/tests/fixtures/annex3_golden/swxa*"
      - "packages/tac-validate/src/tac_validate/**"
      - "packages/tac-validate/tests/**/swxa*"
      - "packages/tac-validate/tests/test_tc_f28_*.py"
      - "apps/backend/src/utilities/conversion.py"
      - "apps/backend/src/api.py"
      - "apps/backend/tests/unit/test_tc_f28_swxa_product_enum.py"
      - "scripts/ci/run_swxa_quality.sh"
      - ".github/workflows/swxa-quality.yml"
  workflow_dispatch:

jobs:
  swxa-quality:
    runs-on: ubuntu-latest
    name: SWXA quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run SWXA quality pack
        run: make test-swxa-quality
