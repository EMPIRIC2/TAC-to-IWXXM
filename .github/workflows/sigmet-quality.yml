# Deprecated (EV-020 / E20-F3=3): replaced by wmo-quality.yml combined pack.
# Kept temporarily so open PRs / bookmarks that reference this path still run the pack.
name: SIGMET quality (deprecated → WMO quality)

on:
  workflow_dispatch:

jobs:
  redirect:
    runs-on: ubuntu-latest
    name: Redirect to WMO quality pack
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Run WMO quality pack (alias)
        run: make test-wmo-quality
