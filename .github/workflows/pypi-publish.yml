# T4.3 / TC-F14-001 — OIDC trusted publishing for F12–F14 (E10-37).
# One workflow + package matrix; tag-driven only (no long-lived PYPI_API_TOKEN).
# Multi-platform maturin wheels: T4.5. Trusted Publisher on PyPI must point at this file.
name: PyPI Publish

on:
  push:
    tags:
      - "tac-validate-v*"
      - "iwxxm-validate-v*"
      - "tac2iwxxm-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to build (dry-run unless publish=true)
        type: choice
        options:
          - tac-validate
          - iwxxm-validate
          - tac2iwxxm
        required: true
      publish:
        description: Publish to PyPI via OIDC (requires Trusted Publisher)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tac-validate
            path: packages/tac-validate
            tag_prefix: tac-validate-v
          - package: iwxxm-validate
            path: packages/iwxxm-validate
            tag_prefix: iwxxm-validate-v
          - package: tac2iwxxm
            path: packages/tac2iwxxm
            tag_prefix: tac2iwxxm-v
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.package == matrix.package)
      || (github.event_name == 'push' && startsWith(github.ref_name, matrix.tag_prefix))
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Resolve version from tag / pyproject
        id: meta
        env:
          PACKAGE: ${{ matrix.package }}
          TAG_PREFIX: ${{ matrix.tag_prefix }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PKG_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            version="${REF_NAME#"${TAG_PREFIX}"}"
          else
            version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('${PKG_PATH}/pyproject.toml').read_text())['project']['version'])")"
          fi
          py_version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('${PKG_PATH}/pyproject.toml').read_text())['project']['version'])")"
          if [[ "${EVENT_NAME}" == "push" && "${version}" != "${py_version}" ]]; then
            echo "::error::Tag version ${version} != pyproject version ${py_version}"
            exit 1
          fi
          echo "package=${PACKAGE}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${PACKAGE}==${version}"

      - name: Build wheel (+ sdist when safe)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # --wheel from checkout: iwxxm-validate hatch hook needs vendor/schemas
          # (sdist→wheel in the uv cache cannot see monorepo vendor; E10-34).
          uv build --wheel --package "${PACKAGE}" -o dist
          if [[ "${PACKAGE}" != "iwxxm-validate" ]]; then
            uv build --sdist --package "${PACKAGE}" -o dist
          else
            echo "Skipping standalone sdist for iwxxm-validate (schemas via wheel hook)."
          fi
          ls -la dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tac-validate
            tag_prefix: tac-validate-v
          - package: iwxxm-validate
            tag_prefix: iwxxm-validate-v
          - package: tac2iwxxm
            tag_prefix: tac2iwxxm-v
    if: >-
      always()
      && needs.build.result == 'success'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.package == matrix.package)
        || (github.event_name == 'push' && startsWith(github.ref_name, matrix.tag_prefix))
      )
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist

      - name: Clean-venv install smoke
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -n1)"
          uv venv .smoke-venv
          # shellcheck disable=SC1091
          source .smoke-venv/bin/activate
          uv pip install "${wheel}"
          case "${PACKAGE}" in
            tac-validate)
              python -c "from tac_validate import lint; print('tac-validate ok')"
              tac-validate --help >/dev/null
              ;;
            iwxxm-validate)
              python -c "from iwxxm_validate import validate_iwxxm; print('iwxxm-validate ok')"
              iwxxm-validate --help >/dev/null
              ;;
            tac2iwxxm)
              python -c "from tac2iwxxm import convert; r=convert('METAR KJFK 231751Z 18012KT 10SM FEW040 15/07 A3005=', product='METAR'); assert r.ok and r.xml; print('tac2iwxxm ok')"
              ;;
          esac

  publish:
    name: Publish ${{ matrix.package }}
    needs: [build, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tac-validate
            tag_prefix: tac-validate-v
          - package: iwxxm-validate
            tag_prefix: iwxxm-validate-v
          - package: tac2iwxxm
            tag_prefix: tac2iwxxm-v
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.smoke.result == 'success'
      && (
        (github.event_name == 'push' && startsWith(github.ref_name, matrix.tag_prefix))
        || (github.event_name == 'workflow_dispatch' && inputs.package == matrix.package && inputs.publish == true)
      )
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
