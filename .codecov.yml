codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "0...100"
  flags:
    backend:
      carryforward: true
      paths:
        - apps/backend/src/
    frontend:
      carryforward: true
      paths:
        - apps/frontend/src/
    tac2iwxxm:
      carryforward: true
      paths:
        - packages/tac2iwxxm/src/
  status:
    project:
      default:
        target: 95%
        threshold: 0%
    patch:
      default:
        target: 95%
        threshold: 0%
    backend:
      default:
        flags: [backend]
        target: 95%
        threshold: 0%
    frontend:
      default:
        flags: [frontend]
        target: 95%
        threshold: 0%
    tac2iwxxm:
      default:
        flags: [tac2iwxxm]
        target: 95%
        threshold: 0%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
