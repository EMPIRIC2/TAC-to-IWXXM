codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "0...100"
  flags:
    backend:
      paths:
        - backend/
    auth:
      paths:
        - auth/
    frontend:
      paths:
        - frontend/
    gifts:
      paths:
        - GIFTs/
  status:
    project:
      backend:
        target: 75%
        threshold: 0%
        flags:
          - backend
        if_not_found: failure
        if_ci_failed: error
      auth:
        target: 75%
        threshold: 0%
        flags:
          - auth
        if_not_found: failure
        if_ci_failed: error
      frontend:
        target: 75%
        threshold: 0%
        flags:
          - frontend
        if_not_found: success
        if_ci_failed: success
      gifts:
        target: 75%
        threshold: 0%
        flags:
          - gifts
        if_not_found: success
        if_ci_failed: success
    patch:
      default:
        target: 60%
        threshold: 5%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
