codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "0...100"
  flags:
    backend:
      carryforward: true
      paths:
        - backend/src/
    auth:
      carryforward: true
      paths:
        - auth/src/
    frontend:
      carryforward: true
      paths:
        - frontend/src/
    gifts:
      carryforward: true
  status:
    project: off
    patch: off

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
