# F8 default ingest workflow — maps to metar_worker.pipeline.process_job (ADR-042)
# Runtime: Planned — contract reference only until packages/workflows ships.

id: f8-metar-ingest-default
version: "1.0.0"
description: Near-RT METAR/SPECI ingest — lint, convert, IWXXM validate, store or quarantine.

profile:
  # Resolved from worker env today (INGEST_PROFILE, IWXXM_VERSION)
  id: ${ENV:INGEST_PROFILE}
  iwxxm_version: ${ENV:IWXXM_VERSION}

pipeline:
  - validate-tac
  - convert-iwxxm
  - validate-xsd
  - validate-schematron

onValid:
  store:
    - sink: iwxxm_reports

onInvalid:
  store:
    - sink: quarantine-db
