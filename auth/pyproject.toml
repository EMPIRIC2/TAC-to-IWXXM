[project]
name = "metar-auth"
version = "0.1.0"
description = "Authentication service/library for METAR to IWXXM platform"
requires-python = ">=3.9"
dependencies = [
	"fastapi>=0.110",
	"uvicorn>=0.23",
	"SQLAlchemy>=2.0",
	"psycopg2-binary>=2.9.9",
	"passlib[bcrypt]>=1.7",
	"python-jose[cryptography]>=3.3.0",
	"email-validator>=2.0.0.post2",
	"httpx>=0.23.0,<0.28",
	"requests>=2.31",
    "prometheus-client>=0.22.1",
	"supabase>=2.7.0,<3.0",
	"python-dotenv>=1.0.0",
	"typing_extensions>=4.0.0",
	"pytest>=8.3.5",
	"pytest-cov>=7.0.0",
	"pytest-asyncio>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.4",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.20.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auth"]
package-dir = {"auth" = "src"}

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
minversion = "7.0"
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "asyncio: Async tests",
    "e2e: End-to-end tests",
]
filterwarnings = [
    "ignore:enablePackrat",
    "ignore:escChar",
    "ignore:unquoteResults",
    "ignore:@model_validator",
    "ignore::DeprecationWarning:pyiceberg",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/api.py",
    "src/supabase_proxy.py",
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
