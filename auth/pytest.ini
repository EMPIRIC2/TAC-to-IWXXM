[pytest]
# Add markers
markers =
    unit: Unit tests
    integration: Integration tests
    asyncio: Async tests
    e2e: End-to-end tests

# Async test configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Filter warnings from external dependencies
filterwarnings =
    # Ignore pattern-based warnings from external libraries
    ignore:enablePackrat
    ignore:escChar
    ignore:unquoteResults
    ignore:@model_validator
    # Ignore deprecation warnings from pyiceberg
    ignore::DeprecationWarning:pyiceberg

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short

# Minimum Python version
minversion = 7.0
