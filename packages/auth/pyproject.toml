[project]
name = "auth"
version = "0.2.0"
description = "The auth package makes sure that Supabase Auth JSON Web Tokens are valid."
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "PyJWT[crypto]==2.13.0",
  "pydantic==2.13.4",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.0",
  "pytest-asyncio==1.4.0",
  "httpx2==2.4.0",
  "respx==0.23.1",
  "cryptography==50.0.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

# Ruff / pytest / coverage inherit from root pyproject.toml (EV-exact-dep-pins).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

filterwarnings = [
  "error",
]

[tool.coverage.run]
branch = true
source = ["src/auth"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
extend = "../../pyproject.toml"
