[project]
name = "metar-auth"
version = "0.1.0"
description = "Authentication service/library for METAR to IWXXM platform"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.110",
	"uvicorn>=0.23",
	"SQLAlchemy>=2.0",
	"psycopg2-binary>=2.9.9",
	"passlib[bcrypt]>=1.7",
	"python-jose[cryptography]>=3.3.0",
	"email-validator>=2.0.0.post2",
	"httpx>=0.23.0",
	"requests>=2.31",
    "prometheus-client>=0.22.1",
	"supabase>=2.7.0,<3.0",
	"python-dotenv>=1.0.0",
	"typing_extensions>=4.0.0",
	"pytest>=8.4",
	"pytest-cov>=6.0",
	"pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
minversion = "7.0"
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "asyncio: Async tests",
    "e2e: End-to-end tests",
]
filterwarnings = [
    "ignore:enablePackrat",
    "ignore:escChar",
    "ignore:unquoteResults",
    "ignore:@model_validator",
    "ignore::DeprecationWarning:pyiceberg",
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "src/**/__init__.py",
    "src/__init__.py",
    "*/__init__.py",
    "*/test_*.py",
    "src/api.py",
    "src/auth/api.py",
    "src/observability.py",
]

[tool.coverage.report]
fail_under = 98
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/__main__.py" = ["E402"]
"tests/**" = ["W293", "I001", "F821", "F541", "F401", "E402", "E722", "F811", "F841"]
