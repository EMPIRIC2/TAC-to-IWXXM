[project]
name = "metar-auth"
version = "0.2.0"
description = "Verify Supabase Auth JSON Web Tokens (JWTs) and serve /auth HTTP routes"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.137.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.13.0",
  "pydantic==2.13.4",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.0",
  "pytest-asyncio==1.4.0",
  "httpx2==2.4.0",
  "respx==0.23.1",
  "cryptography==50.0.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metar_auth"]

# Ruff / pytest / coverage inherit from root pyproject.toml (EV-exact-dep-pins).
