[project]
name = "reference-lookup"
version = "2026.11.5"
description = "Look up navaid and ICAO station coordinates for TAC to IWXXM work"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
]

[project.entry-points.pytest11]
reference_lookup_guard = "reference_lookup.pytest_plugin"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_lookup"]

# Override (required): package sources are formatted at line-length 120; root is 88.
[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

# Override (required): package coverage CLI uses this file as --cov-config; keep
# pragma / TYPE_CHECKING excludes that are not on the root report table.
[tool.coverage.run]
branch = true
source = ["src/reference_lookup"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
