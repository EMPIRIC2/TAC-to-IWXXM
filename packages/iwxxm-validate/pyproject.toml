[project]
name = "iwxxm-validate"
version = "0.2.0"
description = "Validate IWXXM XML with XSD and Schematron (schemas bundled)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "lxml>=4.9.0",
  "msgspec>=0.19",
]

[project.scripts]
iwxxm-validate = "iwxxm_validate.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwxxm_validate"]
# Generated schema trees (gitignored) must still land in the wheel (E10-34).
artifacts = [
  "iwxxm_validate/schemas/**",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Maturin builds the optional PyO3 cdylib (F13 / E10-36). Pure-Python hatch wheel
# remains the default ``uv sync`` path; CI rust job runs ``maturin develop``.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "iwxxm_validate._rust"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: longer local/CI smokes (clean-venv wheel installs)",
]

[tool.coverage.run]
branch = true
source = ["src/iwxxm_validate"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
