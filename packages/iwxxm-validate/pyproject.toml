[project]
name = "iwxxm-validate"
version = "2026.11.5.1"
description = "Validate IWXXM XML with XSD and Schematron (schemas bundled)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "lxml==6.1.1",
  "msgspec==0.21.1",
  "pyyaml==6.0.3",
]

[project.scripts]
iwxxm-validate = "iwxxm_validate.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwxxm_validate"]
# Generated schema trees (gitignored) must still land in the wheel (E10-34).
artifacts = [
  "iwxxm_validate/schemas/**",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Maturin builds the optional PyO3 cdylib (F13 / E10-36). Pure-Python hatch wheel
# remains the default ``uv sync`` path; CI rust job runs ``maturin develop``.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "iwxxm_validate._rust"

# Override (required): package sources are formatted at line-length 120; root is 88.
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

filterwarnings = [
  "error",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast unit tests",
  "slow: longer local/CI smokes (clean-venv wheel installs)",
]

[tool.coverage.run]
branch = true
source = ["src/iwxxm_validate"]

[tool.coverage.report]
fail_under = 100
show_missing = true


[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120
