[project]
name = "iwxxm-validate"
version = "0.1.0"
description = "IWXXM XSD + Schematron validation engine (F2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "lxml>=4.9.0",
  "msgspec>=0.19",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwxxm_validate"]

# Maturin builds the optional PyO3 cdylib (F13 / E10-36). Pure-Python hatch wheel
# remains the default ``uv sync`` path; CI rust job runs ``maturin develop``.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "iwxxm_validate._rust"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/iwxxm_validate"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
