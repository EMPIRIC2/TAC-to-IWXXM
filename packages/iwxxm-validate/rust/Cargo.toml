[package]
name = "iwxxm_validate_rust"
version = "0.1.0"
edition = "2021"
description = "PyO3 native core for iwxxm-validate (F13 / E10-36)"
license = "MIT"
rust-version = "1.74"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }

[package.metadata.maturin]
python-source = "../src"
module-name = "iwxxm_validate._rust"
