[project]
name = "tac-decoding"
version = "2026.11.5"
description = "Decode Traditional Alphanumeric Code (TAC) aviation weather into plain-language segments and summaries"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "msgspec==0.21.1",
  "pyyaml==6.0.3",
]

[project.scripts]
tac-decoding = "tac_decoding.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac_decoding"]

[tool.hatch.build.targets.wheel.force-include]
"src/tac_decoding/data/decode_glossary.yaml" = "tac_decoding/data/decode_glossary.yaml"
"src/tac_decoding/data/catalog_meta.yaml" = "tac_decoding/data/catalog_meta.yaml"
"src/tac_decoding/data/packs/metar.yaml" = "tac_decoding/data/packs/metar.yaml"
"src/tac_decoding/data/packs/speci.yaml" = "tac_decoding/data/packs/speci.yaml"

# Override (required): package sources are formatted at line-length 120; root is 88.
[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

# Override (required): package coverage CLI uses this file as --cov-config; keep
# pragma / TYPE_CHECKING excludes that are not on the root report table.
[tool.coverage.run]
branch = true
source = ["src/tac_decoding"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# deptry: unused (DEP002), missing (DEP001), transitive (DEP003), misplaced-dev (DEP004).
# [Corpus: tech-spec] docs/technical-requirements.md; [Corpus: system-spec] docs/architecture.md.
# Run all members: scripts/ci/run_deptry_all.sh
[tool.deptry]
known_first_party = ["tac_decoding"]
pep621_dev_dependency_groups = ["dev"]
