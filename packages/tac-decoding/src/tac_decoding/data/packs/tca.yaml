  - id: fcst_psn_18_hr
    label: "FCST PSN +18 HR"
    explain: "FCST PSN +18 HR {value}"
  - id: fcst_max_wind_18_hr
    label: "FCST MAX WIND +18 HR"
    explain: "FCST MAX WIND +18 HR {value}"
  - id: fcst_psn_24_hr
    label: "FCST PSN +24 HR"
    explain: "FCST PSN +24 HR {value}"
  - id: fcst_max_wind_24_hr
    label: "FCST MAX WIND +24 HR"
    explain: "FCST MAX WIND +24 HR {value}"
  - id: rmk
    label: "RMK"
    explain: "RMK {value}"
  - id: nxt_msg
    label: "NXT MSG"
    explain: "NXT MSG {value}"
