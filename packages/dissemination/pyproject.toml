[project]
name = "dissemination"
version = "0.1.0"
description = "IWXXM dissemination sinks, writer-contract DDL, and egress allowlist helpers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiomysql>=0.2.0",
  "aiosqlite>=0.20.0",
  "aioodbc>=0.5.0",
  "aiosmtplib>=3.0.0",
  "msgspec>=0.19",
  "httpx>=0.28",
  "aiomqtt>=2.3.0,<3",
  "tac2iwxxm",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dissemination"]

[project.optional-dependencies]
integration = [
  "testcontainers[mysql,postgres]>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: Compose/Testcontainers multi-DB + wis2box harness tests (E14-09)",
]

[tool.coverage.run]
branch = true
source = ["src/dissemination"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
extend = "../../ruff.toml"
line-length = 120
