[project]
name = "iwxxm-dissemination"
version = "0.1.0"
description = "IWXXM send sinks, writer-contract SQL helpers, and egress host allowlist helpers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]==2.0.50",
  "asyncpg==0.31.0",
  "aiomysql==0.3.2",
  "aiosqlite==0.22.1",
  "aioodbc==0.5.0",
  "aiosmtplib==5.1.2",
  "msgspec==0.21.1",
  "httpx==0.28.1",
  "aiomqtt==2.5.1",
  "tac2iwxxm==2026.11.5.1",
]

[tool.uv.sources]
tac2iwxxm = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dissemination"]

[project.optional-dependencies]
integration = [
  "testcontainers[mysql,postgres]==4.14.2",
]

# Override (required): package sources are formatted at line-length 120; root is 88.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

filterwarnings = [
  "error",
]
markers = [
  "integration: Compose/Testcontainers multi-DB + wis2box harness tests (E14-09)",
]

[tool.coverage.run]
branch = true
source = ["src/dissemination"]

[tool.coverage.report]
fail_under = 100
show_missing = true


[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

# Pytest / remaining coverage inherit from root; Makefile passes --cov=* CLI flags.

# deptry: unused (DEP002), missing (DEP001), transitive (DEP003), misplaced-dev (DEP004).
# [Corpus: tech-spec] docs/technical-requirements.md; [Corpus: system-spec] docs/architecture.md.
# Run all members: scripts/ci/run_deptry_all.sh
[tool.deptry]
known_first_party = ["dissemination"]
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# SQLAlchemy async driver plugins loaded by URL scheme; testcontainers is used only by the integration extra tests.
DEP002 = ["asyncpg", "aiomysql", "aiosqlite", "aioodbc", "testcontainers"]
# pyodbc is an optional import guarded by try/except in odbc.py (aioodbc dependency).
DEP003 = ["pyodbc"]
