[project]
name = "dissemination"
version = "0.1.0"
description = "Dissemination sinks, writer-contract DDL, and SSRF/allowlist helpers (F16–F19)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiomysql>=0.2.0",
  "aiosqlite>=0.20.0",
  "aioodbc>=0.5.0",
  "aiosmtplib>=3.0.0",
  "msgspec>=0.19",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dissemination"]

[project.optional-dependencies]
integration = [
  "testcontainers[mysql,postgres]>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: Compose/Testcontainers multi-DB engine tests (T2.5–T2.6 / E14-09)",
]

[tool.coverage.run]
branch = true
source = ["src/dissemination"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
