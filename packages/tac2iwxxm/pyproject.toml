[project]
name = "tac2iwxxm"
version = "2026.11.5.1"
description = "Turn Traditional Alphanumeric Code (TAC) aviation weather reports into IWXXM XML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "hydra-core==1.3.7",
  "msgspec==0.21.1",
  "metar-shared==2026.11.5",
  "pyyaml==6.0.3",
  "tac-decoding==2026.11.5",
  "reference-lookup==2026.11.5",
]

[tool.uv.sources]
metar-shared = { workspace = true }
reference-lookup = { workspace = true }
tac-decoding = { workspace = true }
tac-validate = { workspace = true }
iwxxm-validate = { workspace = true }

[project.scripts]
tac2iwxxm = "tac2iwxxm.cli:main"

[project.optional-dependencies]
# F14 / E10-20: optional TAC lint + IWXXM XSD/Schematron validators.
validate = [
  "tac-validate==2026.11.5.1",
  "iwxxm-validate==2026.11.5.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac2iwxxm"]

[tool.hatch.build.targets.wheel.force-include]
"src/tac2iwxxm/data/decode_glossary.yaml" = "tac2iwxxm/data/decode_glossary.yaml"
"src/tac2iwxxm/data/conversion_schema_blocks.yaml" = "tac2iwxxm/data/conversion_schema_blocks.yaml"
"src/tac2iwxxm/data/conversion_catalog_meta.yaml" = "tac2iwxxm/data/conversion_catalog_meta.yaml"
"src/tac2iwxxm/data/tac_validation_rules.yaml" = "tac2iwxxm/data/tac_validation_rules.yaml"
"src/tac2iwxxm/data/iwxxm_validation_asserts.yaml" = "tac2iwxxm/data/iwxxm_validation_asserts.yaml"
"src/tac2iwxxm/data/dissemination_transforms.yaml" = "tac2iwxxm/data/dissemination_transforms.yaml"
"src/tac2iwxxm/data/decoding_library_entries.yaml" = "tac2iwxxm/data/decoding_library_entries.yaml"
"src/tac2iwxxm/data/emit_maps/annex3-metar-speci.yaml" = "tac2iwxxm/data/emit_maps/annex3-metar-speci.yaml"
"src/tac2iwxxm/data/emit_maps/iwxxm-us-metar-speci.yaml" = "tac2iwxxm/data/emit_maps/iwxxm-us-metar-speci.yaml"
"src/tac2iwxxm/data/emit_maps/ca-eccc-metar-speci.yaml" = "tac2iwxxm/data/emit_maps/ca-eccc-metar-speci.yaml"
"src/tac2iwxxm/data/emit_maps/annex3-taf.yaml" = "tac2iwxxm/data/emit_maps/annex3-taf.yaml"
"src/tac2iwxxm/data/emit_maps/iwxxm-us-taf.yaml" = "tac2iwxxm/data/emit_maps/iwxxm-us-taf.yaml"
"src/tac2iwxxm/data/emit_maps/ca-eccc-taf.yaml" = "tac2iwxxm/data/emit_maps/ca-eccc-taf.yaml"
"src/tac2iwxxm/data/emit_maps/annex3-sigmet.yaml" = "tac2iwxxm/data/emit_maps/annex3-sigmet.yaml"
"src/tac2iwxxm/data/emit_maps/iwxxm-us-sigmet.yaml" = "tac2iwxxm/data/emit_maps/iwxxm-us-sigmet.yaml"
"src/tac2iwxxm/data/emit_maps/annex3-airmet.yaml" = "tac2iwxxm/data/emit_maps/annex3-airmet.yaml"
"src/tac2iwxxm/data/emit_maps/iwxxm-us-airmet.yaml" = "tac2iwxxm/data/emit_maps/iwxxm-us-airmet.yaml"
"src/tac2iwxxm/data/emit_maps/ca-eccc-airmet.yaml" = "tac2iwxxm/data/emit_maps/ca-eccc-airmet.yaml"
"src/tac2iwxxm/data/emit_maps/annex3-vaa.yaml" = "tac2iwxxm/data/emit_maps/annex3-vaa.yaml"
"src/tac2iwxxm/data/emit_maps/annex3-tca.yaml" = "tac2iwxxm/data/emit_maps/annex3-tca.yaml"
"src/tac2iwxxm/conf/convert_allowlist.yaml" = "tac2iwxxm/conf/convert_allowlist.yaml"

# Maturin builds the optional PyO3 cdylib (ADR-017 / T4.3). Pure-Python hatch wheel
# remains the default ``uv sync`` path; CI rust job runs ``maturin develop``.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "tac2iwxxm._rust"

# Override (required): package sources are formatted at line-length 120; root is 88.
[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120
