[project]
name = "tac2iwxxm"
version = "0.2.2"
description = "Convert TAC aviation weather reports to IWXXM XML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "msgspec>=0.19",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# F14 / E10-20: optional TAC lint + IWXXM XSD/Schematron validators.
validate = [
  "tac-validate>=0.1.0",
  "iwxxm-validate>=0.1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac2iwxxm"]

[tool.hatch.build.targets.wheel.force-include]
"src/tac2iwxxm/data/decode_glossary.yaml" = "tac2iwxxm/data/decode_glossary.yaml"

# Maturin builds the optional PyO3 cdylib (ADR-017 / T4.3). Pure-Python hatch wheel
# remains the default ``uv sync`` path; CI rust job runs ``maturin develop``.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "tac2iwxxm._rust"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# E23-T4=2 / TC-EV023-005: informative Amd79 suite uses @pytest.mark.xfail(strict=False);
# do not harden to xfail_strict so soft failures never hard-fail PR CI.
xfail_strict = false
markers = [
  "slow: longer local/CI smokes (clean-venv wheel installs)",
  "iwxxm_translation_informative: Amd79-80-2023 TAC→2025-2 informative suite (EV-023; soft/xfail in CI)",
]

[tool.coverage.run]
branch = true
source = ["src/tac2iwxxm"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
