    that failed translation sho…'
  context: //iwxxm:METAR|//iwxxm:SPECI
  test: ( if( (string-length(@translationFailedTAC) gt 0) or (@permissibleUsage = 'NON-OPERATIONAL') )
    then( exists(iwxxm:issueTime) and exists(iwxxm:aerodrome) and exists(iwxxm:observationTime) ) else(
    true() ) )
  enabled_default: true
