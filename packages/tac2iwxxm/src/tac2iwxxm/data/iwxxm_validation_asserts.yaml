schema_version: 1
source: vendor/schemas/iwxxm/2025-2/IWXXM/rule/iwxxm.sch
iwxxm_version: 2025-2
asserts:
- id: AIRMET.AIRMET-1
  pattern_id: AIRMET.AIRMET-1
  label: 'AIRMET.AIRMET-1: An AIRMET report cannot have a reportStatus of ''AMENDMENT'' or ''CORRECTION'''
  context: //iwxxm:AIRMET
  test: ( @reportStatus != 'AMENDMENT' and @reportStatus != 'CORRECTION' )
  enabled_default: true
- id: AIRMET.AIRMET-2
  pattern_id: AIRMET.AIRMET-2
  label: 'AIRMET.AIRMET-2: A non-operational report or a report that failed translation should have as
    a minimum appropriately fil…'
  context: //iwxxm:AIRMET
  test: ( if( (string-length(@translationFailedTAC) gt 0) or (@permissibleUsage = 'NON-OPERATIONAL') )
    then( exists(iwxxm:issueTime) and exists(iwxxm:issuingAirTrafficServicesUnit) and exists(iwxxm:validPeriod)
    ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMET-3
  pattern_id: AIRMET.AIRMET-3
  label: 'AIRMET.AIRMET-3: A ''CANCELLATION'' report should have appropriately filled elements including
    iwxxm:issueTime, iwxxm:issu…'
  context: //iwxxm:AIRMET
  test: ( if( (@isCancelReport= 'true') and (string-length(@translationFailedTAC) eq 0) and (@permissibleUsage
    = 'OPERATIONAL') ) then( exists(iwxxm:issueTime) and exists(iwxxm:issuingAirTrafficServicesUnit) and
    exists(iwxxm:originatingMeteorologicalWatchOffice) and exists(iwxxm:issuingAirTrafficServicesRegion)
    and exists(iwxxm:sequenceNumber) and exists(iwxxm:validPeriod) and exists(iwxxm:cancelledReportSequenceNumber)
    and exists(iwxxm:cancelledReportValidPeriod) and empty(iwxxm:phenomenon) and empty(iwxxm:analysis)
    ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMET-4
  pattern_id: AIRMET.AIRMET-4
  label: 'AIRMET.AIRMET-4: An ordinary report should have appropriately filled elements including iwxxm:issueTime,
    iwxxm:issuingAi…'
  context: //iwxxm:AIRMET
  test: ( if( (empty(@isCancelReport) or @isCancelReport = 'false') and (string-length(@translationFailedTAC)
    eq 0) and (@permissibleUsage = 'OPERATIONAL') ) then( exists(iwxxm:issueTime) and exists(iwxxm:issuingAirTrafficServicesUnit)
    and exists(iwxxm:originatingMeteorologicalWatchOffice) and exists(iwxxm:issuingAirTrafficServicesRegion)
    and exists(iwxxm:sequenceNumber) and exists(iwxxm:validPeriod) and empty(iwxxm:cancelledReportSequenceNumber)
    and empty(iwxxm:cancelledReportValidPeriod) and exists(iwxxm:phenomenon) and exists(iwxxm:analysis)
    ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMET-5a
  pattern_id: AIRMET.AIRMET-5a
  label: 'AIRMET.AIRMET-5a: iwxxm:analysis//iwxxm:phenomenonTime of an observed phenomenon must be less
    than or equal to iwxxm:val…'
  context: //iwxxm:AIRMET
  test: ( if( (string-length(@translationFailedTAC) eq 0) and (@permissibleUsage = 'OPERATIONAL') and
    (iwxxm:analysis/iwxxm:*/@timeIndicator = 'OBSERVATION') and exists(iwxxm:analysis//iwxxm:phenomenonTime/*)
    and exists(iwxxm:validPeriod/*) ) then( empty(index-of(for $i in iwxxm:analysis return number(translate($i//iwxxm:phenomenonTime/gml:TimeInstant/gml:timePosition,'-T:Z',''))
    le number(translate(iwxxm:validPeriod/gml:TimePeriod/gml:beginPosition,'-T:Z','')),false())) ) else(
    true() ) )
  enabled_default: true
- id: AIRMET.AIRMET-5b
  pattern_id: AIRMET.AIRMET-5b
  label: 'AIRMET.AIRMET-5b: iwxxm:analysis//iwxxm:phenomenonTime of a forecast phenomenon must be greater
    than or equal to iwxxm:v…'
  context: //iwxxm:AIRMET
  test: ( if( (string-length(@translationFailedTAC) eq 0) and (@permissibleUsage = 'OPERATIONAL') and
    (iwxxm:analysis/iwxxm:*/@timeIndicator = 'FORECAST') and exists(iwxxm:analysis//iwxxm:phenomenonTime/*)
    and exists(iwxxm:validPeriod/*) ) then( empty(index-of(for $i in iwxxm:analysis return number(translate($i//iwxxm:phenomenonTime/gml:TimeInstant/gml:timePosition,'-T:Z',''))
    ge number(translate(iwxxm:validPeriod/gml:TimePeriod/gml:beginPosition,'-T:Z','')),false())) ) else(
    true() ) )
  enabled_default: true
- id: AIRMET.AIRMET-6
  pattern_id: AIRMET.AIRMET-6
  label: 'AIRMET.AIRMET-6: If a geometry is defined for iwxxm:issuingAirTrafficServicesRegion//aixm:geometryComponent
    with the pro…'
  context: //iwxxm:AIRMET
  test: ( if( exists(iwxxm:issuingAirTrafficServicesRegion//aixm:geometryComponent) ) then( empty(index-of(iwxxm:issuingAirTrafficServicesRegion//aixm:geometryComponent//*[self::aixm:Surface
    or self::aixm:Curve]/(ancestor-or-self::*[exists(@srsName)])[last()]/(@srsDimension='2' and exists(@axisLabels)),
    false())) ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMET.phenomenon
  pattern_id: AIRMET.AIRMET.phenomenon
  label: Element in iwxxm:AIRMET/iwxxm:phenomenon should be a member of code list http://codes.wmo.int/49-2/AirWxPhenomena
  context: //iwxxm:AIRMET/iwxxm:phenomenon
  test: '@xlink:href = document(''codes.wmo.int-49-2-AirWxPhenomena.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-1
  pattern_id: AIRMET.AIRMETEvolvingCondition-1
  label: 'AIRMET.AIRMETEvolvingCondition-1: cloudBase shall be reported in metres (m) or feet ([ft_i])'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:cloudBase) and not(iwxxm:cloudBase/@xsi:nil = 'true') ) then( (iwxxm:cloudBase/@uom
    = 'm') or (iwxxm:cloudBase/@uom = '[ft_i]') ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-2
  pattern_id: AIRMET.AIRMETEvolvingCondition-2
  label: 'AIRMET.AIRMETEvolvingCondition-2: cloudTop shall be reported in metres (m) or feet ([ft_i])'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:cloudTop) and not(iwxxm:cloudTop/@xsi:nil = 'true') ) then( (iwxxm:cloudTop/@uom
    = 'm') or (iwxxm:cloudTop/@uom = '[ft_i]') ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-3
  pattern_id: AIRMET.AIRMETEvolvingCondition-3
  label: 'AIRMET.AIRMETEvolvingCondition-3: directionOfMotion shall be reported in degrees (deg)'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:directionOfMotion) and not(iwxxm:directionOfMotion/@xsi:nil = 'true') ) then(
    iwxxm:directionOfMotion/@uom = 'deg' ) else true())
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-4
  pattern_id: AIRMET.AIRMETEvolvingCondition-4
  label: 'AIRMET.AIRMETEvolvingCondition-4: speedOfMotion shall be reported in kilometres per hour (km/h)
    or knots ([kn_i])'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:speedOfMotion) and not(iwxxm:speedOfMotion/@xsi:nil = 'true') ) then( (iwxxm:speedOfMotion/@uom
    = 'km/h') or (iwxxm:speedOfMotion/@uom = '[kn_i]') ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-5
  pattern_id: AIRMET.AIRMETEvolvingCondition-5
  label: 'AIRMET.AIRMETEvolvingCondition-5: surfaceVisibility shall be reported in metres (m)'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:surfaceVisibility) and not(iwxxm:surfaceVisibility/@xsi:nil = 'true') ) then(
    iwxxm:surfaceVisibility/@uom = 'm' ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-6
  pattern_id: AIRMET.AIRMETEvolvingCondition-6
  label: 'AIRMET.AIRMETEvolvingCondition-6: surfaceWindSpeed shall be reported in metres per second (m/s)
    or knots ([kn_i])'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:surfaceWindSpeed) and not(iwxxm:surfaceWindSpeed/@xsi:nil = 'true') ) then(
    (iwxxm:surfaceWindSpeed/@uom = 'm/s') or (iwxxm:surfaceWindSpeed/@uom = '[kn_i]') ) else( true() )
    )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-7
  pattern_id: AIRMET.AIRMETEvolvingCondition-7
  label: 'AIRMET.AIRMETEvolvingCondition-7: surfaceWindDirection shall be reported in the degrees unit
    of measure (''deg'')'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:surfaceWindDirection) and not(iwxxm:surfaceWindDirection/@xsi:nil = 'true')
    ) then( iwxxm:surfaceWindDirection/@uom = 'deg' ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-8
  pattern_id: AIRMET.AIRMETEvolvingCondition-8
  label: 'AIRMET.AIRMETEvolvingCondition-8: surfaceWindDirection and surfaceWindSpeed must be reported
    together'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( not((exists(iwxxm:surfaceWindDirection) and exists(iwxxm:surfaceWindSpeed)) or (empty(iwxxm:surfaceWindDirection)
    and empty(iwxxm:surfaceWindSpeed))) ) then( false() ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition-9
  pattern_id: AIRMET.AIRMETEvolvingCondition-9
  label: 'AIRMET.AIRMETEvolvingCondition-9: If a geometry of iwxxm:geometry is defined with the provision
    of attribute srsName, at…'
  context: //iwxxm:AIRMETEvolvingCondition
  test: ( if( exists(iwxxm:geometry//*[self::aixm:horizontalProjection or self::aixm:centreline]) ) then(
    empty(index-of(iwxxm:geometry//*[self::aixm:Surface or self::aixm:Curve]/(ancestor-or-self::*[exists(@srsName)])[last()]/(@srsDimension='2'
    and exists(@axisLabels)), false())) ) else( true() ) )
  enabled_default: true
- id: AIRMET.AIRMETEvolvingCondition.surfaceVisibilityCause
  pattern_id: AIRMET.AIRMETEvolvingCondition.surfaceVisibilityCause
  label: Element in iwxxm:AIRMETEvolvingCondition/iwxxm:surfaceVisibilityCause should be a member of code
    list http://codes.wmo.i…
  context: //iwxxm:AIRMETEvolvingCondition/iwxxm:surfaceVisibilityCause
  test: '@xlink:href = document(''codes.wmo.int-49-2-WeatherCausingVisibilityReduction.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: AIRMET.AeronauticalAreaWeatherPhenomenon
  pattern_id: AIRMET.AeronauticalAreaWeatherPhenomenon
  label: Element in iwxxm:AeronauticalAreaWeatherPhenomenon should be a member of code list http://codes.wmo.int/49-2/AirWxPhenom…
  context: //iwxxm:AeronauticalAreaWeatherPhenomenon
  test: '@xlink:href = document(''codes.wmo.int-49-2-AirWxPhenomena.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: AIRMET.WeatherCausingVisibilityReduction
  pattern_id: AIRMET.WeatherCausingVisibilityReduction
  label: Element in iwxxm:WeatherCausingVisibilityReduction should be a member of code list http://codes.wmo.int/49-2/WeatherCaus…
  context: //iwxxm:WeatherCausingVisibilityReduction
  test: '@xlink:href = document(''codes.wmo.int-49-2-WeatherCausingVisibilityReduction.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: Common.AerodromeCloudForecast-1
  pattern_id: Common.AerodromeCloudForecast-1
  label: 'Common.AerodromeCloudForecast-1: If vertical visibility is reported cloud layers should be empty'
  context: //iwxxm:AerodromeCloudForecast
  test: (if( exists(iwxxm:verticalVisibility) ) then( empty(iwxxm:layer) ) else( true() ) )
  enabled_default: true
- id: Common.AerodromeCloudForecast-2
  pattern_id: Common.AerodromeCloudForecast-2
  label: 'Common.AerodromeCloudForecast-2: If cloud layers are reported vertical visibility should be
    empty'
  context: //iwxxm:AerodromeCloudForecast
  test: (if( exists(iwxxm:layer) ) then( empty(iwxxm:verticalVisibility) ) else( true() ) )
  enabled_default: true
- id: Common.AerodromeCloudForecast-3
  pattern_id: Common.AerodromeCloudForecast-3
  label: 'Common.AerodromeCloudForecast-3: verticalVisibility shall be reported in metres (m) or feet
    ([ft_i])'
  context: //iwxxm:AerodromeCloudForecast
  test: ( if( exists(iwxxm:verticalVisibility) and not(iwxxm:verticalVisibility/@xsi:nil = 'true') ) then(
    (iwxxm:verticalVisibility/@uom = 'm') or (iwxxm:verticalVisibility/@uom = '[ft_i]') ) else( true()
    ) )
  enabled_default: true
- id: Common.AerodromeForecastWeather
  pattern_id: Common.AerodromeForecastWeather
  label: Element in iwxxm:AerodromeForecastWeather should be a member of code list http://codes.wmo.int/49-2/AerodromePresentOrFo…
  context: //iwxxm:AerodromeForecastWeather
  test: '@xlink:href = document(''codes.wmo.int-49-2-AerodromePresentOrForecastWeather.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: Common.AerodromeSurfaceWindForecast-1
  pattern_id: Common.AerodromeSurfaceWindForecast-1
  label: 'Common.AerodromeSurfaceWindForecast-1: Wind direction is not reported when variable winds are
    indicated'
  context: //iwxxm:AerodromeSurfaceWindForecast
  test: ( if( @variableDirection = 'true' ) then( empty(iwxxm:meanWindDirection) ) else( true() ) )
  enabled_default: true
- id: Common.AerodromeSurfaceWindTrendForecast-1
  pattern_id: Common.AerodromeSurfaceWindTrendForecast-1
  label: 'Common.AerodromeSurfaceWindTrendForecast-1: meanWindDirection shall be reported in degrees (deg)'
  context: //iwxxm:AerodromeSurfaceWindTrendForecast|//iwxxm:AerodromeSurfaceWindForecast
  test: ( if( exists(iwxxm:meanWindDirection) and not(iwxxm:meanWindDirection/@xsi:nil = 'true') ) then(
    iwxxm:meanWindDirection/@uom = 'deg' ) else( true() ) )
  enabled_default: true
- id: Common.AerodromeSurfaceWindTrendForecast-2
  pattern_id: Common.AerodromeSurfaceWindTrendForecast-2
  label: 'Common.AerodromeSurfaceWindTrendForecast-2: meanWindSpeed shall be reported in metres per second
    (m/s) or knots ([kn_i])'
  context: //iwxxm:AerodromeSurfaceWindTrendForecast|//iwxxm:AerodromeSurfaceWindForecast
  test: ( if( exists(iwxxm:meanWindSpeed) and not(iwxxm:meanWindSpeed/@xsi:nil = 'true') ) then( (iwxxm:meanWindSpeed/@uom
    = 'm/s') or (iwxxm:meanWindSpeed/@uom = '[kn_i]') ) else( true() ) )
  enabled_default: true
- id: Common.AerodromeSurfaceWindTrendForecast-3
  pattern_id: Common.AerodromeSurfaceWindTrendForecast-3
  label: 'Common.AerodromeSurfaceWindTrendForecast-3: windGustSpeed shall be reported in metres per second
    (m/s) or knots ([kn_i])'
  context: //iwxxm:AerodromeSurfaceWindTrendForecast|//iwxxm:AerodromeSurfaceWindForecast
  test: ( if( exists(iwxxm:windGustSpeed) and not(iwxxm:windGustSpeed/@xsi:nil = 'true') ) then( (iwxxm:windGustSpeed/@uom
    = 'm/s') or (iwxxm:windGustSpeed/@uom = '[kn_i]') ) else( true() ) )
  enabled_default: true
- id: Common.BasicReport-1
  pattern_id: Common.BasicReport-1
  label: 'Common.BasicReport-1: Non-operational reports must include a permissibleUsageReason'
  context: //iwxxm:MeteorologicalFeatureCollection|//iwxxm:WAFSSignificantWeatherForecast|//iwxxm:QuantitativeVolcanicAshConcentrationInformation|//iwxxm:VolcanoObservatoryNoticeForAviation|//iwxxm:METAR|//iwxxm:SPECI|//iwxxm:TAF|//iwxxm:SIGMET|//iwxxm:VolcanicAshSIGMET|//iwxxm:TropicalCycloneSIGMET|//iwxxm:AIRMET|//iwxxm:TropicalCycloneAdvisory|//iwxxm:VolcanicAshAdvisory|//iwxxm:SpaceWeatherAdvisory
  test: ( if( @permissibleUsage = 'NON-OPERATIONAL' ) then( exists(@permissibleUsageReason) ) else( true()
    ) )
  enabled_default: true
- id: Common.BasicReport-2
  pattern_id: Common.BasicReport-2
  label: 'Common.BasicReport-2: Operational reports should not include a permissibleUsageReason'
  context: //iwxxm:MeteorologicalFeatureCollection|//iwxxm:WAFSSignificantWeatherForecast|//iwxxm:QuantitativeVolcanicAshConcentrationInformation|//iwxxm:VolcanoObservatoryNoticeForAviation|//iwxxm:METAR|//iwxxm:SPECI|//iwxxm:TAF|//iwxxm:SIGMET|//iwxxm:VolcanicAshSIGMET|//iwxxm:TropicalCycloneSIGMET|//iwxxm:AIRMET|//iwxxm:TropicalCycloneAdvisory|//iwxxm:VolcanicAshAdvisory|//iwxxm:SpaceWeatherAdvisory
  test: ( if( @permissibleUsage ='OPERATIONAL') then( empty(@permissibleUsageReason) ) else( true() )
    )
  enabled_default: true
- id: Common.BasicReport-3
  pattern_id: Common.BasicReport-3
  label: 'Common.BasicReport-3: All gml:ids in IWXXM reports must be prefixed with ''uuid.'' and must
    be UUID version 4'
  context: //iwxxm:MeteorologicalFeatureCollection|//iwxxm:WAFSSignificantWeatherForecast|//iwxxm:QuantitativeVolcanicAshConcentrationInformation|//iwxxm:VolcanoObservatoryNoticeForAviation|//iwxxm:METAR|//iwxxm:SPECI|//iwxxm:TAF|//iwxxm:SIGMET|//iwxxm:VolcanicAshSIGMET|//iwxxm:TropicalCycloneSIGMET|//iwxxm:AIRMET|//iwxxm:TropicalCycloneAdvisory|//iwxxm:VolcanicAshAdvisory|//iwxxm:SpaceWeatherAdvisory
  test: ( if( //@gml:id[not(matches(.,'uuid\.[a-z0-9]{8}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12}'))]
    ) then( false() ) else( true() ) )
  enabled_default: true
- id: Common.CloudAmountReportedAtAerodrome
  pattern_id: Common.CloudAmountReportedAtAerodrome
  label: Element in iwxxm:CloudAmountReportedAtAerodrome should be a member of code list http://codes.wmo.int/49-2/CloudAmountRep…
  context: //iwxxm:CloudAmountReportedAtAerodrome
  test: '@xlink:href = document(''codes.wmo.int-49-2-CloudAmountReportedAtAerodrome.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: Common.CloudLayer-1
  pattern_id: Common.CloudLayer-1
  label: 'Common.CloudLayer-1: base shall be reported in metres (m) or feet ([ft_i])'
  context: //iwxxm:CloudLayer
  test: ( if( exists(iwxxm:base) and not(iwxxm:base/@xsi:nil = 'true') ) then( (iwxxm:base/@uom = 'm')
    or (iwxxm:base/@uom = '[ft_i]') ) else( true() ) )
  enabled_default: true
- id: Common.CloudLayer.amount
  pattern_id: Common.CloudLayer.amount
  label: Element in iwxxm:CloudLayer/iwxxm:amount should be a member of code list http://codes.wmo.int/49-2/CloudAmountReportedAt…
  context: //iwxxm:CloudLayer/iwxxm:amount
  test: '@xlink:href = document(''codes.wmo.int-49-2-CloudAmountReportedAtAerodrome.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: Common.CloudLayer.cloudType
  pattern_id: Common.CloudLayer.cloudType
  label: Element in iwxxm:CloudLayer/iwxxm:cloudType should be a member of code list http://codes.wmo.int/49-2/SigConvectiveCloud…
  context: //iwxxm:CloudLayer/iwxxm:cloudType
  test: '@xlink:href = document(''codes.wmo.int-49-2-SigConvectiveCloudType.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: Common.Report-1
  pattern_id: Common.Report-1
  label: 'Common.Report-1: Translated reports must include @translatedBulletinID, @translatedBulletinReceptionTime,
    @translationCe…'
  context: //iwxxm:METAR|//iwxxm:SPECI|//iwxxm:TAF|//iwxxm:SIGMET|//iwxxm:VolcanicAshSIGMET|//iwxxm:TropicalCycloneSIGMET|//iwxxm:AIRMET|//iwxxm:TropicalCycloneAdvisory|//iwxxm:VolcanicAshAdvisory|//iwxxm:SpaceWeatherAdvisory
  test: ( if( exists(@translatedBulletinID) or exists(@translatedBulletinReceptionTime) or exists(@translationCentreDesignator)
    or exists(@translationCentreName) or exists(@translationTime) or exists(@translationFailedTAC)) then(
    exists(@translatedBulletinID) and exists(@translatedBulletinReceptionTime) and exists(@translationCentreDesignator)
    and exists(@translationCentreName) and exists(@translationTime) ) else( true() ) )
  enabled_default: true
- id: Common.Report-2
  pattern_id: Common.Report-2
  label: 'Common.Report-2: Total size of extension content must not exceed 5000 characters per report'
  context: //iwxxm:METAR|//iwxxm:SPECI|//iwxxm:TAF|//iwxxm:SIGMET|//iwxxm:VolcanicAshSIGMET|//iwxxm:TropicalCycloneSIGMET|//iwxxm:AIRMET|//iwxxm:TropicalCycloneAdvisory|//iwxxm:VolcanicAshAdvisory|//iwxxm:SpaceWeatherAdvisory
  test: ( if( exists(.//iwxxm:extension) ) then( sum(.//iwxxm:extension/.//text()/string-length(.) ) +sum(.//iwxxm:extension/.//element()/(
    (string-length( name() ) * 2 ) + 5 ) ) +sum(.//iwxxm:extension/.//@*/( 1 + string-length(name()) +
    3 + string-length(.) ) ) +sum(.//iwxxm:extension/.//comment()/( string-length( . ) + 7 )) lt 5000
    ) else( true() ) )
  enabled_default: true
- id: Common.SigConvectiveCloudType
  pattern_id: Common.SigConvectiveCloudType
  label: Element in iwxxm:SigConvectiveCloudType should be a member of code list http://codes.wmo.int/49-2/SigConvectiveCloudType
  context: //iwxxm:SigConvectiveCloudType
  test: '@xlink:href = document(''codes.wmo.int-49-2-SigConvectiveCloudType.rdf'')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    or @nilReason'
  enabled_default: true
- id: IWXXM.ExtensionAlwaysLast
  pattern_id: IWXXM.ExtensionAlwaysLast
  label: 'IWXXM.ExtensionAlwaysLast: Extension elements should be the last elements in their parents'
  context: //iwxxm:extension
  test: following-sibling::*[1][self::iwxxm:extension] or not(following-sibling::*)
  enabled_default: true
- id: IWXXM.nilReasonCheck
  pattern_id: IWXXM.nilReasonCheck
  label: 'IWXXM.nilReasonCheck: nilReason attributes should be a member of http://codes.wmo.int/iwxxm/nil'
  context: //WAFSSignificantWeatherForecast|//QuantitativeVolcanicAshConcentrationInformation|//VolcanoObservatoryNoticeForAviation|//MeteorologicalFeature|//MeteorologicalFeatureCollection
  test: ( if( exists(@nilReason) ) then( @nilReason = document('codes.wmo.int-iwxxm-nil.rdf')/rdf:RDF//skos:member/skos:Concept/owl:versionInfo[@rdf:resource=$iwxxmVersion]/../@rdf:about
    ) else( true() ) )
  enabled_default: true
- id: IWXXM.nilReasonCheckLegacy
  pattern_id: IWXXM.nilReasonCheckLegacy
  label: 'IWXXM.nilReasonCheckLegacy: nilReason attributes should be a member of http://codes.wmo.int/common/nil'
