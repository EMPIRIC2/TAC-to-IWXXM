  test: ( if( @cloudAndVisibilityOK = 'true' ) then( empty(iwxxm:visibility) and empty(iwxxm:rvr) and
    empty(iwxxm:presentWeather) and empty(iwxxm:cloud) ) else( true() ) )
  enabled_default: true
