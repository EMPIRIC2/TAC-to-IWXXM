[project]
name = "tac-validate"
version = "0.2.0"
description = "Lint TAC aviation weather products (METAR/SPECI/TAF and related) with structured issues"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "msgspec>=0.19",
]

[project.scripts]
tac-validate = "tac_validate.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac_validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: longer local/CI smokes (clean-venv wheel installs)",
]

[tool.coverage.run]
branch = true
source = ["src/tac_validate"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
extend = "../../ruff.toml"
line-length = 120
