[project]
name = "tac-validate"
version = "2026.11.5.1"
description = "Lint Traditional Alphanumeric Code (TAC) aviation weather products and return structured issues"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "msgspec==0.21.1",
  "metar-shared==2026.11.5",
  "pyyaml==6.0.3",
]

[tool.uv.sources]
metar-shared = { workspace = true }

[project.scripts]
tac-validate = "tac_validate.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac_validate"]

# Override (required): package sources are formatted at line-length 120; root is 88.
[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120
