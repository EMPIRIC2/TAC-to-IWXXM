# R1 identity / order detectors for METAR/SPECI (ADR-046 / #1228 M2).
# CCCC + obs time are declarative; ODD_FIELD_ORDER remains a thin python residual.
schema_version: 1
id: metar-speci-r1-identity-order
stage: parse_gate
products:
  - METAR
  - SPECI
rules:
  - id: missing_cccc
    kind: require_search
    pattern: '\b(?!AUTO\b)[A-Z]{4}\b'
    on_fail:
      code: MISSING_CCCC
      location: station
      message_template: "{product} missing ICAO location (CCCC) - A3-2 #2"
      span: body
  - id: missing_obs_time
    kind: require_search
    pattern: '\b\d{6}Z\b'
    on_fail:
      code: MISSING_OBS_TIME
      location: time
      message_template: "{product} missing observation time ddhhmmZ - A3-2 #3"
      span: body
  - id: r1_field_order
    kind: python
    python: python:tac_validate.theme_checks:hatch_r1_order
