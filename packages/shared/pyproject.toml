[project]
name = "metar-shared"
version = "0.1.0"
description = "Shared constants and env helpers for METAR to IWXXM monorepo"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# ADR-027 — import generated iwxxm_xsd pydantic models (not validate hot path)
xsd = ["pydantic>=2.0", "xsdata-pydantic>=24.5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metar_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/metar_shared"]
# ADR-027 generated xsdata trees — not unit-tested line-by-line (T3.7a smoke covers regen)
omit = [
  "*/iwxxm_xsd/v*/**",
]

[tool.coverage.report]
fail_under = 98
show_missing = true
omit = [
  "*/iwxxm_xsd/v*/**",
]
