[project]
name = "metar-shared"
version = "2026.11.5"
description = "Shared constants and environment helpers for the TAC to IWXXM monorepo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# ADR-027 — import generated iwxxm_xsd pydantic models (not validate hot path)
xsd = ["pydantic==2.13.4", "xsdata-pydantic==24.5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metar_shared"]

# Override (required): when `make lint` passes `packages/shared`, Ruff uses this
# pyproject as project root so root extend-exclude paths do not apply. Keep
# ADR-027 generated xsdata trees out of lint. [Corpus: product §F11]
[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = [
  "src/metar_shared/iwxxm_xsd/v*",
]

# Override (required): Makefile uses --cov-config=packages/shared/pyproject.toml;
# omit generated trees that are not unit-tested line-by-line (T3.7a).
[tool.coverage.run]
branch = true
source = ["src/metar_shared"]
omit = [
  "*/iwxxm_xsd/v*/**",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
omit = [
  "*/iwxxm_xsd/v*/**",
]
