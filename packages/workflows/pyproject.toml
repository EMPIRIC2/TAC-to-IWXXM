[project]
name = "workflows"
version = "0.1.0"
description = "Execute meteorology workflow YAML with execute(message, workflow)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "tac2iwxxm==2026.11.5.1",
  "tac-validate==2026.11.5.1",
  "iwxxm-validate==2026.11.5.1",
  "pyyaml==6.0.3",
]

[tool.uv.sources]
tac2iwxxm = { workspace = true }
tac-validate = { workspace = true }
iwxxm-validate = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]

# Override (required): Makefile uses -m unit and --cov-config=this file;
# source_pkgs is needed so hatchling src layout yields non-zero coverage.
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests",
]

[tool.coverage.run]
branch = true
source_pkgs = ["workflows"]

[tool.coverage.report]
fail_under = 100
show_missing = true

# Override (required): package sources are formatted at line-length 120; root is 88.
[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120
