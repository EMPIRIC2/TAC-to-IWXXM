[project]
name = "workflows"
version = "0.1.0"
description = "MET workflow YAML executor — execute(message, workflow) (ADR-042)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "tac2iwxxm",
  "tac-validate",
  "iwxxm-validate",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests",
]

[tool.coverage.run]
branch = true
source_pkgs = ["workflows"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
extend = "../../ruff.toml"
line-length = 120
