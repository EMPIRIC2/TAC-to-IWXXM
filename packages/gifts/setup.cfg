[metadata]
name = gifts
description = IWXXM encoders for Annex3 TAC products
author = Mark Oberfield - NOAA/NWS/OSTI/MDL/WIAD
author_email = Mark.Oberfield@noaa.gov
maintainer = Mark Oberfield
version = 1.5.1
classifiers = Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Text Processing :: Markup :: XML
    License :: Public Domain

license_file = LICENSE.md

[options]
include_package_data = true
packages = find:
python_requires = >=3.9
zip_safe = false
install_requires = skyfield >=1.40,<2a0

[options.packages.find]
exclude = tests

[options.extras_require]
test =
    flake8>=3.7,<4a0
    pytest>=8.3
    pytest-cov>=2.7,<3a0

[aliases]
test = pytest

[tool:pytest]
addopts = --verbose

[flake8]
max-line-length = 150
extend-ignore = E302,E305,W291,W293,W391
per-file-ignores =
    tests/test_demo_module.py:E741
    tests/test_encoder_expansion.py:F841
    tests/test_gifts_coverage_improvements.py:E402
    tests/test_tpg_intensive.py:F841,E722
    tests/test_validation.py:E402
    tests/test_validation_comprehensive_coverage.py:E402,F841,E722
    tests/test_validation_edge_cases.py:E402
    tests/test_validation_final.py:E402
    tests/test_xml_utilities_comprehensive.py:E712
    tests/test_xml_utilities_expansion.py:F841
    tests/test_xmlutilities_comprehensive.py:F841
