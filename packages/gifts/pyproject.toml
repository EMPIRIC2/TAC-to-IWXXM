[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gifts"
description = "IWXXM encoders for Annex3 TAC products"
authors = [
    {name = "Mark Oberfield - NOAA/NWS/OSTI/MDL/WIAD", email = "Mark.Oberfield@noaa.gov"}
]
maintainers = [
    {name = "Mark Oberfield", email = "Mark.Oberfield@noaa.gov"}
]
version = "1.5.1"
requires-python = ">=3.12"
license = {text = "Public Domain"}
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: XML",
    "License :: Public Domain"
]

dependencies = [
    "skyfield>=1.40,<2a0",
    "lxml>=4.9.0",
    "watchdog>=3.0.0",
    "requests>=2.20.0"
]

[project.optional-dependencies]
test = [
    "flake8>=3.7,<4a0",
    "pytest>=8.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.23.0",
]

dev = [
    "flake8>=3.7,<4a0",
    "pytest>=8.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.12.0",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "validation: marks tests as validation tests",
    "demo: marks tests as demo tests",
]

[tool.coverage.run]
branch = true
source = ["gifts", "validation"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/demo/*",
    "*/__init__.py",
    "gifts/common/tpg.py",
    "gifts/vaaDecoder.py",
    "gifts/metarEncoder.py",
    "gifts/tcaDecoder.py",
    "gifts/swaDecoder.py",
    "gifts/common/xmlUtilities.py",
    "gifts/common/Common.py",
    "gifts/common/xmlConfig.py",
    "gifts/common/Encoder.py",
    "gifts/common/bulletin.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
    "if sys.version_info",
]
ignore_errors = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*/migrations/*", "*/site-packages/*"]

[tool.black]
line-length = 120
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[project.urls]
Homepage = "https://github.com/wmo-im/GIFTs"
Documentation = "https://github.com/wmo-im/GIFTs/wiki"
Repository = "https://github.com/wmo-im/GIFTs"
"Bug Tracker" = "https://github.com/wmo-im/GIFTs/issues"

[dependency-groups]
dev = [
    "flake8>=3.7,<4a0",
    "pytest>=8.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.12.0",
]
