# GIFTs package lint — migrated from setup.cfg [flake8] (T3.4, ADR-005).
# Scope matches legacy flake8 during migration (REQ-016); stricter rules deferred.

extend = "../../ruff.toml"

line-length = 150

[lint]
select = ["E", "F", "W"]
