"tests/test_validation_comprehensive_coverage.py" = ["E402", "F841", "E722"]
"tests/test_validation_edge_cases.py" = ["E402"]
"tests/test_validation_final.py" = ["E402"]
"tests/test_xml_utilities_comprehensive.py" = ["E712"]
"tests/test_xml_utilities_expansion.py" = ["F841"]
