services:
  db:
    image: postgres:16
    container_name: metar-iwxxm-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - metar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile
    container_name: metar-iwxxm-backend
    ports:
      - "${METAR_BACKEND_HOST_PORT:-18001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - METAR_CONFIG_ENV=${METAR_CONFIG_ENV:-local}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      # F31 Auth — password grant + JWKS-only verify (ADR-033 / env-contract)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-}
      # F16 LIVE / ADR-029 — empty allowlist ⇒ deny; local recipe from tech-spec.
      # Docker API + BYOC Compose DNS also needs byoc-* hosts and bridge CIDR
      # (private resolved IPs require overlapping CIDR — ADR-029 rebinding guard).
      - DISSEMINATION_EGRESS_ALLOWLIST=${DISSEMINATION_EGRESS_ALLOWLIST:-wis2box,127.0.0.1,127.0.0.0/8,localhost,byoc-postgres,byoc-mysql,byoc-sqlserver,172.16.0.0/12}
      - METAR_CORS_ORIGINS=${METAR_CORS_ORIGINS:-http://localhost:18000,http://127.0.0.1:18000}
      # Default to the bundled `db` service so `docker compose up` is self-contained.
      # Override by setting DATABASE_URL in `.env` (e.g. a Supabase pooler URL).
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}}
    volumes:
      # LIVE-004 — repo tmp shared into API (Colima host /tmp bind is unreliable).
      - ./tmp/f16-live:/tmp/f16-live
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    container_name: metar-iwxxm-frontend
    working_dir: /workspace/apps/frontend
    environment:
      - METAR_CONFIG_ENV=${METAR_CONFIG_ENV:-local}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
    ports:
      - "${METAR_FRONTEND_HOST_PORT:-18000}:8000"
    volumes:
      - ./apps/frontend:/workspace/apps/frontend
      - ./packages/shared:/workspace/packages/shared
      - ./config:/workspace/config:ro
      - ./scripts:/workspace/scripts:ro
      - /workspace/node_modules
      - /workspace/apps/frontend/node_modules
    command: >
      sh -c "METAR_CONFIG_ENV=$${METAR_CONFIG_ENV:-local}
      DEST_DIR=/workspace/apps/frontend/public sh /workspace/scripts/frontend/prepare-config.sh
      && pnpm exec vite --host 0.0.0.0 --port 8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

volumes:
  metar-db-data:

networks:
  metar-network:
    driver: bridge
