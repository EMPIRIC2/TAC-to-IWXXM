services:
  db:
    image: postgres:16
    container_name: metar-iwxxm-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - metar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile
    container_name: metar-iwxxm-backend
    ports:
      - "${METAR_BACKEND_HOST_PORT:-18001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - METAR_CONFIG_ENV=${METAR_CONFIG_ENV:-local}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      # F31 Auth — password grant + JWKS-only verify (ADR-033 / env-contract)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-}
      # F16 LIVE / ADR-029 — empty allowlist ⇒ deny; local recipe from tech-spec.
      # Docker API + BYOC Compose DNS also needs byoc-* hosts and bridge CIDR
      # (private resolved IPs require overlapping CIDR — ADR-029 rebinding guard).
      - DISSEMINATION_EGRESS_ALLOWLIST=${DISSEMINATION_EGRESS_ALLOWLIST:-wis2box,127.0.0.1,127.0.0.0/8,localhost,byoc-postgres,byoc-mysql,byoc-sqlserver,172.16.0.0/12}
      - METAR_CORS_ORIGINS=${METAR_CORS_ORIGINS:-http://localhost:18000,http://127.0.0.1:18000}
      # Default to the bundled `db` service so `docker compose up` is self-contained.
      # Override by setting DATABASE_URL in `.env` (e.g. a Supabase pooler URL).
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}}
    volumes:
      # LIVE-004 — repo tmp shared into API (Colima host /tmp bind is unreliable).
      - ./tmp/f16-live:/tmp/f16-live
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    container_name: metar-iwxxm-frontend
    working_dir: /workspace/apps/frontend
    environment:
      - METAR_CONFIG_ENV=${METAR_CONFIG_ENV:-local}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
    ports:
      - "${METAR_FRONTEND_HOST_PORT:-18000}:8000"
    volumes:
      - ./apps/frontend:/workspace/apps/frontend
      - ./packages/shared:/workspace/packages/shared
      - ./packages/live-map-geometry:/workspace/packages/live-map-geometry
      - ./config:/workspace/config:ro
      - ./scripts:/workspace/scripts:ro
      - /workspace/node_modules
      - /workspace/apps/frontend/node_modules
    command: >
      sh -c "METAR_CONFIG_ENV=$${METAR_CONFIG_ENV:-local}
      DEST_DIR=/workspace/apps/frontend/public sh /workspace/scripts/frontend/prepare-config.sh
      && pnpm exec vite --host 0.0.0.0 --port 8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  # Optional profiles. `docker compose up` does not start these.
  # wis2box: make compose-wis2box-up
  # mock-byoc: make compose-mock-byoc-up
  wis2box:
    profiles: ["wis2box"]
    build:
      context: ./packages/dissemination/docker/wis2box-harness
      dockerfile: Dockerfile
    image: metar-iwxxm-wis2box-harness:local
    container_name: metar-iwxxm-wis2box
    ports:
      - "${WIS2BOX_MQTT_HOST_PORT:-1883}:1883"
      - "${WIS2BOX_HTTP_HOST_PORT:-9080}:8080"
    environment:
      - WIS2BOX_HTTP_PORT=8080
      - WIS2BOX_DATASET_DIR=/var/lib/wis2box-harness/datasets
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://127.0.0.1:8080/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - metar-network
    restart: unless-stopped

  byoc-postgres:
    profiles: ["mock-byoc"]
    image: postgres:16
    container_name: metar-iwxxm-byoc-postgres
    environment:
      POSTGRES_USER: byoc
      POSTGRES_PASSWORD: byoc-mock-password-not-real
      POSTGRES_DB: byoc
    ports:
      - "${BYOC_POSTGRES_HOST_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byoc -d byoc"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 8s
    networks:
      - metar-network
    restart: unless-stopped

  byoc-mysql:
    profiles: ["mock-byoc"]
    image: mysql:8.4
    container_name: metar-iwxxm-byoc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: byoc-mock-root-not-real
      MYSQL_DATABASE: byoc
      MYSQL_USER: byoc
      MYSQL_PASSWORD: byoc-mock-password-not-real
    ports:
      - "${BYOC_MYSQL_HOST_PORT:-13306}:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-ubyoc",
          "-pbyoc-mock-password-not-real",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - metar-network
    restart: unless-stopped

  byoc-sqlserver:
    profiles: ["mock-byoc"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: metar-iwxxm-byoc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Byoc_Mock_Passw0rd!"
    ports:
      - "${BYOC_SQLSERVER_HOST_PORT:-11433}:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Byoc_Mock_Passw0rd!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Byoc_Mock_Passw0rd!' -Q 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - metar-network
    restart: unless-stopped

  byoc-mailhog:
    profiles: ["mock-byoc"]
    image: mailhog/mailhog:v1.0.1
    container_name: metar-iwxxm-byoc-mailhog
    ports:
      - "${BYOC_SMTP_HOST_PORT:-11025}:1025"
      - "${BYOC_MAILHOG_UI_HOST_PORT:-18025}:8025"
    networks:
      - metar-network
    restart: unless-stopped

  byoc-f19:
    profiles: ["mock-byoc"]
    build:
      context: ./packages/dissemination/docker/f19-harness
      dockerfile: Dockerfile
    image: metar-iwxxm-f19-harness:local
    container_name: metar-iwxxm-byoc-f19
    environment:
      F19_HARNESS_PORT: "9099"
    ports:
      - "${BYOC_F19_HOST_PORT:-19099}:9099"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - metar-network
    restart: unless-stopped

volumes:
  metar-db-data:

networks:
  metar-network:
    driver: bridge
