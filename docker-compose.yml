services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile
    container_name: metar-iwxxm-backend
    ports:
      - "${METAR_BACKEND_HOST_PORT:-18001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - METAR_CONFIG_ENV=${METAR_CONFIG_ENV:-local}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      - DATABASE_URL=${DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    container_name: metar-iwxxm-frontend
    working_dir: /workspace/apps/frontend
    environment:
      - METAR_CONFIG_ENV=${METAR_CONFIG_ENV:-local}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}
    ports:
      - "${METAR_FRONTEND_HOST_PORT:-18000}:8000"
    volumes:
      - ./apps/frontend:/workspace/apps/frontend
      - ./packages/shared:/workspace/packages/shared
      - ./config:/workspace/config:ro
      - ./scripts:/workspace/scripts:ro
      - /workspace/node_modules
      - /workspace/apps/frontend/node_modules
    command: >
      sh -c "METAR_CONFIG_ENV=$${METAR_CONFIG_ENV:-local}
      DEST_DIR=/workspace/apps/frontend/public bash /workspace/scripts/frontend/prepare-config.sh
      && pnpm run dev -- --host 0.0.0.0 --port 8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

networks:
  metar-network:
    driver: bridge
