services:
  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: metar-iwxxm-auth
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - FRONTEND_BASE_URL=http://localhost:8000
    volumes:
      - auth-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: metar-iwxxm-backend
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        - VITE_APP_URL=${VITE_APP_URL:-http://localhost:8000}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8001}
        - VITE_AUTH_URL=${VITE_AUTH_URL:-http://localhost:8002}
    container_name: metar-iwxxm-frontend
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

networks:
  metar-network:
    driver: bridge

volumes:
  # Optional: persist any data if needed in future
  auth-data:
  backend-data:
  frontend-data:
