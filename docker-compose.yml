services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/docker/Dockerfile
    container_name: metar-iwxxm-backend
    ports:
      - "${METAR_BACKEND_HOST_PORT:-18001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:18000}
      - METAR_CORS_ORIGINS=${METAR_CORS_ORIGINS:-http://localhost:18000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # For development mode (no auth requirement). Set to "false" for production with Supabase.
      - DISABLE_AUTH=${DISABLE_AUTH:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: dev
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        - VITE_APP_URL=${VITE_APP_URL:-http://localhost:18000}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:18001}
    container_name: metar-iwxxm-frontend
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:18000}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:18001}
    ports:
      - "${METAR_FRONTEND_HOST_PORT:-18000}:8000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - metar-network
    restart: unless-stopped

networks:
  metar-network:
    driver: bridge
