# Render Blueprint — post-monorepo two-service topology (ADR-002, ADR-006)
# API (Docker) + static frontend (CDN). Auth merged into API; no observability pservs.
services:
  - type: web
    name: metar-to-iwxxm-api
    runtime: docker
    dockerfilePath: apps/backend/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    plan: starter
    envVars:
      - key: RELOAD
        value: "false"
      - key: DISABLE_AUTH
        value: "false"
      - key: FRONTEND_URL
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: METAR_CORS_ORIGINS
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: ADMIN_USER_ID
        value: "dev-user-12345"
      - key: ADMIN_EMAIL
        value: "dev@example.com"
      - key: SCHEMATRON_USE_DOCKER
        value: "false"
      - key: WMO_ONLINE_VALIDATION
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ENABLE_STATISTICS
        value: "true"
      - key: ENABLE_WEBHOOKS
        value: "false"
      # Set in Render dashboard (sync:false preserves live values):
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # REQUIRED in Render dashboard:
      # DATABASE_URL

  - type: web
    name: metar-to-iwxxm-frontend-v4-web
    runtime: static
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm --filter @metar/frontend run build
    staticPublishPath: apps/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://metar-to-iwxxm-api.onrender.com
      - key: VITE_APP_URL
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      # Set in Render dashboard (sync:false preserves live values):
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
        sync: false
