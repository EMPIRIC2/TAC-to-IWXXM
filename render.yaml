services:
  - type: web
    name: metar-to-iwxxm-api
    runtime: image
    image:
      url: ghcr.io/joseph-c-mcguire/metar-to-iwxxm/backend:main-latest
    healthCheckPath: /health
    numInstances: 1
    plan: starter
    envVars:
      - key: RELOAD
        value: "false"
      - key: DISABLE_AUTH
        value: "true"
      - key: AUTH_SERVICE_URL
        value: https://metar-to-iwxxm-auth-v2.onrender.com
      - key: ADMIN_USER_ID
        value: "dev-user-12345"
      - key: ADMIN_EMAIL
        value: "dev@example.com"
      - key: SCHEMATRON_USE_DOCKER
        value: "false"
      - key: WMO_ONLINE_VALIDATION
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ALLOWED_ORIGINS
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: ENABLE_STATISTICS
        value: "true"
      - key: ENABLE_WEBHOOKS
        value: "false"
      # REQUIRED in Render dashboard:
      # DATABASE_URL

  - type: web
    name: metar-to-iwxxm-auth-v2
    runtime: image
    image:
      url: ghcr.io/joseph-c-mcguire/metar-to-iwxxm/auth:main-latest
    healthCheckPath: /health
    numInstances: 1
    plan: starter
    envVars:
      - key: LOG_LEVEL
        value: "INFO"
      - key: FRONTEND_BASE_URL
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: CORS_ORIGINS
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      # REQUIRED in Render dashboard:
      # SUPABASE_URL
      # SUPABASE_ANON_KEY

  - type: web
    name: metar-to-iwxxm-frontend-v4-web
    runtime: image
    image:
      url: ghcr.io/joseph-c-mcguire/metar-to-iwxxm/frontend:main-latest
    healthCheckPath: /
    numInstances: 1
    plan: starter
    envVars:
      - key: VITE_APP_URL
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: VITE_BACKEND_URL
        value: https://metar-to-iwxxm-api.onrender.com
      - key: VITE_AUTH_SERVICE_URL
        value: https://metar-to-iwxxm-auth-v2.onrender.com
      - key: BACKEND_UPSTREAM
        value: https://metar-to-iwxxm-api.onrender.com
      - key: AUTH_UPSTREAM
        value: https://metar-to-iwxxm-auth-v2.onrender.com
      # REQUIRED in Render dashboard:
      # VITE_SUPABASE_URL
      # VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
