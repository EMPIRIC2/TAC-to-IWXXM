# Render Blueprint — post-monorepo two-service topology (ADR-002, ADR-006, ADR-010)
# API (Docker) + static frontend (CDN). Auth merged into API.
services:
  - type: web
    name: metar-to-iwxxm-api
    runtime: docker
    dockerfilePath: apps/backend/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    plan: starter
    envVars:
      - key: RELOAD
        value: "false"
      - key: METAR_CONFIG_ENV
        value: prod
      - key: METAR_CORS_ORIGINS
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: SCHEMATRON_USE_DOCKER
        value: "false"
      - key: WMO_ONLINE_VALIDATION
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ENABLE_STATISTICS
        value: "true"
      - key: ENABLE_WEBHOOKS
        value: "false"
      # Secrets — set in Render dashboard (sync:false preserves live values):
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: metar-to-iwxxm-worker
    runtime: docker
    dockerfilePath: apps/worker/docker/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: LOG_LEVEL
        value: "INFO"
      - key: INGEST_POLL_INTERVAL_SEC
        value: "30"
      - key: INGEST_PROFILE
        value: annex3
      - key: IWXXM_VERSION
        value: "2025-2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INGEST_POLLER_URL
        sync: false

  - type: web
    name: metar-to-iwxxm-frontend-v4-web
    runtime: static
    buildCommand: >-
      corepack enable pnpm && pnpm install --frozen-lockfile &&
      METAR_CONFIG_ENV=prod SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
      bash scripts/frontend/prepare-config.sh &&
      pnpm --filter @metar/frontend run build
    staticPublishPath: apps/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: METAR_CONFIG_ENV
        value: prod
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
