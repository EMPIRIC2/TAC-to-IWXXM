services:
  - type: web
    name: metar-to-iwxxm-api
    runtime: python
    repo: https://github.com/joseph-c-mcguire/metar-to-IWXXM
    branch: main
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip && \
      pip install . && \
      pip install ../GIFTs
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port ${PORT}
    healthCheckPath: /health
    autoDeployTrigger: commit
    numInstances: 1
    plan: starter
    envVars:
      - key: RELOAD
        value: "false"
      - key: DISABLE_AUTH
        value: "true"
      - key: AUTH_SERVICE_URL
        value: https://metar-to-iwxxm-auth.onrender.com
      - key: ADMIN_USER_ID
        value: "dev-user-12345"
      - key: ADMIN_EMAIL
        value: "dev@example.com"
      - key: SCHEMATRON_USE_DOCKER
        value: "false"
      - key: WMO_ONLINE_VALIDATION
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ALLOWED_ORIGINS
        value: https://metar-to-iwxxm-frontend.onrender.com
      - key: ENABLE_STATISTICS
        value: "true"
      - key: ENABLE_WEBHOOKS
        value: "false"
      # REQUIRED in Render dashboard:
      # DATABASE_URL

  - type: web
    name: metar-to-iwxxm-auth
    runtime: python
    repo: https://github.com/joseph-c-mcguire/metar-to-IWXXM
    branch: main
    rootDir: auth
    buildCommand: |
      pip install --upgrade pip && \
      pip install .
    startCommand: uvicorn auth.__main__:app --host 0.0.0.0 --port ${PORT}
    healthCheckPath: /health
    autoDeployTrigger: commit
    numInstances: 1
    plan: starter
    envVars:
      - key: LOG_LEVEL
        value: "INFO"
      - key: FRONTEND_BASE_URL
        value: https://metar-to-iwxxm-frontend.onrender.com
      - key: CORS_ORIGINS
        value: https://metar-to-iwxxm-frontend.onrender.com
      # REQUIRED in Render dashboard:
      # SUPABASE_URL
      # SUPABASE_ANON_KEY

  - type: static_site
    name: metar-to-iwxxm-frontend
    repo: https://github.com/joseph-c-mcguire/metar-to-IWXXM
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_APP_URL
        value: https://metar-to-iwxxm-frontend.onrender.com
      - key: VITE_BACKEND_URL
        value: https://metar-to-iwxxm-api.onrender.com
      - key: VITE_AUTH_SERVICE_URL
        value: https://metar-to-iwxxm-auth.onrender.com
      # REQUIRED in Render dashboard:
      # VITE_SUPABASE_URL
      # VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
