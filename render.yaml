services:
  - type: web
    name: metar-to-iwxxm-api
    runtime: image
    image:
      url: ghcr.io/joseph-c-mcguire/metar-to-iwxxm/backend:main-latest
    healthCheckPath: /health
    numInstances: 1
    plan: starter
    envVars:
      - key: RELOAD
        value: "false"
      - key: DISABLE_AUTH
        value: "true"
      - key: AUTH_SERVICE_URL
        value: https://metar-to-iwxxm-auth-v2.onrender.com
      - key: ADMIN_USER_ID
        value: "dev-user-12345"
      - key: ADMIN_EMAIL
        value: "dev@example.com"
      - key: SCHEMATRON_USE_DOCKER
        value: "false"
      - key: WMO_ONLINE_VALIDATION
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ALLOWED_ORIGINS
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: ENABLE_STATISTICS
        value: "true"
      - key: ENABLE_WEBHOOKS
        value: "false"
      - key: OBSERVABILITY_ENV
        value: "render-live"
      - key: LOKI_PUSH_URL
        value: http://metar-to-iwxxm-loki:3100/loki/api/v1/push
      - key: LOKI_USERNAME
        sync: false
      - key: LOKI_PASSWORD
        sync: false
      # REQUIRED in Render dashboard:
      # DATABASE_URL

  - type: web
    name: metar-to-iwxxm-auth-v2
    runtime: image
    image:
      url: ghcr.io/joseph-c-mcguire/metar-to-iwxxm/auth:main-latest
    healthCheckPath: /health
    numInstances: 1
    plan: starter
    envVars:
      - key: LOG_LEVEL
        value: "INFO"
      - key: FRONTEND_BASE_URL
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: CORS_ORIGINS
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: OBSERVABILITY_ENV
        value: "render-live"
      - key: LOKI_PUSH_URL
        value: http://metar-to-iwxxm-loki:3100/loki/api/v1/push
      - key: LOKI_USERNAME
        sync: false
      - key: LOKI_PASSWORD
        sync: false
      # REQUIRED in Render dashboard:
      # SUPABASE_URL
      # SUPABASE_ANON_KEY

  - type: web
    name: metar-to-iwxxm-frontend-v4-web
    runtime: image
    image:
      url: ghcr.io/joseph-c-mcguire/metar-to-iwxxm/frontend:main-latest
    healthCheckPath: /
    numInstances: 1
    plan: starter
    envVars:
      - key: VITE_APP_URL
        value: https://metar-to-iwxxm-frontend-v4-web.onrender.com
      - key: VITE_BACKEND_URL
        value: https://metar-to-iwxxm-api.onrender.com
      - key: VITE_AUTH_SERVICE_URL
        value: https://metar-to-iwxxm-auth-v2.onrender.com
      - key: BACKEND_UPSTREAM
        value: http://metar-to-iwxxm-api:10000
      - key: AUTH_UPSTREAM
        value: http://metar-to-iwxxm-auth-v2:8000
      # Set these in the Render dashboard; sync:false prevents blueprint_sync
      # from overwriting the correct live values with placeholder strings.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
        sync: false

  - type: pserv
    name: metar-to-iwxxm-loki
    runtime: image
    image:
      url: grafana/loki:3.1.1
    plan: starter
    disk:
      name: loki-data
      mountPath: /loki
      sizeGB: 10
    envVars:
      - key: OBSERVABILITY_ENV
        value: "render-live"
    startCommand: |
      /bin/sh -c '
      cat <<EOF >/tmp/loki-config.yaml
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      compactor:
        working_directory: /loki/compactor
      limits_config:
        retention_period: 168h
      EOF
      /usr/bin/loki -config.file=/tmp/loki-config.yaml
      '

  - type: pserv
    name: metar-to-iwxxm-prometheus
    runtime: image
    image:
      url: prom/prometheus:v2.55.1
    plan: starter
    disk:
      name: prometheus-data
      mountPath: /prometheus
      sizeGB: 10
    startCommand: |
      /bin/sh -c '
      cat <<EOF >/tmp/prometheus.yml
      global:
        scrape_interval: 30s
        evaluation_interval: 30s
      scrape_configs:
        - job_name: metar-api
          metrics_path: /metrics
          static_configs:
            - targets: ["metar-to-iwxxm-api:10000"]
        - job_name: metar-auth
          metrics_path: /metrics
          static_configs:
            - targets: ["metar-to-iwxxm-auth-v2:8000"]
        - job_name: prometheus
          metrics_path: /metrics
          static_configs:
            - targets: ["localhost:9090"]
      EOF
      /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.listen-address=0.0.0.0:9090
      '

  - type: web
    name: metar-to-iwxxm-grafana
    runtime: image
    image:
      url: grafana/grafana:11.2.0
    healthCheckPath: /api/health
    numInstances: 1
    plan: starter
    disk:
      name: grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 10
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        sync: false
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "false"
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_SERVER_HTTP_PORT
        value: "10000"
    startCommand: |
      /bin/sh -c '
      mkdir -p /tmp/grafana/provisioning/datasources
      cat <<EOF >/tmp/grafana/provisioning/datasources/datasources.yml
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://metar-to-iwxxm-prometheus:9090
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://metar-to-iwxxm-loki:3100
      EOF
      export GF_PATHS_PROVISIONING=/tmp/grafana/provisioning
      /run.sh
      '
