apiVersion: apps/v1
kind: Deployment
metadata:
  name: metar-frontend
  labels:
    app.kubernetes.io/name: metar-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metar-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metar-frontend
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          # T7.1: F31 UI required for provisional Playwright. Until frontend:ev031-doks
          # is pushed to GHCR, operators hot-copy dist into the running pod (see T7.1 report).
          image: ghcr.io/empiric2/tac-to-iwxxm/frontend:main-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            # Optional runtime rewrite helper in apps/frontend/Dockerfile production stage.
            - name: VITE_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metar-api-secrets
                  key: SUPABASE_URL
          volumeMounts:
            # Provisional DOKS /config.json (D-S038-t63-waive) — points FE at placeholder API host.
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: runtime-config
          configMap:
            name: metar-frontend-runtime-config
