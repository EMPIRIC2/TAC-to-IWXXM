apiVersion: apps/v1
kind: Deployment
metadata:
  name: metar-api
  labels:
    app.kubernetes.io/name: metar-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metar-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metar-api
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/empiric2/tac-to-iwxxm/backend:main-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: metar-api-config
            - secretRef:
                name: metar-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
