apiVersion: v1
kind: ConfigMap
metadata:
  name: metar-api-config
  labels:
    app.kubernetes.io/name: metar-api
    app.kubernetes.io/component: api
data:
  METAR_CONFIG_ENV: "prod"
  RELOAD: "false"
  SCHEMATRON_USE_DOCKER: "false"
  WMO_ONLINE_VALIDATION: "true"
  LOG_LEVEL: "INFO"
  ENABLE_STATISTICS: "true"
  ENABLE_WEBHOOKS: "false"
  # CORS: DOKS FE hosts + LB IP. Suspended Render frontend origin removed (BUG-2026-08-07).
  METAR_CORS_ORIGINS: "https://app.tac-to-iwxxm.com,http://app.tac-to-iwxxm.com,http://168.144.12.70"
  PORT: "8000"
