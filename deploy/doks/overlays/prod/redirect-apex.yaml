# Tiny nginx that 301s to the canonical app host with path/query.
# ingress-nginx v1.12+ rejects $request_uri on permanent-redirect (CVE-2023-5044
# annotation validation) and snippets are disabled on this cluster (D-S067-948-redirect=1a).
apiVersion: v1
kind: ConfigMap
metadata:
  name: metar-apex-redirect
  labels:
    app.kubernetes.io/name: metar-apex-redirect
    app.kubernetes.io/component: redirect
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }
      location / {
        return 301 https://app.tac-to-iwxxm.com$request_uri;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metar-apex-redirect
  labels:
    app.kubernetes.io/name: metar-apex-redirect
    app.kubernetes.io/component: redirect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metar-apex-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metar-apex-redirect
        app.kubernetes.io/component: redirect
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: metar-apex-redirect
---
apiVersion: v1
kind: Service
metadata:
  name: metar-apex-redirect
  labels:
    app.kubernetes.io/name: metar-apex-redirect
    app.kubernetes.io/component: redirect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metar-apex-redirect
  ports:
    - name: http
      port: 80
      targetPort: http
