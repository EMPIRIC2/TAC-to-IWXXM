apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metar-frontend-apex
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    # Sibling Ingress only — do NOT put permanent-redirect on metar-frontend (app host).
    # Requires DNS for these hosts to point at the prod LB (see deploy.md §Apex).
    nginx.ingress.kubernetes.io/permanent-redirect: https://app.tac-to-iwxxm.com$request_uri
spec:
  ingressClassName: nginx
  rules:
    - host: tac-to-iwxxm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metar-frontend
                port:
                  name: http
    - host: www.tac-to-iwxxm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metar-frontend
                port:
                  name: http
  tls:
    - hosts:
        - tac-to-iwxxm.com
        - www.tac-to-iwxxm.com
      secretName: metar-frontend-apex-tls
