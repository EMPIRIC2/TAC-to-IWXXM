apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metar-frontend-staging-short
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    # Sibling Ingress only — do NOT put permanent-redirect on metar-frontend (app.staging).
    # DNS: staging.tac-to-iwxxm.com must A → staging LB 143.244.202.13 (not the prod * wildcard).
    nginx.ingress.kubernetes.io/permanent-redirect: https://app.staging.tac-to-iwxxm.com$request_uri
spec:
  ingressClassName: nginx
  rules:
    - host: staging.tac-to-iwxxm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metar-frontend
                port:
                  name: http
  tls:
    - hosts:
        - staging.tac-to-iwxxm.com
      secretName: metar-frontend-staging-short-tls
