# Local gates mirroring .github/workflows/ci-cd.yml validate job
# - default (pre-commit): fast checks ≈ make validate-fast pieces
# - husky pre-push: make validate-ci + make ci-prepush (long unit/matrix)
# Install: make install-hooks  (husky + pre-commit)
#
# pre-commit 4.x default_stages includes every hook type; pin to pre-commit so
# omitted stages do not also fire on push. Long suites live in .husky/pre-push.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        args:
          - "--config=.gitleaks.toml"
          - "--redact"

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check apps packages tests
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        # Keep paths in sync with Makefile PY_LINT
        entry: uv run ruff check --force-exclude apps/backend/src apps/backend/tests packages/auth/src packages/shared packages/shared/tests packages/tac2iwxxm/src packages/tac2iwxxm/tests packages/iwxxm-validate/src packages/iwxxm-validate/tests packages/tac-validate/src packages/tac-validate/tests packages/dissemination/src packages/dissemination/tests tests
        language: system
        pass_filenames: false
        always_run: true
      - id: prettier-check
        name: prettier check
        entry: pnpm run format:check
        language: system
        pass_filenames: false
        always_run: true
      - id: eslint
        name: eslint
        entry: pnpm run lint:js
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck-js
        name: TypeScript typecheck
        entry: pnpm run typecheck:js
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: basedpyright (Python)
        entry: bash -c 'uv run basedpyright packages/shared/src && uv run basedpyright packages/auth/src && cd apps/backend && uv run basedpyright'
        language: system
        pass_filenames: false
        always_run: true
      - id: catalog-check
        name: ISSUE_CATALOG drift check
        entry: make catalog-check
        language: system
        pass_filenames: false
        always_run: true
      - id: issue-registry-guard
        name: tac-validate issue registry severity literals (error)
        entry: make issue-registry-guard
        language: system
        pass_filenames: false
        always_run: true
      - id: render-deploy-hook-guard
        name: Render deploy hook fallback (BUG-2026-08-03)
        entry: uv run pytest tests/bugs/test_bug_2026_08_03_render_deploy_hook_500.py -q
        language: system
        pass_filenames: false
        always_run: true
        files: ^(scripts/deploy/trigger_render_image_deploy\.py|\.github/workflows/ci-cd\.yml|tests/bugs/test_bug_2026_08_03_render_deploy_hook_500\.py)$
      - id: render-deploy-no-bare-curl-imgurl
        name: forbid brittle curl imgURL in ci-cd.yml
        entry: bash scripts/deploy/check_no_bare_curl_imgurl.sh
        language: system
        pass_filenames: false
        always_run: true
        files: ^(\.github/workflows/ci-cd\.yml|scripts/deploy/check_no_bare_curl_imgurl\.sh)$
      # EV-032 / E32-T7 — path-filtered (no always_run): A6-2 equality + catalog canary
      - id: ev032-a6-2-tc-canary
        name: EV-032 A6-2-TC ADR-032 + catalog canary (#835)
        entry: bash scripts/ci/run_ev032_a6_2_tc_canary.sh
        language: system
        pass_filenames: false
        files: ^(packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products\.py|packages/tac2iwxxm/src/tac2iwxxm/convert\.py|packages/tac2iwxxm/tests/test_tc_ev032_00[23]_.*\.py|packages/tac2iwxxm/tests/fixtures/annex3_golden/sigmet_a6_2_tc\.tac|packages/shared/src/metar_shared/xml_canonical\.py|apps/frontend/src/fixtures/examples/examplesCatalog\.ts|apps/frontend/src/fixtures/examples/FIXTURE_GAPS\.md|scripts/ci/run_ev032_a6_2_tc_canary\.sh)$
      # EV-032 / E32-T7 / T2.8 — path-filtered VONA ADR-032 + product=vona canary
      - id: ev032-vona-canary
        name: EV-032 VONA ADR-032 + product=vona canary (#741)
        entry: bash scripts/ci/run_ev032_vona_canary.sh
        language: system
        pass_filenames: false
        files: ^(packages/tac2iwxxm/src/tac2iwxxm/profiles/annex3_products\.py|packages/tac2iwxxm/src/tac2iwxxm/products/vona\.py|packages/tac2iwxxm/src/tac2iwxxm/convert\.py|packages/tac2iwxxm/tests/test_tc_f32_004_vona_validate_golden\.py|packages/tac2iwxxm/tests/fixtures/annex3_golden/vona_a7_1\.(tac|golden\.xml)|packages/tac2iwxxm/tests/fixtures/annex3_golden/manifest\.json|apps/backend/src/api\.py|apps/backend/tests/unit/test_tc_f32_vona_product_enum\.py|apps/frontend/src/fixtures/examples/examplesCatalog\.ts|apps/frontend/src/fixtures/examples/bodies/vona_a7_1\.tac|scripts/ci/run_ev032_vona_canary\.sh|scripts/ci/run_vona_quality\.sh)$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        files: ^\.github/
        args: [-c, .yamllint.yml]
