      ev076_slice: [SIGMET]
      ev074_validate_first: [VAA]
      ev074_validate_first_note: "VAA validate-first via Montreal VAAC TAC (D-EV074-vaa-waiver-tac); datamart vaa/ absent; exchange emit deferred; SIGMET emit EV-076 / #1061"
      vaac_tac_harvest_script: scripts/iwxxm/harvest_ca_eccc_vaac_tac.py
      collect_envelope:
        issue: "#1032"
        status: implemented
        ev_cycle: EV-073
      ops_corpus:
        issue: "#1036"
        status: implemented
        ev_cycle: EV-072
        pin_date: "2026-08-24"
        harvest_script: scripts/iwxxm/harvest_ca_eccc_ops.py
