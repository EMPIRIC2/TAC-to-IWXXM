  - id: CA_ECCC
    kind: semantic
    priority: P1
    status: implemented
    emit_key: ca_eccc
    implementation:
      issue: "#916"
      package: packages/tac2iwxxm
      module: profiles/ca_eccc.py
      validate_profile: ca_eccc
    products: [METAR, SPECI, TAF, AIRMET]
    # MANOBS surface reports: METAR/SPECI are ICAO TAC leads; LWIS/SAWR are Canadian-only
    # substitution-group roots in metar-speci-ca.xsd (not separate API product enums).
    metar_family_variants:
      - tac_lead: METAR
        api_product: METAR
        iwxxm_root: "iwxxm:METAR"
        rule_id_prefix: CA.METAR
      - tac_lead: SPECI
        api_product: SPECI
        iwxxm_root: "iwxxm:SPECI"
        rule_id_prefix: CA.SPECI
      - tac_lead: LWIS
        api_product: METAR
        iwxxm_root: "iwxxm-ca:LWIS"
        rule_id: CA.METAR.LWIS
        manobs: "MANOBS 8 Chap 11.3; TC AIM MET 8.5.2"
        notes: Limited Weather Information System — minimal obs (wind/temp/dew/altimeter)
      - tac_lead: SAWR
        api_product: METAR
        iwxxm_root: "iwxxm-ca:SAWR"
        rule_id: CA.METAR.SAWR
        notes: Surface Aviation Weather Report — full aerodrome obs + CA Addendum
    metar_speci_ca_addendum:
      - element: observingSystemType
        rule_ids: [CA.METAR.AUTO, CA.METAR.LWIS, CA.METAR.SAWR]
      - element: densityAltitude
        tac_remark: "DENSITY ALT ####FT"
      - element: icing
        tac_remark: "ICE LGT|TRC|MOD|SEV|HVY"
        rule_id: CA.METAR.RMK.ICING
      - element: processedQuantity
        tac_remark: "P/6/7 precip totals (shared IR with iwxxm_us)"
      - element: seaLevelPressure
        rule_id: CA.METAR.RMK.SLP_T
      - element: pressureChangeIndicator
        rule_ids: [CA.METAR.RMK.PRESFR, CA.METAR.RMK.PRESRR]
    vendor_pins:
      iwxxm-ca: vendor/manifest.json → iwxxm-ca 3.0
      iwxxm-core: vendor/schemas/iwxxm/3.0.0 (MSC operational line)
    sources:
      - url: https://www.canada.ca/en/environment-climate-change/services/weather-manuals-documentation/manobs-surface-observations.html
        label: MANOBS — Surface Weather Observations
        access: public
        proves: Canadian METAR/SPECI observing and coding
      - url: https://www.canada.ca/en/environment-climate-change/services/weather-manuals-documentation/manair-standards-procedures-aviation-weather-forecasts-8th-ed.html
        label: MANAIR 8th Ed. — Aviation Weather Forecasts
        access: public
        proves: Canadian TAF/AIRMET standards
      - url: https://dd.weather.gc.ca/today/aviation/iwxxm/schema/
        label: MSC IWXXM-CA XSD tree
        access: public
        proves: iwxxm-ca.xsd, common-ca.xsd, taf-ca.xsd, airmet-ca.xsd
      - url: https://eccc-msc.github.io/open-data/msc-data/aviation/iwxxm/readme_aviation-iwxxm-datamart_en/
        label: MSC aviation IWXXM datamart readme (EN)
        access: public
        proves: Operational IWXXM 3.0.0 + CA extensions + products
      - url: https://dd.weather.gc.ca/today/aviation/iwxxm/code-ca/
        label: MSC IWXXM code-ca vocabularies
        access: public
        proves: Canadian AIRMET/TAF/METAR controlled vocabularies
      - url: https://dd.weather.gc.ca/today/aviation/iwxxm/doc/
        label: MSC IWXXM implementation documentation
        access: public
        proves: Canadian IWXXM implementation detail
    mining_notes:
      - docs/domain/mining/manobs-manair-ca-mining-notes.md
      - docs/domain/mining/eccc-iwxxm-ca-mining-notes.md
    stub: semantic/CA_ECCC.md
    gaps:
      - Extended Canadian-only remark flags (CONTRAILS/AURORA) in structured Addendum
      - AerodromeVariableRVR / ObservedLightning (P2 / #1039)
      - Layered ca_eccc validation stack — EV-068 / #1035 (+ #1027 bundle wire) **done**
      - code-ca vocabulary membership stage — #1033 **done (EV-069)**
      - SIGMET national overlay — out of #916 scope
    validation_stages:
      - id: wellformed
        label: Well-formed XML
      - id: wmo_xsd
        label: WMO IWXXM 3.0.0 schema
      - id: wmo_schematron
        label: WMO IWXXM 3.0.0 rules
      - id: ca_xsd
        label: Canadian extension schema
        product_xsd:
          METAR: metar-speci-ca.xsd
          SPECI: metar-speci-ca.xsd
          TAF: taf-ca.xsd
          AIRMET: airmet-ca.xsd
      - id: code_ca
        label: Canadian code lists
        issue: "#1033"
      - id: exchange
        label: Exchange packaging checks
        optional: true
        issue: "#1032"
    exchange_output:
      issue: "#1032"
      status: implemented
      ev_cycle: EV-071
      iwxxm_version_pin: "3.0.0"
      file_naming_pattern: "A_{TTAAiiCCCCYYGGggBBB}_C_{CCC}_{YYYYMMddhhmmss}.xml"
      distribution_path_template: "https://dd.meteo.gc.ca/today/aviation/iwxxm/{product}/{issuer_code}/{HH}"
      wmo_header_templates:
        METAR: "A_LACN"
        SPECI: "A_LPCN"
        TAF: "A_LTCN"
        AIRMET: "A_LWCN"
      ev071_slice: METAR
      translation_metadata:
        issue: "#1040"
        required_when_profile: true
        config_keys:
