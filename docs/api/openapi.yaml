openapi: 3.1.0
info:
  title: METAR to IWXXM Backend API
  description: Convert TAC messages to IWXXM XML and validate the result.
  version: 0.1.0
paths:
  /api/v1/validation/validate:
    post:
      tags:
        - Validation
        - Validation
      summary: Validate METAR TAC or IWXXM XML content
      description: Validate one METAR TAC or IWXXM XML document through the selected layers.
      operationId: validate_content_api_v1_validation_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRequest"
        required: true
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregatedValidationResult"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/validation/validate-multi:
    post:
      tags:
        - Validation
        - Validation
      summary: Validate a batch of TAC or IWXXM inputs
      description: "Validate up to 100 TAC or IWXXM documents in one request.\n\nEach document is checked on its own."
      operationId: validate_multiple_api_v1_validation_validate_multi_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchValidationRequest"
        required: true
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchValidationResponse"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/validation/layers:
    get:
      tags:
        - Validation
        - Validation
      summary: List validation layers
      description: "List the validation layers.\n\nA blocking layer stops later layers when it fails."
      operationId: get_validation_layers_api_v1_validation_layers_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationLayersResponse"
  /api/v1/eval/jobs:
    post:
      tags:
        - Evaluation
        - Evaluation
      summary: Create an evaluation job
      description: Create a new evaluation job.
      operationId: create_evaluation_job_api_v1_eval_jobs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationJobResponse"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - Evaluation
        - Evaluation
      summary: List evaluation jobs
      description: List all evaluation jobs for the current user.
      operationId: list_user_jobs_api_v1_eval_jobs_get
      parameters:
        -
                    name: page
                    in: query
                    required: false
                    schema:
                      type: integer
                      minimum: 1
                      default: 1
                      title: Page
        -
                    name: per_page
                    in: query
                    required: false
                    schema:
                      type: integer
                      maximum: 100
                      minimum: 1
                      default: 20
                      title: Per Page
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/eval/jobs/{job_id}:
    get:
      tags:
        - Evaluation
        - Evaluation
      summary: Evaluation job status
      description: Get the status of an evaluation job.
      operationId: get_job_status_api_v1_eval_jobs__job_id__get
      parameters:
        -
                    name: job_id
                    in: path
                    required: true
                    schema:
                      type: string
                      title: Job Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationJobStatus"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/eval/jobs/{job_id}/results:
    get:
      tags:
        - Evaluation
        - Evaluation
      summary: Evaluation job results
      description: Get evaluation results for a job (paginated).
      operationId: get_job_results_api_v1_eval_jobs__job_id__results_get
      parameters:
        -
                    name: job_id
                    in: path
                    required: true
                    schema:
                      type: string
                      title: Job Id
        -
                    name: page
                    in: query
                    required: false
                    schema:
                      type: integer
                      minimum: 1
                      default: 1
                      title: Page
        -
                    name: per_page
                    in: query
                    required: false
                    schema:
                      type: integer
                      maximum: 100
                      minimum: 1
                      default: 50
                      title: Per Page
        -
                    name: status_filter
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          $ref: "#/components/schemas/ComparisonStatus"
                        -
                                          type: null
                      title: Status Filter
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResultsResponse"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/work-sessions:
    get:
      tags:
        - Work Sessions
      summary: List Work Sessions
      description: List work sessions for the authenticated user with optional filters.
      operationId: list_work_sessions_api_v1_work_sessions_get
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: status
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          $ref: "#/components/schemas/WorkSessionStatus"
                        -
                                          type: null
                      title: Status
        -
                    name: product
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          type: string
                        -
                                          type: null
                      description: "Comma-separated product filter (e.g. metar,speci for My METARs)"
                      title: Product
                    description: "Comma-separated product filter (e.g. metar,speci for My METARs)"
        -
                    name: from
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          type: string
                                          format: date-time
                        -
                                          type: null
                      title: From
        -
                    name: to
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          type: string
                                          format: date-time
                        -
                                          type: null
                      title: To
        -
                    name: include_deleted
                    in: query
                    required: false
                    schema:
                      type: boolean
                      default: false
                      title: Include Deleted
        -
                    name: page
                    in: query
                    required: false
                    schema:
                      type: integer
                      minimum: 1
                      default: 1
                      title: Page
        -
                    name: limit
                    in: query
                    required: false
                    schema:
                      type: integer
                      maximum: 100
                      minimum: 1
                      default: 20
                      title: Limit
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionListResponse"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    post:
      tags:
        - Work Sessions
      summary: Create Work Session
      description: Create a new work session owned by the authenticated user.
      operationId: create_work_session_api_v1_work_sessions_post
      security:
        -
                    HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionCreate"
      responses:
        201:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSession"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/work-sessions/{session_id}:
    get:
      tags:
        - Work Sessions
      summary: Get Work Session
      description: Return a single work session by id.
      operationId: get_work_session_api_v1_work_sessions__session_id__get
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: session_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Session Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSession"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Work Sessions
      summary: Update Work Session
      description: Update mutable fields on an existing work session.
      operationId: update_work_session_api_v1_work_sessions__session_id__patch
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: session_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionUpdate"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSession"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Work Sessions
      summary: Delete Work Session
      description: "Soft-delete a work session (sets ``deleted_at``)."
      operationId: delete_work_session_api_v1_work_sessions__session_id__delete
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: session_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Session Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSession"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/work-sessions/{session_id}/restore:
    post:
      tags:
        - Work Sessions
      summary: Restore Work Session
      description: Restore a previously soft-deleted work session.
      operationId: restore_work_session_api_v1_work_sessions__session_id__restore_post
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: session_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Session Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSession"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/preflight:
    post:
      tags:
        - Dissemination
      summary: Dissemination Preflight
      description: Run sink preflight; return schema diffs and optional memory-only handle.
      operationId: dissemination_preflight_api_v1_dissemination_preflight_post
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Dissemination Preflight Api V1 Dissemination Preflight Post
      security:
        -
                    HTTPBearer: []
  /api/v1/dissemination/send:
    post:
      tags:
        - Dissemination
      summary: Dissemination Send
      description: Send IWXXM via a green preflight handle or inline sink params.
      operationId: dissemination_send_api_v1_dissemination_send_post
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Dissemination Send Api V1 Dissemination Send Post
      security:
        -
                    HTTPBearer: []
  /api/v1/dissemination/plans/{slug}:
    put:
      tags:
        - Dissemination Ops
      summary: Create a dissemination plan
      description: "Create a plan under ``slug`` (unique per user).\n\nPath slug wins over body.slug when they differ."
      operationId: upsert_plan_by_slug_api_v1_dissemination_plans__slug__put
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: slug
                    in: path
                    required: true
                    schema:
                      type: string
                      title: Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisseminationPlanCreate"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisseminationPlanOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/plans/{plan_id}:
    get:
      tags:
        - Dissemination Ops
      summary: Get Plan
      description: Fetch one plan by id (owner-scoped).
      operationId: get_plan_api_v1_dissemination_plans__plan_id__get
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: plan_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Plan Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisseminationPlanOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Dissemination Ops
      summary: Patch Plan
      description: Update plan fields (no secrets).
      operationId: patch_plan_api_v1_dissemination_plans__plan_id__patch
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: plan_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisseminationPlanUpdate"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisseminationPlanOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/plans/{plan_id}/execute:
    post:
      tags:
        - Dissemination Ops
      summary: Execute or dry-run a plan
      description: "Execute or dry-run a plan; persist redacted audit rows per receipt.\n\nDefault ``dry_run=true`` so operators can exercise audit without egress."
      operationId: execute_plan_route_api_v1_dissemination_plans__plan_id__execute_post
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: plan_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanExecuteRequest"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanExecuteResponse"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/audit:
    get:
      tags:
        - Dissemination Ops
      summary: List Audit
      description: List redacted delivery audit rows for the caller.
      operationId: list_audit_api_v1_dissemination_audit_get
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: product
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          type: string
                        -
                                          type: null
                      title: Product
        -
                    name: station
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          type: string
                        -
                                          type: null
                      title: Station
        -
                    name: profile
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          type: string
                        -
                                          type: null
                      title: Profile
        -
                    name: status
                    in: query
                    required: false
                    schema:
                      anyOf:
                        -
                                          type: string
                        -
                                          type: null
                      title: Status
        -
                    name: page
                    in: query
                    required: false
                    schema:
                      type: integer
                      minimum: 1
                      default: 1
                      title: Page
        -
                    name: limit
                    in: query
                    required: false
                    schema:
                      type: integer
                      maximum: 100
                      minimum: 1
                      default: 20
                      title: Limit
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/audit/{audit_id}:
    get:
      tags:
        - Dissemination Ops
      summary: Get Audit
      description: Fetch one audit row (owner-scoped).
      operationId: get_audit_api_v1_dissemination_audit__audit_id__get
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: audit_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Audit Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecordOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/mappings/{name}:
    put:
      tags:
        - Dissemination Ops
      summary: Upsert Mapping
      description: Create MappingConfig by name (unique per user).
      operationId: upsert_mapping_api_v1_dissemination_mappings__name__put
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: name
                    in: path
                    required: true
                    schema:
                      type: string
                      title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingConfigCreate"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingConfigOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/mappings/{mapping_id}:
    get:
      tags:
        - Dissemination Ops
      summary: Get Mapping
      description: Fetch MappingConfig by id.
      operationId: get_mapping_api_v1_dissemination_mappings__mapping_id__get
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: mapping_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Mapping Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingConfigOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Dissemination Ops
      summary: Patch Mapping
      description: Update MappingConfig fields.
      operationId: patch_mapping_api_v1_dissemination_mappings__mapping_id__patch
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: mapping_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Mapping Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingConfigUpdate"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingConfigOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/dissemination/gateways/health:
    get:
      tags:
        - Dissemination Ops
      summary: Gateway connectivity
      description: "Connectivity checks for known gateway kinds.\n\nAMHS, SWIM, and AFS stay unsuccessful until a live pathway is configured.\nOther kinds report that no live probe is configured."
      operationId: gateways_health_api_v1_dissemination_gateways_health_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealthListResponse"
      security:
        -
                    HTTPBearer: []
  /api/v1/profiles/catalog:
    get:
      tags:
        - Conversion Profiles
      summary: Get Catalog
      description: "Read-only ConversionProfile catalog for the authenticated Profiles inspector.\n\nRequires JWT so the inspector stays on the authenticated Profiles surface."
      operationId: get_catalog_api_v1_profiles_catalog_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCatalogResponse"
      security:
        -
                    HTTPBearer: []
  /api/v1/profiles/rule-packs:
    get:
      tags:
        - Conversion Profiles
      summary: List Rule Packs
      description: List rule packs owned by the caller.
      operationId: list_rule_packs_api_v1_profiles_rule_packs_get
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePackListResponse"
      security:
        -
                    HTTPBearer: []
    post:
      tags:
        - Conversion Profiles
      summary: Create Rule Pack
      description: Create a rule pack.
      operationId: create_rule_pack_api_v1_profiles_rule_packs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePackCreate"
        required: true
      responses:
        201:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePackOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        -
                    HTTPBearer: []
  /api/v1/profiles/rule-packs/{pack_id}:
    get:
      tags:
        - Conversion Profiles
      summary: Get Rule Pack
      description: Fetch one rule pack.
      operationId: get_rule_pack_api_v1_profiles_rule_packs__pack_id__get
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: pack_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Pack Id
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePackOut"
        422:
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Conversion Profiles
      summary: Patch Rule Pack
      description: Update a rule pack.
      operationId: patch_rule_pack_api_v1_profiles_rule_packs__pack_id__patch
      security:
        -
                    HTTPBearer: []
      parameters:
        -
                    name: pack_id
                    in: path
                    required: true
                    schema:
                      type: string
                      format: uuid
                      title: Pack Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePackUpdate"
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePackOut"
        422:
          description: Validation Error
          content:
