          description: Concise suggested fix for the user
          examples:
            - Start the report with METAR or SPECI and a valid ICAO code
        code:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Code
          description: Machine-readable issue code
          examples:
            - MISSING_KEYWORD
            - INVALID_ICAO_FORMAT
        severity:
          $ref: "#/components/schemas/ConversionIssueSeverity"
          description: Issue severity
          default: error
        layer:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Layer
          description: Validation layer associated with the issue
          examples:
            - airport_icao
            - tac_syntax
        location:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Location
          description: Optional location context from parser/validator
          examples:
            - "line 1, column 12"
        start:
          anyOf:
            -
                            type: integer
                            minimum: 0.0
            -
                            type: null
          title: Start
          description: Optional inclusive character offset into the source TAC
        end:
          anyOf:
            -
                            type: integer
                            minimum: 0.0
            -
                            type: null
          title: End
          description: Optional exclusive character offset into the source TAC
      type: object
      required:
        - source
        - message
      title: ConversionIssue
      description: Structured issue for a single conversion input item.
    ConversionIssueSeverity:
      type: string
      enum:
        - critical
        - error
        - warning
        - info
      title: ConversionIssueSeverity
      description: Severity level for conversion and validation issues.
    ConversionResponse:
      properties:
        results:
          items:
            $ref: "#/components/schemas/ConversionResult"
          type: array
          title: Results
          description: Successfully converted IWXXM XML documents
        errors:
          items:
            type: string
          type: array
          title: Errors
          description: Error messages for failed conversions
        issues:
          items:
            $ref: "#/components/schemas/ConversionIssue"
          type: array
          title: Issues
          description: Structured issues (errors/warnings/info) for failed or partial conversions
        total_processed:
          type: integer
          minimum: 0.0
          title: Total Processed
          description: Total number of inputs processed (manual_text + files)
          examples:
            - 2
            - 5
        successful:
          type: integer
          minimum: 0.0
          title: Successful
          description: Number of successful conversions
          examples:
            - 2
            - 4
        failed:
          type: integer
          minimum: 0.0
          title: Failed
          description: Number of failed conversions
          examples:
            - 0
            - 1
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: "Echoed request metadata such as bulletin_id, issuing_center, and validation options"
        ok:
          anyOf:
            -
                            type: boolean
            -
                            type: null
          title: Ok
          description: Soft-preview envelope flag; set when preview=true
        failed_spans:
          items:
            $ref: "#/components/schemas/FailedSpan"
          type: array
          title: Failed Spans
          description: Soft-preview failed character spans; empty when preview omitted/false
        group_trace:
          items:
            $ref: "#/components/schemas/GroupTrace"
          type: array
          title: Group Trace
          description: Preview pairing of TAC groups to IWXXM elements. Empty when preview is omitted or the product has no pairing.
        raised_severities:
          items:
            type: string
          type: array
          title: Raised Severities
          description: Severities considered raised for this response given Strict and step flags. All issues remain in issues arrays.
      type: object
      required:
        - total_processed
        - successful
        - failed
      title: ConversionResponse
      description: Response from conversion endpoint with results and errors.
      example:
        errors: []
        failed: 0
        issues: []
        results:
          -
                        content: "<?xml version='1.0' encoding='utf-8'?>..."
                        name: manual_input.txt
                        size_bytes: 1452
                        source: manual
          -
                        content: "<?xml version='1.0' encoding='utf-8'?>..."
                        name: EGLL_231750Z.txt
                        size_bytes: 1389
                        source: EGLL.txt
        successful: 2
        total_processed: 2
