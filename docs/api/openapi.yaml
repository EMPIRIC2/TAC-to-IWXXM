components:
  schemas:
    AggregatedValidationResult:
      properties:
        passed:
          type: boolean
          title: Passed
          description: Whether all layers passed
        layers_validated:
          items:
            $ref: "#/components/schemas/src__schemas__validation__ValidationLayer"
          type: array
          title: Layers Validated
          description: Layers validated
        total_issues:
          type: integer
          minimum: 0.0
          title: Total Issues
          description: Total issues
          default: 0
        results:
          items:
            $ref: "#/components/schemas/ValidationResult"
          type: array
          title: Results
        execution_time_ms:
          type: number
          minimum: 0.0
          title: Execution Time Ms
          default: 0
        validated_at:
          type: string
          format: date-time
          title: Validated At
      type: object
      required:
        - passed
        - layers_validated
      title: AggregatedValidationResult
      description: Combined results from multiple validation layers.
      example:
        execution_time_ms: 13.5
        layers_validated:
          - airport_icao
          - tac_syntax
          - xml_wellformed
        passed: false
        results:
          -
                        execution_time_ms: 5.2
                        issues: []
                        layer: airport_icao
                        passed: true
          -
                        execution_time_ms: 8.3
                        issues:
                          -
                                            code: INVALID_TAC_FORMAT
                                            layer: tac_syntax
                                            level: error
                                            location: "line 1, column 18"
                                            message: "Invalid TAC format: missing wind speed"
                                            suggestion: Check wind speed component
                        layer: tac_syntax
                        passed: false
        total_issues: 2
        validated_at: "2026-02-10T14:30:45.123456"
    AuditListResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditRecordOut"
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
      type: object
      required:
        - items
        - total
        - page
        - limit
      title: AuditListResponse
      description: Paginated audit list.
    AuditRecordOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        message_id:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Message Id
        station:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Station
        profile:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Profile
        iwxxm_version:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Iwxxm Version
        product:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Product
        status:
          type: string
          title: Status
        gateway:
          type: string
          title: Gateway
        detail:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Detail
        destinations:
          additionalProperties: true
          type: object
          title: Destinations
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - user_id
        - status
        - gateway
        - created_at
      title: AuditRecordOut
      description: Persisted delivery audit row. BYOC secrets and URIs are omitted.
    BatchValidationRequest:
      properties:
        items:
          items:
            $ref: "#/components/schemas/ValidationRequest"
          type: array
          maxItems: 100
          minItems: 1
          title: Items
          description: Items to validate
        layers:
          anyOf:
            -
                            items:
                              $ref: "#/components/schemas/ValidationLayer-Input"
                            type: array
            -
                            type: null
          title: Layers
          description: Layers to apply to all items (None = all layers)
      type: object
      required:
        - items
      title: BatchValidationRequest
      description: Request to validate multiple inputs.
      example:
        items:
          -
                        content: METAR KJFK 231751Z 18012KT 10SM FEW040 15/07 A3005
                        content_type: tac
          -
                        content: METAR EGLL 231750Z 17008KT 9999 SCT035 12/08 Q1007
                        content_type: tac
        layers:
          - airport_icao
          - tac_syntax
    BatchValidationResponse:
      properties:
        results:
          items:
            $ref: "#/components/schemas/AggregatedValidationResult"
          type: array
          title: Results
          description: Validation results for each item
        total_items:
          type: integer
          minimum: 0.0
          title: Total Items
          description: Total items requested
        passed_items:
          type: integer
          minimum: 0.0
          title: Passed Items
          description: Number of items that passed
        failed_items:
          type: integer
          minimum: 0.0
          title: Failed Items
          description: Number of items that failed
        total_execution_time_ms:
          type: number
          minimum: 0.0
          title: Total Execution Time Ms
          description: Total execution time
      type: object
      required:
        - results
        - total_items
        - passed_items
        - failed_items
        - total_execution_time_ms
      title: BatchValidationResponse
      description: Response from batch validation.
      example:
        failed_items: 1
        passed_items: 1
        results:
          -
                        execution_time_ms: 15.2
                        layers_validated:
                          - airport_icao
                          - tac_syntax
                        passed: true
                        results: []
                        total_issues: 0
        total_execution_time_ms: 30.5
        total_items: 2
    Body_convert_api_v1_convert_post:
      properties:
        manual_text:
          type: string
          title: Manual Text
          description: Optional manual text input (METAR TAC format)
          default: ""
        iwxxm_version:
          type: string
          title: Iwxxm Version
          description: "Target IWXXM version: 2025-2 (latest), 2023-1 (previous), or 2025-1 (auto-remaps to 2025-2)"
          default: ""
        validate_output:
          type: boolean
          title: Validate Output
          description: Enable full 7-layer IWXXM validation after conversion
          default: false
        validation_level:
          type: string
          title: Validation Level
          description: "Validation depth: basic, schema, schematron, icao_opmet, comprehensive"
          default: basic
        stop_on_error:
          type: boolean
          title: Stop On Error
          description: Stop processing remaining inputs after first error
          default: false
        bulletin_id:
          type: string
          title: Bulletin Id
          description: Optional bulletin identifier
          default: ""
        issuing_center:
          type: string
          title: Issuing Center
          description: Optional issuing centre ICAO code
          default: ""
        lint:
          type: boolean
          title: Lint
          description: Run TAC validation before conversion. On by default.
          default: true
        product:
          type: string
          title: Product
          description: "TAC product type, or iwxxm for XML pass-through (default METAR for legacy clients)"
          default: METAR
        profile:
          type: string
          title: Profile
          description: Rejected. Use conversion_library_id.
          default: ""
        semantic_profile:
          type: string
          title: Semantic Profile
          description: Rejected. Use conversion_library_id.
          default: ""
        exchange_profile:
          type: string
          title: Exchange Profile
          description: Rejected. Use dissemination_library_id for packaging transforms.
          default: ""
        report_variant:
          type: string
          title: Report Variant
          description: Optional profile-scoped report variant within the selected product family (for example LWIS under CA_ECCC + METAR)
          default: ""
        exchange_output:
          type: boolean
          title: Exchange Output
          description: "When true with semantic_profile=CA_ECCC, wrap convert output in MSC COLLECT envelope (inner product validate paths unchanged)"
          default: false
        extensions:
          items:
            type: string
          type: array
          title: Extensions
          description: Optional national extension tokens (e.g. IWXXM_CA for full Canadian validate stack)
          default: []
        preview:
          type: boolean
          title: Preview
          description: "Soft-preview: best-effort IWXXM with failure spans on partial convert"
          default: false
        strict:
          type: boolean
          title: Strict
          description: "When false, only critical and error findings are raised in the client. When true, the full severity set applies subject to step flags, and IWXXM output validation runs when the validate step is on."
          default: false
        strict_lint:
          type: boolean
          title: Strict Lint
          description: "When strict is true, include TAC lint findings in the raised set."
          default: true
        strict_convert:
          type: boolean
          title: Strict Convert
          description: "When strict is true, include convert findings in the raised set."
          default: true
        strict_validate:
          type: boolean
          title: Strict Validate
          description: "When strict is true, include IWXXM validation findings in the raised set and run post-convert validation on convert routes."
          default: true
        include_nil_reasons:
          type: boolean
          title: Include Nil Reasons
          description: "When false, prefer omitting nilReason attributes (engine may still emit NIL report shells)"
          default: true
        emit_translation_centre:
          type: boolean
          title: Emit Translation Centre
