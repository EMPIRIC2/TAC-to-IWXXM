    ValidateRequest:
      properties:
        iwxxm_xml:
          type: string
          minLength: 1
          title: Iwxxm Xml
          description: IWXXM XML content to validate
          examples:
            - "<?xml version='1.0'?><iwxxm:METAR>...</iwxxm:METAR>"
        version:
          type: string
          pattern: "^\\d{4}-\\d+$"
          title: Version
          description: Target IWXXM version
          default: 2025-2
          examples:
            - 2025-2
            - 2023-1
        validation_level:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Validation Level
          description: "Validation depth: 'basic', 'schema', 'schematron', 'icao_opmet', 'comprehensive'"
          default: comprehensive
          examples:
            - basic
            - comprehensive
        stop_on_error:
          type: boolean
          title: Stop On Error
          description: Stop processing on first error
          default: false
        profile:
          type: string
          title: Profile
          description: "Deprecated - use semantic_profile (legacy alias: annex3 or iwxxm_us)"
          default: ""
          examples:
            - annex3
            - iwxxm_us
        semantic_profile:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Semantic Profile
          description: "Semantic profile id (e.g. ICAO_2025, US_FAA_NWS, CA_ECCC, AU_BOM, NZ_CAA_MET, UK_METOFFICE)"
          examples:
            - ICAO_2025
            - US_FAA_NWS
            - CA_ECCC
        exchange_profile:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Exchange Profile
          description: Exchange packaging profile (e.g. GLOBAL_AFS)
          examples:
            - GLOBAL_AFS
        extensions:
          anyOf:
            -
                            items:
                              type: string
                            type: array
            -
                            type: null
          title: Extensions
          description: Optional national extension tokens (e.g. IWXXM_CA for full Canadian validate stack)
          examples:
            -
                            - IWXXM_CA
        product:
          anyOf:
            -
                            type: string
            -
                            type: null
          title: Product
          description: TAC product for Canadian extension XSD selection when extensions include IWXXM_CA
          examples:
            - METAR
            - TAF
      type: object
      required:
        - iwxxm_xml
      title: ValidateRequest
      description: Request for IWXXM validation via JSON body.
      example:
        iwxxm_xml: "<?xml version='1.0'?><iwxxm:METAR>...</iwxxm:METAR>"
        stop_on_error: false
        validation_level: comprehensive
        version: 2025-2
