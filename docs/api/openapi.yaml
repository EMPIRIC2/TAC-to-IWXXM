        - our_elements
        - their_elements
      title: ComparisonDetail
      description: Detailed comparison result between our and reference IWXXM.
      example:
        extra_elements: []
        missing_elements: []
        our_elements: 28
        passed: true
        their_elements: 28
        value_mismatches: []
    ComparisonStatus:
      type: string
      enum:
        - pass
        - fail
        - error
      title: ComparisonStatus
      description: Comparison result status.
    ConversionIssue:
