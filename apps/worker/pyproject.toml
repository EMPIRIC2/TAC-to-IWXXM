[project]
name = "metar-worker"
version = "0.1.0"
description = "Near-real-time Traditional Alphanumeric Code (TAC) ingest worker"
requires-python = ">=3.12"
dependencies = [
    "metar-shared",
    "tac2iwxxm",
    "tac-validate",
    "iwxxm-validate",
    "workflows",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.50",
    "psycopg[binary]==3.3.4",
    "sentry-sdk==2.66.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
]

# App-local paths/markers. Shared ruff/pytest/coverage defaults live in root pyproject.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
]
markers = [
  "unit: fast unit tests",
  "integration: Postgres / container integration",
]

# Makefile worker coverage uses --cov-config=apps/worker/pyproject.toml.
[tool.coverage.run]
branch = true
source = ["src/metar_worker"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Poller accepts heterogeneous JSON payloads from ingest sources.
"src/metar_worker/poller.py" = ["ANN401"]

[tool.uv.sources]
metar-shared = { workspace = true }
tac2iwxxm = { workspace = true }
tac-validate = { workspace = true }
iwxxm-validate = { workspace = true }
workflows = { workspace = true }
