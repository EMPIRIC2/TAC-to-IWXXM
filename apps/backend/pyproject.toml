[project]
name = "metar-backend"
version = "0.1.0"
description = "HTTP API that turns Traditional Alphanumeric Code (TAC) into IWXXM XML"
requires-python = ">=3.12"
dependencies = [
    "metar-shared",
    "tac2iwxxm",
    "tac-decoding",
    "tac-validate",
    "iwxxm-validate",
    "iwxxm-dissemination",
    "auth",
    "fastapi==0.137.0",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "msgspec==0.21.1",
    "pyjwt==2.13.0",
    "python-jose[cryptography]==3.5.0",
    "httpx==0.28.1",
    "requests==2.34.2",
    "prometheus-client==0.25.0",
    "lxml==6.1.1",
    "skyfield==1.54",
    "sqlalchemy==2.0.50",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",
    "slowapi==0.1.10",
    "redis==8.1.0",
    "sentry-sdk[fastapi]==2.66.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "locust==2.44.3",
    "httpx==0.28.1",
    "httpx2==2.4.0",
    "requests==2.34.2",
    "skyfield==1.54",
    "fakeredis==2.37.0",
]

# App-local paths/markers for `cd apps/backend` runs. Shared ruff/pytest/coverage
# defaults live in the root pyproject (ADR-048 / ADR-037).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--tb=short",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "h0i: H0i cross-package connectivity gate (in-process)",
    "e2e: end-to-end tests",
    "smoke: quick smoke tests for CI/CD pipelines (~30 seconds)",
    "asyncio: async tests",
    "edge_case: known failures and edge cases under investigation",
    "slow: slow-running tests that may be skipped in fast CI runs",
    "live_api: tests that make real HTTP requests to external APIs",
    "iwxxm_2023_1: tests specific to IWXXM 2023-1 version",
    "iwxxm_2025_2: tests specific to IWXXM 2025-2 version",
    "ev032_smoke: EV-032 path-filtered pre-commit canary (A6-2 / VONA; E32-T7)",
    "schemathesis: F34 Schemathesis OpenAPI property suite (EV-059 / #727)",
]
filterwarnings = [
    "error",
]

# Makefile `test-unit-backend` uses --cov-config=pyproject.toml (this file).
[tool.coverage.run]
branch = true
source = ["src"]
concurrency = ["thread", "greenlet"]
omit = [
    "src/**/__main__.py",
    "src/__main__.py",
    "*/test_*.py",
    "tests/*",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    # typing.Protocol method stubs (e.g. src/utilities/xml_types.py) have no runtime body.
    "^\\s+\\.\\.\\.$",
]
precision = 2

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

[tool.ruff.lint]
# Append only — do not replace the root pyproject ignore list (ADR-048 D ignores).
extend-ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "W293", "F841", "E722", "F811", "F401", "E712", "ANN", "D"]
"src/routers/**" = ["B008"]
"src/utilities/security.py" = ["B008"]
"src/config/icao_opmet.py" = ["F601"]

[tool.uv.sources]
tac2iwxxm = { workspace = true }
tac-decoding = { workspace = true }
metar-shared = { workspace = true }
auth = { workspace = true }
tac-validate = { workspace = true }
iwxxm-validate = { workspace = true }
iwxxm-dissemination = { workspace = true }

# deptry: unused (DEP002), missing (DEP001), transitive (DEP003), misplaced-dev (DEP004).
# [Corpus: tech-spec] docs/technical-requirements.md; [Corpus: system-spec] docs/architecture.md.
# Run all members: scripts/ci/run_deptry_all.sh
[tool.deptry]
known_first_party = ["api", "api_deps", "api_wire", "clients", "config", "metar_iwxxm_api", "models", "msgspec_http", "routers", "schemas", "services", "utilities", "validation", "src"]
pep621_dev_dependency_groups = ["dev"]
package_module_name_map = { "iwxxm-dissemination" = "dissemination" }

[tool.deptry.per_rule_ignores]
# python-multipart: FastAPI form parsing; psycopg/asyncpg: SQLAlchemy driver plugins. Baseline debt: python-jose, pyjwt, redis, skyfield have no import in src/ (tests only or dead) — prune in a follow-up.
DEP002 = ["python-multipart", "python-jose", "pyjwt", "psycopg", "asyncpg", "redis", "skyfield"]
# Baseline debt: starlette (via fastapi), yaml (pyyaml), dotenv are imported but not declared directly.
DEP003 = ["starlette", "yaml", "dotenv"]
# Baseline debt: a src/ module imports pytest (testing helpers).
DEP004 = ["pytest"]
