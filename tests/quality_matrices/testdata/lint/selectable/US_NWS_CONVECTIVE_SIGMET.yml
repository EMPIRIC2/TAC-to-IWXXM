rule_id: US_NWS_CONVECTIVE_SIGMET
engine: lint
cases:
- bucket: happy
  case_id: '01'
  status: ready
  tac: |
    WSUS32 KKCI 231555
    SIGC
    CONVECTIVE SIGMET 75C
    VALID UNTIL 1755Z
    TX
    FROM 30SW GCK-30SW GCK
    AREA TS MOV FROM 21030KT. TOPS TO FL320.
  expect:
    accept: true
  meta:
    product: SIGMET
    profile: US_NWS_CONVECTIVE_SIGMET

